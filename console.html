<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>novi | Intelligence console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a4d8c'/%3E%3Ctext x='16' y='23' font-family='Segoe UI,Arial' font-size='20' font-weight='700' fill='%23fff' text-anchor='middle'%3En%3C/text%3E%3C/svg%3E">
<style>
:root{
  --b:#0b5bd3;--b2:#1b80ed;--d:#073b8e;--dd:#062e70;
  --ink:#172033;--muted:#64748b;--line:#dbe5f0;--bg:#f4f7fb;--white:#fff;
  --ok:#087f5b;--warn:#a16207;--hot:#e11d48;
  --acc:#f5a623;
  --radius:11px;--max:1280px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none;cursor:pointer}
img{max-width:100%}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- chrome ---------- */
.topbar{background:var(--dd);color:#dcecff;font-size:12px}
.topbar .wrap{display:flex;justify-content:space-between;padding:8px 24px}
.header{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.header .wrap{display:flex;align-items:center;gap:22px;padding:14px 24px}
.logo{font-size:25px;font-weight:800;color:var(--b);letter-spacing:-.5px;white-space:nowrap}
.logo i{color:#13a6df;font-style:normal}
.searchbox{flex:1;position:relative}
.searchbox input{width:100%;padding:11px 44px 11px 14px;border:1px solid #b9c9dc;border-radius:8px}
.searchbox input:focus{outline:2px solid var(--b);outline-offset:-1px}
.searchbox .go{position:absolute;right:4px;top:4px;height:33px;width:37px;background:var(--b);color:#fff;border:0;border-radius:6px}
.ac{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 18px 44px #16305514;overflow:hidden;z-index:50;display:none}
.ac.open{display:block}
.ac div{padding:10px 14px;border-bottom:1px solid #eef3f9;font-size:13px}
.ac div:hover{background:#f1f7ff}
.ac b{color:var(--d)}
.hnav{display:flex;gap:16px;align-items:center;font-size:13px;color:#34445d;white-space:nowrap}
.cartbtn{border:0;background:#fff;color:var(--b);font-weight:700;display:flex;gap:6px;align-items:center}
.pill{background:var(--hot);color:#fff;border-radius:99px;padding:2px 7px;font-size:11px;font-weight:700}
.mainnav{background:#fff;border-bottom:1px solid var(--line)}
.mainnav .wrap{display:flex;gap:20px;padding:9px 24px;font-size:13px;color:#3c4d67;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mainnav .wrap::-webkit-scrollbar{display:none}
.mainnav .wrap a{white-space:nowrap;flex:0 0 auto}
.mainnav a:hover{color:var(--b)}
.mainnav a.on{color:var(--b);font-weight:700}
.crumb{color:var(--muted);font-size:12px;padding:16px 0 0}
.crumb a:hover{color:var(--b);text-decoration:underline}

/* ---------- generic ---------- */
.btn{border-radius:7px;padding:10px 15px;font-weight:700;border:1px solid transparent}
.btn.pri{background:var(--b);color:#fff;border-color:var(--b)}
.btn.pri:hover{background:var(--d)}
.btn.out{background:#fff;color:var(--b);border-color:var(--b)}
.btn.out:hover{background:#eef5ff}
.btn.ghost{background:#fff;color:#33455f;border-color:#c3d2e3}
.btn.wide{width:100%}
.btn.lg{padding:13px 18px;font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
h1,h2,h3{margin:0}
.h1{font-size:32px;letter-spacing:-1px;margin:0 0 6px}
.h2{font-size:22px;letter-spacing:-.4px;margin:0}
.sub{color:var(--muted);font-size:13px}
.sectionhead{display:flex;justify-content:space-between;align-items:flex-end;margin:26px 0 14px;gap:16px}
.grid{display:grid;gap:15px}
.tag{background:#e7f1ff;color:var(--d);border-radius:4px;padding:4px 7px;font-size:10px;font-weight:800;letter-spacing:.2px}
.tag.sp{background:#f1f5f9;color:#5b6b82}
.tag.hot{background:#ffe9ef;color:#b1123c}

/* ---------- product visual ----------
   Every product image is inline SVG drawn at render time. The .viz box sets the
   footprint and the SVG scales into it, so one drawing serves a 66px thumbnail
   and a 340px gallery without a second asset. */
.viz{background:radial-gradient(120% 96% at 50% 8%,#ffffff 0%,#f4f8fc 46%,#e7eef6 100%);
  border-radius:10px;display:grid;place-items:center;position:relative;overflow:hidden}
.viz:after{content:"";position:absolute;inset:0;border-radius:10px;
  box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px #0a2a4a08;pointer-events:none}
.viz .pa{width:100%;height:100%;display:block;padding:6%;box-sizing:border-box}
.pcard:hover .viz .pa,.card.prod:hover .viz .pa{transform:scale(1.035)}
.viz .pa{transition:transform .25s ease}
.viz .badge{position:absolute;top:9px;left:9px;z-index:2}
.dicon{width:26px;height:26px;display:block;color:var(--b)}

/* ---------- product card ---------- */
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;position:relative;transition:.16s}
.pcard:hover{box-shadow:0 14px 38px #142d5518;transform:translateY(-2px)}
.pcard .viz{height:158px;margin-bottom:12px}
.pbrand{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.pname{font-size:15px;font-weight:700;margin:5px 0 4px;line-height:1.25}
.stars{color:#f0a500;font-size:12px;letter-spacing:-1px}
.rline{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:9px}
.specrow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
.spec{background:#f1f5f9;border-radius:4px;padding:4px 6px;font-size:11px;color:#52627b;white-space:nowrap}
.price{font-size:21px;font-weight:800;margin-top:auto;display:flex;align-items:baseline;gap:7px}
.was{font-size:11px;color:var(--muted);text-decoration:line-through;font-weight:400}
.fin{font-size:11px;color:#42546e;margin-top:2px}
.delivery{font-size:11px;color:var(--ok);font-weight:650;margin:6px 0 11px}
.pactions{display:flex;gap:6px}
.pactions .btn{flex:1;padding:9px 4px;font-size:12px}
.cmpline{font-size:11px;margin-top:10px;color:#52627b;display:flex;gap:6px;align-items:center}

/* ---------- layout: browse ---------- */
.shop{display:grid;grid-template-columns:242px minmax(0,1fr);gap:24px;align-items:start;padding-bottom:60px}
.shopside{position:sticky;top:126px;min-width:0}
.shopside .facets{position:static;top:auto}
.facets{padding:18px;position:sticky;top:126px}
.facets h3{font-size:14px;margin:0 0 4px}
.fgroup{border-top:1px solid var(--line);padding:13px 0}
.fgroup:first-of-type{border:0}
.fgroup b{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#42516a}
.fgroup label{display:flex;gap:8px;align-items:center;margin:9px 0;color:#42516a;font-size:13px;cursor:pointer}
.fgroup input{accent-color:var(--b)}
.fgroup .cnt{margin-left:auto;color:#93a3b8;font-size:11px}
.prices{display:flex;gap:6px;margin-top:9px}
.prices input{width:50%;padding:8px;border:1px solid var(--line);border-radius:5px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#e8f2ff;border:1px solid #bfd9ff;color:var(--d);border-radius:99px;padding:5px 10px;font-size:12px;display:flex;gap:6px;align-items:center}
.chip button{border:0;background:none;color:var(--d);font-weight:800;padding:0}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.pager{display:flex;gap:6px;justify-content:center;align-items:center;margin:28px 0 0}
.pager button{min-width:38px;height:38px;border-radius:7px;border:1px solid var(--line);background:#fff;font-weight:700;color:#3b4d68}
.pager button.on{background:var(--b);color:#fff;border-color:var(--b)}
.pager button:disabled{opacity:.4;cursor:default}
.empty{text-align:center;color:var(--muted);padding:44px 12px;grid-column:1/-1}

/* ---------- home ---------- */
.hero{border-radius:16px;background:linear-gradient(120deg,var(--b),var(--b2));color:#fff;padding:44px 46px;display:flex;justify-content:space-between;gap:20px;overflow:hidden;margin:16px 0 20px}
.hero h1{font-size:38px;line-height:1.05;letter-spacing:-1.4px;margin:0 0 12px;max-width:560px}
.hero p{color:#e4efff;margin:0 0 20px;max-width:520px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{padding:18px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);transition:.15s}
.tile:hover{border-color:var(--b);transform:translateY(-2px)}
.tile b{display:block;margin-bottom:3px}
.tile span{font-size:12px;color:var(--muted)}

/* ---- Full-line retailer: departments, store cards, store home ---------- */
.herorow{margin:16px 0 4px}
.hero2{position:relative;border-radius:16px;background:linear-gradient(120deg,var(--b),var(--b2));color:#fff;
  padding:38px 42px;overflow:hidden;display:flex;align-items:center;gap:26px;min-height:250px}
.herocopy{flex:1 1 auto;min-width:0;position:relative;z-index:2}
.herofan{flex:0 0 46%;position:relative;height:210px;display:block}
.herofan .hf{position:absolute;display:block;filter:drop-shadow(0 16px 26px rgba(4,22,50,.36))}
.herofan .hf svg{width:100%;height:100%}
.herofan .hf0{left:0%;top:6%;width:52%;height:66%;z-index:2}
.herofan .hf1{left:30%;top:36%;width:48%;height:62%;z-index:4}
.herofan .hf2{left:66%;top:4%;width:30%;height:44%;z-index:3}
.herofan .hf3{left:70%;top:50%;width:30%;height:46%;z-index:1}
@media(max-width:1080px){.herofan{display:none}.hero2{min-height:0}}
.hero2 .h1{color:#fff;max-width:620px;margin:0 0 10px}
.hero2 .sub{color:#e4efff;margin:0 0 18px;max-width:560px}
.hero2 .eyebrow{display:inline-block;background:#ffffff28;border-radius:99px;padding:5px 11px;
  font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px}
.hero2 .btn{background:#fff;color:var(--d);border-color:#fff}

.depts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.dept{padding:18px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);
  display:flex;flex-direction:column;gap:5px;transition:.15s}
.dept:hover{border-color:var(--b);transform:translateY(-2px);box-shadow:0 12px 30px #142d5514}
.dept .dicon{width:30px;height:30px;margin-bottom:2px}
.dept b{font-size:14px}
.dept .dsub{font-size:12px;color:var(--muted)}

.grid{grid-template-columns:repeat(4,1fr)}
.card.prod{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  display:flex;flex-direction:column;transition:.16s;cursor:pointer}
.card.prod:hover{box-shadow:0 14px 38px #142d5518;transform:translateY(-2px)}
.card.prod .viz{height:150px;margin-bottom:12px}
.brandline{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.rating{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:9px}
.priceline{font-size:20px;font-weight:800;margin-top:auto;display:flex;align-items:baseline;gap:7px}
.priceline.big{font-size:28px;margin:10px 0 4px}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.seeall{font-size:13px;font-weight:700;color:var(--b);white-space:nowrap}
.notecard{background:#f6f9fd;border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;font-size:13px;color:#42546e;margin:18px 0}
.notecard a{color:var(--b);font-weight:700}
.buyrow{display:flex;gap:9px;margin:16px 0 4px}
.collrail{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.collcard{padding:16px;border-radius:var(--radius);background:linear-gradient(160deg,#f6faff,#fff 62%);
  border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;transition:.15s}
.collcard:hover{border-color:var(--b);transform:translateY(-2px)}
.collcard span:last-child{font-size:12px;color:var(--muted)}

/* ---- Collections ------------------------------------------------------- */
.collgrid{grid-template-columns:repeat(5,1fr)}
.tile.coll{display:flex;flex-direction:column;gap:7px;min-height:132px;justify-content:flex-start;
  background:linear-gradient(160deg,#f6faff,#fff 62%)}
.tile.coll b{font-size:13px;font-weight:600;color:var(--d);line-height:1.35;margin:0}
.tile.coll:hover{box-shadow:0 10px 26px #16305514}
.collbadge{display:inline-block;align-self:flex-start;background:var(--b);color:#fff;font-size:11px;
  font-weight:700;letter-spacing:.02em;padding:4px 9px;border-radius:20px;white-space:nowrap}
.collbadge.lg{font-size:12px;padding:5px 12px}
.collbadge.sm{font-size:10px;padding:3px 8px}
.collhero{background:linear-gradient(120deg,#0b3f8f,#1273d4)}
.collhero .collbadge{background:#ffffff2e;border:1px solid #ffffff5c}
.collnav{margin:0 0 14px;padding:12px 15px;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
.collnavlab{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);margin-bottom:9px}
.collnavrow{display:flex;gap:8px;flex-wrap:wrap}
.collchip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:22px;cursor:pointer;
  border:1px solid var(--line);background:#f7fafd;font-size:13px;font-weight:600;color:var(--d);transition:.14s}
.collchip:hover{border-color:var(--b);background:#eaf3ff;color:var(--b)}
.collchip.on{background:var(--b);border-color:var(--b);color:#fff}
.collchip.on .ccn{background:#ffffff33;color:#fff}
.collchip.ghost{background:none;font-weight:500;color:var(--muted)}
.ccn{background:#e4edf8;color:var(--muted);border-radius:11px;padding:1px 7px;font-size:11px;font-weight:700}
.achead{padding:8px 14px 5px!important;font-size:10px!important;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted);background:#f7fafd;border-bottom:1px solid #eef3f9}
.achead:hover{background:#f7fafd!important}
.acoll{display:flex;align-items:center;gap:10px;cursor:pointer}
.acollchips{display:flex;flex-wrap:wrap;gap:6px}
.acollchips button{padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;
  font-size:12px;font-weight:600;cursor:pointer;color:var(--d)}
.acollchips button:hover{border-color:var(--b);background:#eaf3ff;color:var(--b)}
.navcoll{font-weight:700!important}

/* ---- retail density ---------------------------------------------------- */
.ribbon{background:#eaf3ff;border-bottom:1px solid #d3e4f7;overflow:hidden}
.ribwrap{max-width:1280px;margin:0 auto;padding:7px 20px;display:flex;gap:10px;align-items:center;
  font-size:12px;color:#12406f;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.ribwrap::-webkit-scrollbar{display:none}
.ribwrap i{color:#9dbbd8;font-style:normal}
.adtile{padding:18px;display:flex;flex-direction:column;gap:7px;justify-content:center;
  border-left:4px solid var(--adc);background:linear-gradient(160deg,#fbfdff,#fff)}
.adtile b{font-size:15px;color:var(--d)}
.adtile p{font-size:12px;color:var(--muted);margin:0;flex:1}
.adtile .btn{align-self:flex-start}
.railad{padding:16px;margin-top:14px;display:flex;flex-direction:column;gap:8px;align-self:start;
  background:linear-gradient(165deg,#f2f8ff,#fff)}
.railad b{font-size:14px}
.railad p{font-size:12px;color:var(--muted);margin:0}
.emailcap{margin-top:26px;padding:20px 22px;border-radius:var(--radius);background:#12305a;color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.emailcap b{display:block;font-size:16px}
.emailcap span{font-size:12.5px;color:#b9cde6}
.ecform{display:flex;gap:8px}
.ecform input{padding:10px 13px;border:1px solid #3a5e91;border-radius:8px;min-width:230px;font-size:13px}
@media(max-width:900px){.collgrid{grid-template-columns:repeat(2,1fr)}}
.promos{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin:18px 0}
.promo{border-radius:var(--radius);padding:22px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:132px}
.promo h3{font-size:19px;margin:0 0 6px;letter-spacing:-.4px}
.promo p{margin:0;font-size:13px;opacity:.9}
.promo.a{background:linear-gradient(130deg,#0b5bd3,#22a3e0)}
.promo.b{background:linear-gradient(130deg,#123a75,#2b6fbb)}
.promo.c{background:linear-gradient(130deg,#0d7a5f,#25b389)}
.railwrap{position:relative}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:230px;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-behavior:smooth}
.helpbar{background:#e8f2ff;border:1px solid #bfd9ff;border-radius:12px;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;margin:18px 0}
.helpbar strong{display:block;font-size:16px}
.helpbar span{font-size:13px;color:#45617e}

/* ---------- PDP ---------- */
.pdp{display:grid;grid-template-columns:1.15fr 1fr;gap:34px;padding:20px 0 40px;align-items:start}
.gallery .viz{height:340px;margin-bottom:10px}
.thumbs{display:flex;gap:9px}
.thumb{width:66px;height:52px;border:1px solid var(--line);border-radius:7px;background:radial-gradient(120% 96% at 50% 8%,#fff,#eef4fa);cursor:pointer;overflow:hidden;display:grid;place-items:center;transition:.15s}
.thumb .pa{width:100%;height:100%;padding:8%;box-sizing:border-box}
.thumb:hover{border-color:#9dbde6}
.thumb.on{border-color:var(--b);box-shadow:0 0 0 2px #bfd9ff}
.buybox{position:sticky;top:126px}
.pdp .price{font-size:30px}
.variants{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.variant{border:1px solid #c3d2e3;border-radius:7px;padding:9px 12px;background:#fff;font-size:12px;text-align:left}
.variant.on{border-color:var(--b);background:#eef5ff;box-shadow:0 0 0 1px var(--b)}
.variant b{display:block;font-size:13px}
.fulfil{border:1px solid var(--line);border-radius:9px;padding:13px;margin:14px 0;display:grid;gap:10px}
.fulfil label{display:flex;gap:9px;align-items:flex-start;font-size:13px;cursor:pointer}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}
.facts>div{background:#f6f8fb;padding:10px;border-radius:7px;font-size:13px}
.facts b{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.spectable{width:100%;border-collapse:collapse;font-size:13px}
.spectable td{padding:10px 8px;border-bottom:1px solid var(--line)}
.spectable td:first-child{color:var(--muted);width:38%}
.spectable td:last-child{font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:30px 0 18px;overflow:auto}
.tabs button{border:0;background:none;padding:11px 15px;font-weight:700;color:#5c6c85;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--b);border-bottom-color:var(--b)}
.ratingsplit{display:grid;grid-template-columns:180px 1fr;gap:26px;align-items:start}
.bigrating{text-align:center}
.bigrating .n{font-size:44px;font-weight:800;line-height:1}
.bar{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:12px;color:var(--muted)}
.bar .track{flex:1;height:8px;background:#eef2f7;border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:#f0a500}
.review{border-top:1px solid var(--line);padding:15px 0}
.review .meta{font-size:12px;color:var(--muted);margin:3px 0 7px}
.qa{border-top:1px solid var(--line);padding:14px 0}
.qa b{display:block;margin-bottom:4px}
.thinnote{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:11px 13px;font-size:12px;margin:14px 0}

/* ---------- compare ---------- */
.cmptable{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.cmptable th,.cmptable td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmptable th{background:#f7fafd;position:sticky;top:118px}
.cmptable td.k{color:var(--muted);width:190px}
.cmptable tr.diff td:not(.k){background:#fffaf0}
.cmpbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#152b4b;color:#fff;padding:12px 18px;border-radius:11px;display:none;gap:14px;align-items:center;z-index:35;box-shadow:0 16px 40px #0a1a3455}
.cmpbar.show{display:flex}
.cmpbar button{border:0;border-radius:6px;padding:8px 13px;font-weight:700}

/* ---------- cart / checkout ---------- */
.twocol{display:grid;grid-template-columns:1fr 340px;gap:26px;align-items:start;padding-bottom:50px}
.lineitem{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.lineitem .viz{width:118px;height:86px;flex:none}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:6px;width:max-content}
.qty button{border:0;background:#fff;width:30px;height:30px;font-weight:800;color:var(--b)}
.qty span{width:32px;text-align:center;font-weight:700}
.summary{padding:18px;position:sticky;top:126px}
.srow{display:flex;justify-content:space-between;padding:7px 0;font-size:13px}
.srow.total{font-size:19px;font-weight:800;border-top:1px solid var(--line);margin-top:9px;padding-top:14px}
.steps{display:flex;gap:8px;margin:8px 0 22px;flex-wrap:wrap}
.step{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.step .n{width:24px;height:24px;border-radius:99px;background:#e6edf6;color:#5c6c85;display:grid;place-items:center;font-size:12px;font-weight:800}
.step.on{color:var(--ink);font-weight:700}
.step.on .n{background:var(--b);color:#fff}
.step.done .n{background:var(--ok);color:#fff}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:#42516a;margin-bottom:5px}
.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:7px}
.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.attach{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:12px;margin:10px 0}

/* ---------- assistant ---------- */
.asstbtn{position:fixed;right:20px;bottom:20px;z-index:36;border:0;border-radius:99px;background:var(--b);color:#fff;padding:13px 19px;font-weight:750;box-shadow:0 14px 34px #0b5bd345;display:flex;gap:8px;align-items:center}
.asst{position:fixed;right:20px;bottom:20px;width:min(390px,calc(100vw - 40px));height:min(560px,calc(100vh - 40px));background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 26px 70px #0a1a3440;z-index:37;display:none;flex-direction:column;overflow:hidden}
.asst.open{display:flex}
.asst .head{background:var(--b);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.asst .head b{font-size:15px}
.asst .body{flex:1;overflow:auto;padding:15px;background:#f7fafd}
.msg{margin-bottom:12px;max-width:88%}
.msg .bub{padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.5}
.msg.a .bub{background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.u{margin-left:auto}
.msg.u .bub{background:var(--b);color:#fff;border-bottom-right-radius:3px}
.sugg{display:flex;gap:7px;flex-wrap:wrap;padding:11px 13px;border-top:1px solid var(--line);background:#fff}
.sugg button{border:1px solid #c3d2e3;background:#fff;border-radius:99px;padding:7px 12px;font-size:12px;color:#33455f;text-align:left}
.sugg button:hover{border-color:var(--b);color:var(--b)}
.asstcard{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:9px}
.asstcard .viz{width:66px;height:50px;flex:none}
.asstcard b{font-size:13px;display:block}
.asstcard small{color:var(--muted)}

/* ---------- research console ---------- */
.modbar{position:fixed;top:0;left:0;right:0;background:#0f2745;color:#dbeafe;z-index:60;display:none;gap:14px;align-items:center;padding:7px 16px;font-size:12px;flex-wrap:wrap}
.modbar.show{display:flex}
.modbar select,.modbar input{background:#17324f;color:#e8f1ff;border:1px solid #2d4a70;border-radius:5px;padding:5px 8px;font-size:12px}
.modbar button{background:#2563eb;border:0;color:#fff;border-radius:5px;padding:5px 11px;font-weight:700;font-size:12px}
.modbar button.gh{background:#22405f}
.modbar .sp{margin-left:auto;display:flex;gap:9px;align-items:center}
.console{padding:22px 0 60px;display:grid;grid-template-columns:1fr 380px;gap:22px;align-items:start}
.panel{padding:18px}
.panel h3{font-size:15px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.evtlog{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px;font:11px/1.5 ui-monospace,Consolas,monospace}
.evtlog div{padding:6px 9px;border-bottom:1px solid #eef3f9;display:flex;gap:9px}
.evtlog .t{color:#93a3b8;flex:none;width:56px}
.evtlog .n{color:var(--d);font-weight:700;flex:none;width:150px}
.evtlog .v{color:#52627b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:14px}
.stat{background:#f6f9fc;border:1px solid var(--line);border-radius:9px;padding:12px}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}

/* ---------- research console v2 ---------- */
.console.wide{grid-template-columns:repeat(auto-fit,minmax(520px,1fr))}
.statgrid.tight{grid-template-columns:repeat(3,1fr);margin-bottom:0}
.statgrid.tight .stat b{font-size:19px}
.ctabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-top:6px}
.ctabs button{border:0;background:none;padding:10px 15px;font-weight:600;font-size:13px;color:var(--muted);
  border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:7px 7px 0 0}
.ctabs button:hover{background:#eef4fb;color:var(--ink)}
.ctabs button.on{color:var(--b);border-bottom-color:var(--b);background:#eff6ff}

.fbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 11px;margin-bottom:5px;
  border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:#fbfdff}
.fbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbar b{flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
.fbar.hit{background:#f0f9f4;border-color:#bfe3cf}
.fbar.hit b{color:var(--ok)}

.heatwrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:
  linear-gradient(#fff,#f2f6fb);aspect-ratio:8/5}
.heatwrap canvas{width:100%;height:100%;display:block}
.heatempty{position:absolute;inset:0;align-items:center;justify-content:center;color:var(--muted);font-size:13px;
  text-align:center;padding:20px}
.heatlegend{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11px;color:var(--muted)}
.heatlegend i{flex:none;width:130px;height:9px;border-radius:5px;
  background:linear-gradient(90deg,#1e50dc,#1ebedc,#4ad23c,#ebd232,#eb3c32)}

.jpath{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.jnode{display:inline-flex;align-items:center;gap:6px;background:#eff6ff;border:1px solid #cfe0f7;color:var(--d);
  border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600}
.jnode i{font-style:normal;background:var(--b);color:#fff;width:17px;height:17px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.jnode.pdp{background:#f0f9f4;border-color:#bfe3cf;color:var(--ok)}
.jnode.pdp i{background:var(--ok)}
.jarrow{color:#9fb3cc;font-size:12px}
.flowrow{display:grid;grid-template-columns:1fr 130px 34px;gap:10px;align-items:center;padding:6px 0;font-size:12px;
  border-bottom:1px solid #eef3f9}
.flowrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flowrow i{font-style:normal;color:#9fb3cc}
.flowrow b{text-align:right;font-variant-numeric:tabular-nums}
.flowbar{background:#eef3f9;border-radius:5px;height:9px;overflow:hidden}
.flowbar div{height:100%;background:linear-gradient(90deg,var(--b2),var(--b))}

.condrow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #eef3f9}
.condrow div{flex:1;min-width:0}
.condrow b{display:block;font-size:13px}
.condrow small{color:var(--muted);font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.condrow.live{background:#eff6ff;border-radius:8px;padding:10px;border-bottom:0}
.swatch{flex:none;width:17px;height:17px;border-radius:5px;border:1px solid #0001}

.cohort{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.5px}
.cohort th,.cohort td{text-align:left;padding:7px 9px;border-bottom:1px solid #eef3f9}
.cohort th{background:#f6f9fc;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.cohort td:not(:first-child){font-variant-numeric:tabular-nums;font-weight:600}

.scrub{width:100%;margin:4px 0 2px}
.evtlog div.now{background:#fff8e1;border-left:3px solid var(--acc)}

/* ---------- overlays ---------- */
.back{position:fixed;inset:0;background:#0a1a347a;z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
.back.open{display:flex}
.modal{background:#fff;border-radius:15px;width:min(720px,100%);max-height:88vh;overflow:auto;padding:26px;position:relative}
.modal.sm{width:min(460px,100%)}
.x{position:absolute;right:15px;top:12px;border:0;background:none;font-size:25px;color:var(--muted);line-height:1}
.drawer{position:fixed;right:0;top:0;height:100%;width:min(410px,100%);background:#fff;z-index:65;box-shadow:-14px 0 40px #0a1a3428;padding:24px;transform:translateX(100%);transition:.24s;overflow:auto}
.drawer.open{transform:translateX(0)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:#15345c;color:#fff;padding:12px 18px;border-radius:9px;z-index:80;display:none;box-shadow:0 12px 30px #0a1a3440}
.toast.show{display:block}
.qsteps{display:grid;gap:18px}
.qopts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}

.qopts button.on{border-color:var(--b);background:#e8f2ff;color:var(--d)}

.footer{background:#0f2036;color:#a9bdd5;margin-top:40px;padding:34px 0 26px;font-size:13px}
.footer .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.footer b{color:#fff;display:block;margin-bottom:9px;font-size:13px}
.footer a{display:block;padding:3px 0;color:#a9bdd5}
.footer a:hover{color:#fff}
.footer .legal{border-top:1px solid #24384f;margin-top:24px;padding-top:16px;color:#7e93ab;font-size:12px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* ---------- added: prototype + mission bars, assistant hedge ---------- */
.missionbar{display:none;background:#fff7ed;border-bottom:1px solid #fed7aa;color:#7c2d12;font-size:13px}
.missionbar.show{display:block}
.missionbar .wrap{padding:9px 24px;display:flex;gap:10px;align-items:center}
.missionbar b{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#9a3412}
.donetag{margin-left:auto;background:var(--ok);color:#fff;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:800}
body.hasmod .header{top:var(--modh,38px)}
body.hasmod{padding-top:var(--modh,38px)}
.hedge{display:block;margin-top:8px;font-size:11px;font-weight:700;color:#9a3412}
.msg .bub b{font-weight:750}
.asst .sugg input:focus{outline:2px solid var(--b);outline-offset:-1px}

/* ---------- homepage: carousel ---------- */
.carousel{position:relative;border-radius:16px;overflow:hidden;margin:16px 0 18px;height:330px}
.cslide{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:40px 46px;color:#fff;opacity:0;transition:opacity .5s;pointer-events:none}
.cslide.on{opacity:1;pointer-events:auto}
.ctext{max-width:590px}
.ctag{display:inline-block;background:#ffffff2e;border:1px solid #ffffff5c;border-radius:99px;padding:5px 12px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin-bottom:14px}
.cslide h1{font-size:38px;line-height:1.05;letter-spacing:-1.4px;margin:0 0 10px}
.cslide p{margin:0 0 20px;color:#eaf2ff;font-size:15px;max-width:480px}
.cnav{position:absolute;bottom:14px;width:34px;height:34px;border-radius:99px;border:1px solid #ffffff4d;background:#ffffff26;color:#fff;font-size:20px;line-height:1}
.cnav:hover{background:#ffffff4d}
.cnav.prev{right:60px}
.cnav.next{right:18px}
.cdots{position:absolute;bottom:16px;left:46px;display:flex;gap:7px}
.cdots button{width:9px;height:9px;border-radius:99px;border:0;background:#ffffff70;padding:0}
.cdots button.on{background:#fff;width:26px}

/* ---------- homepage: category strip ---------- */
.catstrip{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:20px}
.catstrip a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 8px;text-align:center;transition:.15s}
.catstrip a:hover{border-color:var(--b);transform:translateY(-2px)}
.catstrip .ico{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 8px;border-radius:99px;background:#eaf2ff}
.catstrip svg{width:22px;height:22px;fill:none;stroke:var(--b);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.catstrip b{font-size:12px;color:#33455f;display:block}

/* ---------- homepage: deal of the day ---------- */
.dotd{display:grid;grid-template-columns:400px 1fr;gap:28px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;align-items:center;margin:22px 0}
.dotdviz{position:relative;background:linear-gradient(160deg,#fbfdff,#eef4fa);border-radius:11px;height:250px;display:grid;place-items:center}
.dotdflag{position:absolute;top:12px;left:12px;background:var(--hot);color:#fff;border-radius:6px;padding:6px 11px;font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.soldbar{height:8px;background:#eef2f7;border-radius:99px;overflow:hidden;max-width:340px}
.soldbar span{display:block;height:100%;background:linear-gradient(90deg,#e8113c,#ff6a3d)}

/* ---------- homepage: banners, brands, services ---------- */
.dualbanner{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}
.dbanner{border-radius:var(--radius);padding:26px;background:linear-gradient(120deg,#10294a,#1e4f8a);color:#fff;display:block;transition:.15s}
.dbanner.alt{background:linear-gradient(120deg,#0f3d33,#1d7f66)}
.dbanner:hover{transform:translateY(-2px)}
.dbtag{display:inline-block;background:#ffffff2b;border-radius:99px;padding:4px 10px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:11px}
.dbanner b{display:block;font-size:19px;letter-spacing:-.4px;margin-bottom:5px}
.dbanner span{font-size:13px;color:#d6e5f7}
.brandstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.brandstrip a{background:#fff;border:1px solid var(--line);border-radius:11px;padding:18px 12px;text-align:center;transition:.15s;border-top:3px solid hsl(var(--bh),62%,50%)}
.brandstrip a:hover{transform:translateY(-2px);box-shadow:0 12px 30px #142d5514}
.brandstrip b{display:block;font-size:14px}
.brandstrip span{font-size:11px;color:var(--muted)}
.svcs{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:26px 0}
.svc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px}
.svc b{display:block;font-size:13px;margin-bottom:3px}
.svc span{font-size:11px;color:var(--muted);line-height:1.45}
.signup{background:#0f2036;color:#fff;border-radius:var(--radius);padding:26px 30px;display:flex;justify-content:space-between;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:40px}
.signup b{display:block;font-size:19px;letter-spacing:-.4px;margin-bottom:4px}
.signup span{font-size:13px;color:#a9bdd5}
.signupform{display:flex;gap:8px}
.signupform input{padding:12px 14px;border:1px solid #2b4667;border-radius:8px;background:#152c4b;color:#fff;width:250px}
.signupform input::placeholder{color:#7e93ab}
.chip button:hover{color:var(--hot)}

@media(max-width:980px){

.collbadge.inbuybox{display:inline-flex;align-items:center;align-self:flex-start;width:max-content;max-width:100%;
  margin:0 0 10px;cursor:pointer;white-space:nowrap;text-decoration:none;flex:0 0 auto;line-height:1.4}
.fresh{font-weight:700}
.fresh.ok{color:var(--ok)}
.fresh.warn{color:var(--warn)}

  border-radius:0 7px 7px 0;font-size:13.5px;line-height:1.5;color:#173650}
.answerfirst{margin:16px 0 0;font-size:15px;line-height:1.6;color:#1b2a3a}
.fit{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 4px}
.fitcol{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:#fff}
.fitcol h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.fitcol.good h3{color:var(--ok)}
.fitcol.bad h3{color:var(--warn)}
.fitcol ul{margin:0;padding-left:17px}
.fitcol li{font-size:13.5px;line-height:1.75;color:#33465a}
.proof{display:grid;gap:9px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.proof div{display:flex;flex-direction:column}
.proof b{font-size:13.5px;color:#12263a}
.proof span{font-size:12px;color:var(--mut)}
.spectable.benefit .means{display:block;margin-top:3px;font-size:12.5px;color:var(--mut);line-height:1.5}
.schemabox{margin:26px 0 8px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;padding:13px 16px}
.schemabox summary{cursor:pointer;font-weight:700;font-size:14px;color:#12263a}
.schemacount{font-weight:400;color:var(--mut);font-size:12.5px;margin-left:6px}
.schemabox pre{margin:11px 0 2px;padding:13px;background:#0f2233;color:#cfe6ff;border-radius:8px;
  font-size:11.5px;line-height:1.55;overflow:auto;max-height:340px}
@media(max-width:760px){.fit{grid-template-columns:1fr}}

/* ======================================================================
   Intelligence console
   The moderator screen is a different product from the storefront, so it
   gets its own chrome. Dark, dense, instrument-like, and stripped of the
   retail furniture that would only confuse a room watching a study.
   ====================================================================== */
body.consolemode{background:#0b1220;color:#e6edf6}
body.consolemode .topbar,body.consolemode .header,body.consolemode .mainnav,
body.consolemode .promoribbon,body.consolemode .ribbon,body.consolemode .footer,body.consolemode .asstfab,
body.consolemode .asstbtn,body.consolemode .asstwrap,body.consolemode .asstpanel{display:none !important}
body.consolemode .wrap{max-width:1560px}
body.consolemode .sectionhead{margin-top:0;border:0}
body.consolemode .h1{color:#fff;letter-spacing:-.6px}
body.consolemode .sub{color:#8ea3bd}
body.consolemode .card,body.consolemode .panel{background:#111c2e;border:1px solid #1e2d45;
  border-radius:12px;box-shadow:0 10px 30px #00000038;color:#e6edf6}
body.consolemode .panel h3{color:#fff;font-size:14px;letter-spacing:.2px}
body.consolemode .ctabs{border-bottom:1px solid #1e2d45;gap:2px}
body.consolemode .ctabs button{color:#8ea3bd;border-radius:8px 8px 0 0}
body.consolemode .ctabs button:hover{background:#16233a;color:#fff}
body.consolemode .ctabs button.on{color:#fff;background:#1b2a44;border-bottom-color:#4da3ff}
body.consolemode .stat{background:linear-gradient(180deg,#16233a,#111c2e);border:1px solid #23344f;border-radius:10px}
body.consolemode .stat b{color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
body.consolemode .stat span{color:#8ea3bd;text-transform:uppercase;letter-spacing:.5px;font-size:10px;font-weight:700}
body.consolemode .cohort th{background:#16233a;color:#8ea3bd;border-bottom-color:#23344f}
body.consolemode .cohort td{border-bottom-color:#1b2941;color:#dbe6f4}
body.consolemode .btn.ghost{background:#16233a;border-color:#2a3d5c;color:#cfe0f5}
body.consolemode .btn.out{background:transparent;border:1px solid #2f4566;color:#cfe0f5}
body.consolemode .btn.ghost:hover,body.consolemode .btn.out:hover{background:#1e2f4a}
body.consolemode input,body.consolemode select,body.consolemode textarea{
  background:#0d1726;border:1px solid #27395a;color:#e6edf6}
body.consolemode .field label{color:#8ea3bd}
body.consolemode .kv div{border-bottom-color:#1b2941;color:#dbe6f4}
body.consolemode .logtable,body.consolemode .logrow{color:#b9cbe2}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px}
.kpi{background:linear-gradient(180deg,#16233a,#111c2e);border:1px solid #23344f;border-radius:11px;padding:13px 14px;position:relative;overflow:hidden}
.kpi .kl{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#8ea3bd}
.kpi .kv{font-size:27px;font-weight:800;line-height:1.12;color:#fff;letter-spacing:-.8px;font-variant-numeric:tabular-nums;margin-top:3px}
.kpi .kn{font-size:11px;color:#7f95b1;margin-top:2px}
.kpi.good .kv{color:#5fe0a6}.kpi.warn .kv{color:#ffc46b}.kpi.hero .kv{color:#7cc4ff}
.spark{display:block;width:100%;height:100%}
.kpi .spark{position:absolute;right:0;bottom:0;width:100%;height:26px;opacity:.5}

/* funnel */
.fun{display:flex;flex-direction:column;gap:7px}
.fstep{position:relative;border-radius:8px;overflow:hidden;background:#0d1726;border:1px solid #1e2d45;
  padding:10px 13px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.fstep .fbar{position:absolute;inset:0;background:linear-gradient(90deg,#1d64c9,#2a8cf0);opacity:.30}
.fstep .fl,.fstep .fr{position:relative;z-index:1}
.fstep .fl{color:#dbe6f4;font-weight:600}
.fstep .fr{color:#8ea3bd;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.fstep.hit .fr{color:#5fe0a6}
.fstep.miss .fbar{background:#22324b;opacity:.5}
.fstep.miss .fl{color:#8ea3bd}

/* bar comparison */
.bars{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.barrow{display:grid;grid-template-columns:130px 1fr 62px;gap:10px;align-items:center;font-size:12px}
.barrow .bl{color:#c8d8ec;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .bt{height:16px;background:#0d1726;border-radius:8px;overflow:hidden;border:1px solid #1e2d45}
.barrow .bf{height:100%;border-radius:8px;background:linear-gradient(90deg,#2a8cf0,#5fc9ff)}
.barrow .bv{text-align:right;color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.barrow.alt .bf{background:linear-gradient(90deg,#9b6bf0,#d08cff)}

/* live pill */
.livepill{display:inline-flex;align-items:center;gap:7px;background:#0d2a1e;border:1px solid #1f6b47;
  color:#5fe0a6;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:700;letter-spacing:.4px}
.livedot{width:7px;height:7px;border-radius:50%;background:#37d38a;box-shadow:0 0 0 0 #37d38a99;animation:lp 1.8s infinite}
@keyframes lp{0%{box-shadow:0 0 0 0 #37d38a88}70%{box-shadow:0 0 0 7px #37d38a00}100%{box-shadow:0 0 0 0 #37d38a00}}
.livepill.idle{background:#1b2333;border-color:#31405a;color:#8ea3bd}
.livepill.idle .livedot{background:#5a6e8a;animation:none}

/* heatmap stage reads as a screen, not a sheet of paper */
body.consolemode .heatwrap{background:linear-gradient(180deg,#0d1726,#0a101c) !important;border-color:#1e2d45}
body.consolemode .heatempty{color:#6f86a3}
body.consolemode .cohort th{color:#8ea3bd;border-color:#1e2d45}
body.consolemode .cohort td{border-color:#18253a}

/* The touchpoint matrix, the arm switchers and the stat chips were authored for
   the light storefront and then reused inside the dark console, where they kept
   a near-white background while inheriting the dark theme's white text. Every
   headline figure in .tpfoot was white on #f6f8fb, so the numbers the console
   exists to show were the one thing that could not be read. */
body.consolemode .tpfoot>div{background:linear-gradient(180deg,#16233a,#111c2e);
  border:1px solid #23344f}
body.consolemode .tpfoot b{color:#fff}
body.consolemode .tpfoot span{color:#8ea3bd}
body.consolemode .tptable th{color:#8ea3bd;border-bottom-color:#23344f}
body.consolemode .tptable td{border-bottom-color:#1b2941;color:#dbe6f4}
body.consolemode .tptable td b{color:#fff}
body.consolemode .tpnote,body.consolemode .tpn,body.consolemode .tpsaid i,
body.consolemode .tphint{color:#8ea3bd}
body.consolemode .tptable tr.tphead td{color:#8ea3bd}
body.consolemode .tpbar{background:#22324c}
body.consolemode .tpcondnow{border-color:#2a3d5c;background:#16233a;color:#fff}
body.consolemode .tpcondnow span{color:#8ea3bd}
body.consolemode .tplive{background:#12341f;color:#5fd08a}
body.consolemode .tpdark{background:#1c2739;color:#7d8da3}
body.consolemode .tptier.tP0{background:#12341f;color:#5fd08a}
body.consolemode .tptier.tP1{background:#122a44;color:#6cb6ff}
body.consolemode .tptier.tP2{background:#332812;color:#e0b355}
body.consolemode .tptier.tP3{background:#1c2739;color:#8ea3bd}
/* .tparm is a <button> on the switchers and a <div> on the explainer cards.
   The button picked up the UA's black text and the div inherited the theme's
   white, so the same class rendered legibly in one place and invisibly in the
   other. Both are set explicitly here. */
body.consolemode .tparm{background:#16233a;border-color:#2a3d5c;color:#dbe6f4}
body.consolemode .tparm b,body.consolemode .tparmn{color:#fff}
body.consolemode .tparmd{color:#8ea3bd}
body.consolemode .tparm:hover{border-color:#4da3ff}
body.consolemode .tparm.on{border-color:#4da3ff;background:#1b2f4d}

/* collection cards carry a face product, so the framework looks like merchandising
   rather than a list of links */
.ccart{display:block;height:92px;border-radius:10px;margin-bottom:10px;
  background:linear-gradient(165deg,#eef4fc,#fbfdff 70%);border:1px solid #e3ebf5;overflow:hidden}
.ccart.tall{height:128px}
.ccart svg{width:100%;height:100%;padding:5%;box-sizing:border-box}
.collcard .ccn{font-size:11px;font-weight:700;color:var(--b);letter-spacing:.2px}
.tile.coll.big{display:flex;flex-direction:column}

.tile.coll .collbadge,.collcard .collbadge{color:#fff}

.collcard .badge{background:none;padding:0;font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.2px}
.collcard .ccn{background:none;padding:0;margin-top:2px}

/* small screens: the PDP and the collections grid need to stack */
@media(max-width:820px){
  .pdp{grid-template-columns:minmax(0,1fr) !important}
  .pdp>*{min-width:0}
  .gallery{min-width:0}
  .collgrid{grid-template-columns:repeat(2,1fr) !important}
}
@media(max-width:560px){
  .collgrid{grid-template-columns:1fr !important}
  .thumbs{overflow-x:auto;scrollbar-width:none}
  .thumbs::-webkit-scrollbar{display:none}
  .thumb{flex:0 0 auto}
  .fit{grid-template-columns:1fr !important}
}

/* the console is a second-monitor tool, but it should not break if the window is small */
@media(max-width:1100px){
  .console{grid-template-columns:minmax(0,1fr)}
  .console.wide{grid-template-columns:minmax(0,1fr)}
  .console>*{min-width:0}
}
.console.wide{grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr))}
.console>*{min-width:0}
.cohortwrap,.tablescroll{overflow-x:auto}

.card.panel{min-width:0}
.cohort{width:100%}
@media(max-width:900px){.panel .cohort{display:block;overflow-x:auto;white-space:nowrap}}

/* ---- photography layer --------------------------------------------------- */
.pshot{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;border-radius:10px;
  background:linear-gradient(160deg,#f7fafd,#e9eff6);display:block}
.pshot img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center;
  transition:transform .35s ease}
.card:hover .pshot img{transform:scale(1.045)!important}
.viz .pshot,.vizlap .pshot{aspect-ratio:16/10}
.thumb .pshot{aspect-ratio:1/1;border-radius:7px}

/* ==========================================================================
   RISE Collections layer. Every rule here serves a touchpoint on slide 14.
   Colour is always derived from --cc, set inline per collection, so a badge
   can never disagree with the strip that produced it.
   ========================================================================== */

.colltag{flex:none;display:block;background:none;border:0;padding:0;margin:0}

/* the badge: tiles, PDP, search suggestions */
.cbadge{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:4px 9px;border-radius:20px;
  font-size:11px;font-weight:700;line-height:1.2;white-space:nowrap;
  background:var(--ccl);color:var(--ccd);border:1px solid var(--ccb)}
.cbadge b{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.cbadge.sm{font-size:10px;padding:3px 7px;gap:4px}
.cbadge.lg{font-size:13px;padding:6px 13px}
.cbadge.solid{background:var(--cc);color:#fff;border-color:transparent}
.pcardcoll{margin:0 0 7px;display:inline-block;cursor:pointer}
.pcardcoll:hover{filter:brightness(1.08)}

/* TP1: search suggestions carry the collection label */
.acoll{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer}
.acoll:hover{background:var(--ccl)}
.acoll .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.acprod{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer}
.acprod:hover{background:#f3f6fa}
.acpname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acnocoll{flex:none;width:0}

/* TP1/TP3/TP4: the use-case strip */
.cstrip{margin:0 0 16px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
.cstriphead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:11px}
.cstriphead b{font-size:14px;letter-spacing:-.01em}
.cstriphead span{font-size:12px;color:var(--muted)}
.cstriprow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.cscell{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;padding:12px 12px 11px;
  border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;text-align:left;
  transition:border-color .13s,box-shadow .13s,transform .13s}
.cscell:hover{border-color:var(--cc);box-shadow:0 5px 16px -8px var(--cc);transform:translateY(-1px)}
.cscell.on{border-color:var(--cc);background:var(--ccl)}
.cscellart{display:flex;align-items:center;justify-content:center;width:38px;height:38px;margin-bottom:4px;
  border-radius:10px;background:var(--ccl);color:var(--cc)}
.cscell:hover .cscellart,.cscell.on .cscellart{background:var(--cc);color:#fff}
.cscell b{font-size:13px;line-height:1.25;color:var(--d)}
.cssub{font-size:11.5px;line-height:1.35;color:var(--muted)}
.cscount{margin-top:3px;font-size:11px;font-weight:700;color:var(--cc)}

/* TP2: the navigation flyout */
.navcollwrap{position:relative;display:inline-flex}
.navcollwrap:hover .navfly,.navcollwrap:focus-within .navfly{opacity:1;visibility:visible;transform:translateY(0)}
.navfly{position:absolute;top:100%;left:0;z-index:60;width:330px;padding:10px;opacity:0;visibility:hidden;
  transform:translateY(-5px);transition:opacity .13s,transform .13s,visibility .13s;
  background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 44px -14px #0d1b2e4d}
.navflyhead{padding:4px 8px 8px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.navflyrow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;cursor:pointer;color:var(--d)}
.navflyrow:hover{background:var(--ccl)}
.navflyart{flex:none;display:flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:9px;background:var(--ccl);color:var(--cc)}
.navflyrow:hover .navflyart{background:var(--cc);color:#fff}
.navflyrow>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.navflyrow b{font-size:13px;line-height:1.25}
.navflyrow i{font-style:normal;font-size:11.5px;color:var(--muted);line-height:1.3}
.navflyn{flex:none;font-size:11px;font-weight:700;color:var(--cc)}
.navflyall{display:block;margin-top:5px;padding:9px 8px;border-top:1px solid var(--line);
  font-size:12px;font-weight:600;color:var(--b);cursor:pointer}

/* TP3: the left-rail use-case filter */
.ucfacet .uclabel{display:flex;align-items:flex-start;gap:8px;padding:6px 4px;border-radius:8px}
.ucfacet .uclabel:hover{background:var(--ccl)}
.ucmark{flex:none;display:flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:7px;background:var(--ccl);color:var(--cc)}
.uctext{flex:1;min-width:0;display:flex;flex-direction:column}
.uctext b{font-size:12.5px;line-height:1.3}
.uctext i{font-style:normal;font-size:11px;color:var(--muted);line-height:1.3}

/* collection landing hero and the derived facts line */
.collheroart{display:inline-flex;align-items:center;justify-content:center;width:62px;height:62px;
  margin-bottom:10px;border-radius:15px;background:#ffffff2e;border:1px solid #ffffff5c;color:#fff}
.chname{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.86}
.chfacts{margin:14px 0 0;font-size:13px;font-weight:600;opacity:.9}

/* slide 27 education: the comparison table */
.ctable{margin:24px 0 0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.ctablehead{padding:15px 18px;border-bottom:1px solid var(--line)}
.ctablehead b{display:block;font-size:15px}
.ctablehead span{font-size:12.5px;color:var(--muted)}
.ctable table{width:100%;border-collapse:collapse}
.ctable th,.ctable td{padding:11px 18px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
.ctable th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ctable tbody tr:last-child td{border-bottom:0}
.ctable tbody tr:hover{background:var(--ccl)}
.ctname{display:inline-flex;align-items:center;gap:7px;color:var(--ccd);cursor:pointer}
.ctfor{color:var(--muted)}

/* TP5: Help Me Choose, and TP9: the assistant, share the chooser */
.advwrap{max-width:860px;margin:26px auto}
.advprog{height:4px;margin-bottom:14px;border-radius:2px;background:var(--line);overflow:hidden}
.advprog span{display:block;height:100%;background:var(--b);transition:width .22s}
.cchoose{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:6px}
.cchoice{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;padding:15px 13px;
  border:1.5px solid var(--line);border-radius:13px;background:#fff;cursor:pointer;text-align:left;
  transition:border-color .13s,box-shadow .13s,transform .13s}
.cchoice:hover{border-color:var(--cc);box-shadow:0 8px 22px -11px var(--cc);transform:translateY(-2px)}
.cchoiceart{display:flex;align-items:center;justify-content:center;width:52px;height:52px;margin-bottom:6px;
  border-radius:13px;background:var(--ccl);color:var(--cc)}
.cchoice:hover .cchoiceart{background:var(--cc);color:#fff}
.cchoice b{font-size:14px;line-height:1.25;color:var(--d)}
.csub{font-size:11.5px;line-height:1.38;color:var(--muted)}
.cchoose.compact{grid-template-columns:1fr;gap:6px}
.cchoose.compact .cchoice{flex-direction:row;align-items:center;gap:10px;padding:9px 11px;border-radius:10px}
.cchoose.compact .cchoiceart{width:34px;height:34px;margin:0;border-radius:9px}
.cchoose.compact b{font-size:12.5px}
.cchoose.compact .csub{font-size:11px}
.askip{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:12px;color:var(--muted)}
.askip button{padding:5px 12px;border:1px solid var(--line);border-radius:18px;background:#fff;
  font-size:12px;font-weight:600;cursor:pointer;color:var(--d)}
.askip button:hover{border-color:var(--b);color:var(--b)}
.abub_facts{margin-top:7px;font-size:12px;font-weight:700;opacity:.85}
.advcoll{display:flex;align-items:center;gap:14px;margin:0 0 16px;padding:14px 18px;
  background:var(--ccl);border:1px solid var(--ccb);border-radius:var(--radius)}
.advcollart{flex:none;display:flex;align-items:center;justify-content:center;width:50px;height:50px;
  border-radius:13px;background:var(--cc);color:#fff}
.advcoll>div{flex:1;min-width:0;display:flex;flex-direction:column}
.advcoll b{font-size:15px;color:var(--ccd)}
.advcoll span{font-size:12.5px;color:var(--muted)}

/* TP6: the Windows brand store */
.winhero{margin:0 0 18px;padding:46px 44px;border-radius:var(--radius);color:#fff;
  background:linear-gradient(118deg,#0b3c78,#1160b4 52%,#2a8ce0)}
.winmark{display:inline-block;padding:4px 11px;margin-bottom:13px;border-radius:20px;
  background:#ffffff26;border:1px solid #ffffff4d;font-size:12px;font-weight:700;letter-spacing:.04em}
.winhero h1{margin:0 0 9px;font-size:33px;line-height:1.15;letter-spacing:-.02em;max-width:660px}
.winhero p{margin:0 0 18px;max-width:600px;font-size:14.5px;opacity:.92}
.cblade{margin:0 0 20px;padding:20px 22px;background:#fff;border:1px solid var(--line);
  border-left:4px solid var(--cc);border-radius:var(--radius)}
.cbladehead{display:flex;align-items:flex-start;gap:15px;margin-bottom:15px}
.cbladeart{flex:none;display:flex;align-items:center;justify-content:center;width:58px;height:58px;
  border-radius:14px;background:var(--ccl);color:var(--cc)}
.cbladehead>div{flex:1;min-width:0}
.cbladehead h2{margin:0 0 4px;font-size:21px;letter-spacing:-.015em;color:var(--ccd)}
.cbladehead p{margin:0;font-size:13.5px;color:var(--muted);max-width:620px}
.cbladefacts{display:inline-block;margin-top:7px;font-size:12px;font-weight:700;color:var(--cc)}
.cbladerow{grid-template-columns:repeat(3,minmax(0,1fr))}

/* TP7: the PDP badge */
.pdpcoll{display:flex;flex-direction:column;gap:2px;align-self:flex-start;width:max-content;max-width:100%;
  margin:0 0 10px;padding:9px 13px;border-radius:11px;cursor:pointer;
  background:var(--ccl);border:1px solid var(--ccb)}
.pdpcoll b{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ccd)}
.pdpcoll .colltag{color:var(--cc)}
.pdpcoll i{font-style:normal;font-size:12px;color:var(--muted);line-height:1.35}
.pdpcoll u{text-decoration:none;font-size:11px;font-weight:700;color:var(--cc)}
.pdpcoll:hover{border-color:var(--cc)}

/* TP11: below-the-fold device highlights */
.chl{margin:18px 0 0;padding:17px 19px;background:var(--ccl);border:1px solid var(--ccb);border-radius:var(--radius)}
.chlhead{display:flex;align-items:center;gap:11px;margin-bottom:13px;color:var(--cc)}
.chlhead>div{display:flex;flex-direction:column}
.chlhead b{font-size:15px;color:var(--ccd)}
.chlhead span{font-size:12.5px;color:var(--muted)}
.chlrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.chlcard{display:flex;flex-direction:column;gap:4px;padding:13px 14px;background:#fff;
  border:1px solid var(--ccb);border-radius:11px}
.chlcard b{font-size:13px;color:var(--ccd)}
.chlcard span{font-size:12px;line-height:1.45;color:var(--muted)}

/* TP8: syndicated creator content */
.csyn{margin:18px 0 0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.csynhead{padding:14px 18px;border-bottom:1px solid var(--line)}
.csynhead b{display:block;font-size:15px}
.csynhead span{font-size:12.5px;color:var(--muted)}
.csynbody{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:16px;padding:16px 18px}
.csynart{position:relative;border-radius:11px;overflow:hidden;background:#0d1b2e}
.csynart svg{display:block;width:100%;height:auto}
.csynplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:#ffffffe6;color:var(--d);font-size:14px;padding-left:3px}
.csyntext{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.csyntag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:18px;
  background:var(--ccl);color:var(--ccd);font-size:11px;font-weight:700}
.csyntext b{font-size:15px;line-height:1.3}
.csyntext p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.csynmeta{font-size:11.5px;font-weight:600;color:var(--cc)}

@media(max-width:1100px){
  .cstriprow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cchoose{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cbladerow{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:800px){
  .cstriprow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cchoose{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chlrow{grid-template-columns:1fr}
  .csynbody{grid-template-columns:minmax(0,1fr)}
  .winhero{padding:32px 24px}
  .winhero h1{font-size:25px}
  .cbladehead{flex-wrap:wrap}
  .ctable{overflow-x:auto}
}
@media(max-width:560px){
  .cstriprow{grid-template-columns:1fr}
  .cchoose{grid-template-columns:1fr}
  .cbladerow{grid-template-columns:minmax(0,1fr)}
  .navfly{width:min(330px,86vw)}
}

/* ---- console: the touchpoint matrix tab ---------------------------------- */
.tpcondnow{flex:none;padding:9px 14px;border:1px solid var(--line);border-radius:10px;
  font-size:13px;font-weight:700;text-align:right}
.tpcondnow span{display:block;font-size:11px;font-weight:500;color:var(--muted);max-width:230px}
.tptable{width:100%;border-collapse:collapse;margin-top:6px}
.tptable th{padding:8px 10px;text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
.tptable td{padding:10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
.tptable tr.tphead td{padding:12px 10px 6px;font-size:11px;font-weight:700;letter-spacing:.03em;
  color:var(--muted);text-transform:none;border-bottom:0}
.tptable tr.tpoff{opacity:.42}
.tpn{width:26px;font-weight:700;color:var(--muted)}
.tptier{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:700}
.tptier.tP0{background:#dff3e6;color:#11633a}
.tptier.tP1{background:#dbecfb;color:#134f86}
.tptier.tP2{background:#f6ecd7;color:#7a5510}
.tptier.tP3{color:#525c6a}
.tptable td b{display:block;font-size:13px}
.tpnote{display:block;margin-top:2px;font-size:11.5px;color:var(--muted);line-height:1.4;max-width:420px}
.tpsaid{width:64px;font-weight:700}
.tpsaid i{font-style:normal;font-weight:400;font-size:11px;color:var(--muted)}
.tpstate{width:66px}
.tplive{display:inline-block;padding:2px 8px;border-radius:5px;background:#dff3e6;color:#11633a;
  font-size:11px;font-weight:700}
.tpdark{display:inline-block;padding:2px 8px;border-radius:5px;background:#eceef1;color:#6b7480;
  font-size:11px;font-weight:700}
.tpdid{width:110px;font-weight:700}
.tpbar{display:block;margin-top:5px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.tpbar i{display:block;height:100%;background:var(--b)}
.tpfoot{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.tpfoot>div{flex:1;min-width:130px;padding:11px 13px;background:#f6f8fb;border-radius:10px}
.tpfoot b{display:block;font-size:19px;letter-spacing:-.02em}
.tpfoot span{font-size:11.5px;color:var(--muted)}
.tparms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tparm{display:flex;flex-direction:column;gap:3px;padding:13px;border:1.5px solid var(--line);
  border-radius:11px;background:#fff;cursor:pointer;text-align:left}
.tparm:hover{border-color:var(--b)}
.tparm.on{border-color:var(--b);background:#eef5fd}
.tparm b{font-size:16px}
.tparmn{font-size:12.5px;font-weight:700}
.tparmd{font-size:11.5px;color:var(--muted);line-height:1.4}
.tphint{margin:11px 0 0;font-size:12px;color:var(--muted)}

/* ---- command center ------------------------------------------------------
   Sized for a stage, not a desk. The state line is readable across a room and
   every lever is a large target, because on stage you press without aiming. */
.stagenow{background:linear-gradient(160deg,#16233a,#101a2c)}
.snhead{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.snlab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:#7f97b8}
.snhead h2{margin:4px 0 2px;font-size:25px;letter-spacing:-.4px}
.snhead p{margin:0;font-size:13px;color:#8ea3bd}
.sncounts{display:flex;gap:10px;flex-wrap:wrap}
.sncounts>div{min-width:104px;padding:9px 13px;border-radius:10px;background:rgba(255,255,255,.05);
  border:1px solid #27395a}
.sncounts b{display:block;font-size:22px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.sncounts span{font-size:10.5px;color:#8ea3bd}
.levers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:20px}
.lvrlab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  color:#7f97b8;margin-bottom:7px}
.lvrbtns{display:flex;gap:7px;flex-wrap:wrap}
.lvrb{flex:1 1 auto;min-width:78px;padding:13px 12px;border-radius:10px;font-size:13.5px;
  font-weight:700;cursor:pointer;background:#1b2a44;border:1.5px solid #2c4166;color:#cfe0f5;
  transition:background .12s,border-color .12s}
.lvrb:hover{border-color:#4da3ff;background:#22354f}
.lvrb.on{background:#2563c9;border-color:#63a9ff;color:#fff}
.stagebtns{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.beats{display:grid;gap:9px}
.beat{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;
  padding:13px 15px;border-radius:11px;background:#14203400;border:1px solid var(--line)}
.beatn{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;font-weight:700;
  font-size:14px;background:#2563c9;color:#fff}
.beatbody b{display:block;font-size:14.5px;margin-bottom:2px}
.beatbody span{font-size:12px;color:var(--muted);line-height:1.45}
body.consolemode .beat{background:#16233a;border-color:#24344f}
body.consolemode .beatbody b{color:#fff}
body.consolemode .beatbody span{color:#8ea3bd}
@media(max-width:820px){
  .beat{grid-template-columns:34px minmax(0,1fr);row-gap:10px}
  .beatgo{grid-column:2}
}
/* The console's wide layout is an auto-fit grid, which splits the art tab into
   two uneven columns and strands the comparison table in a 520px well. These
   panels are full-bleed instead. */
.cfull{grid-column:1/-1}
.tparms.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.armlive{display:block;margin-top:2px;font-size:9.5px;font-weight:700;letter-spacing:.06em;color:#2f8f4f}
body.consolemode .armlive{color:#5fd08a}
@media(max-width:900px){.tparms{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* ==== navigation ==========================================================
   The mainstream US big-box pattern: a coloured band of pill controls with a
   primary Shop control, utility links to the right, and one drill-down panel
   that is the same component at every width. */
.mainnav{background:var(--d);border-bottom:0}
.mainnav .wrap{display:flex;align-items:center;gap:18px;padding:9px 24px;overflow:visible;
  font-size:13px;color:#dbe7fb}
.navpills{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.navpill{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;
  border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-size:13px;
  font-weight:600;white-space:nowrap;cursor:pointer;transition:background .12s,border-color .12s}
.navpill:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.72)}
.navshop{background:var(--b);border-color:var(--b)}
.navshop:hover{background:var(--b2);border-color:var(--b2)}
.navshop[aria-expanded="true"] .navcar{transform:rotate(180deg)}
.navcoll{border-color:rgba(255,255,255,.4)}
.navallico{display:inline-flex;flex-direction:column;gap:3px;width:14px}
.navallico i{display:block;height:2px;border-radius:2px;background:currentColor}
.navcar{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid currentColor;transition:transform .14s}

.navlinks{display:flex;align-items:center;gap:20px;margin-left:auto;min-width:0;flex:0 1 auto;
  overflow:hidden}
.navlinks a{color:#dbe7fb;white-space:nowrap;font-size:13px;cursor:pointer}
.navlinks a:hover{color:#fff;text-decoration:underline}
.navmore{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}

/* Progressive collapse. The utility links drop before the pills do, and the
   pills never drop, because Shop is the only guaranteed way into the store. */
@media(max-width:1180px){ .navlinks a:nth-last-child(2),.navlinks a:nth-last-child(3){display:none} }
@media(max-width:980px){ .navlinks a:not(.navmore){display:none} }
@media(max-width:760px){
  .mainnav .wrap{gap:10px;padding:8px 16px}
  .navpills{gap:6px}
  .navpill{padding:6px 12px}
}
@media(max-width:560px){
  .navlinks{display:none}
  .mainnav .wrap{overflow-x:auto;scrollbar-width:none}
  .mainnav .wrap::-webkit-scrollbar{display:none}
}

/* The Menu control in the header, always present, always the same panel. */
.burger{display:flex;align-items:center;gap:9px;padding:9px 13px 9px 0;margin-right:4px;
  background:none;border:0;cursor:pointer;flex:0 0 auto;color:#22324a}
.burger:hover{color:var(--b)}
.burger b{font-size:13.5px;font-weight:700}
.burgerico{display:flex;flex-direction:column;gap:4px;width:19px}
.burgerico i{display:block;height:2px;border-radius:2px;background:currentColor}
@media(max-width:700px){ .burger b{display:none} .burger{padding-right:4px} }

/* ---- the drill-down panel ---- */
.navdrawer{position:fixed;inset:0;z-index:130;display:none}
.navdrawer.open{display:block}
.navscrim{position:absolute;inset:0;background:rgba(7,18,36,.42);opacity:0;transition:opacity .19s}
.navdrawer.in .navscrim{opacity:1}
.navpanel{position:absolute;top:0;left:0;bottom:0;width:min(372px,90vw);background:#fff;
  display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .19s ease;
  box-shadow:0 0 44px rgba(10,22,40,.28)}
.navdrawer.in .navpanel{transform:none}
/* On a wide screen it hangs off the nav band like a menu rather than filling
   the edge of the screen, which is what the big-box sites do. */
@media(min-width:900px){
  .navpanel{top:var(--navtop,150px);left:max(24px,calc((100vw - var(--max)) / 2 + 24px));
    bottom:auto;max-height:calc(100vh - var(--navtop,150px) - 28px);border-radius:10px;
    transform:translateY(-8px);opacity:0;transition:transform .15s,opacity .15s}
  .navdrawer.in .navpanel{transform:none;opacity:1}
  .navscrim{background:rgba(7,18,36,.22)}
}
.navhead{display:flex;align-items:center;gap:10px;padding:12px 16px;flex:0 0 auto;
  border-bottom:1px solid var(--line)}
.navtitle{font-size:15px;flex:1;min-width:0}
.navback{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border:0;
  border-radius:7px;background:#eef3fa;color:var(--b);font-size:12.5px;font-weight:700;cursor:pointer;
  flex:0 0 auto}
.navback:hover{background:#e2ebf8}
.navback i{width:7px;height:7px;border-left:1.8px solid currentColor;border-bottom:1.8px solid currentColor;
  transform:rotate(45deg);margin-left:2px}
.navx{background:none;border:0;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;
  padding:0 2px;flex:0 0 auto}
.navx:hover{color:var(--ink)}
.navbody{flex:1;overflow-y:auto;padding:8px 0;-webkit-overflow-scrolling:touch}

.navrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 20px;border:0;
  background:none;font:inherit;text-align:left;color:var(--ink);cursor:pointer;min-width:0}
.navrow:hover{background:#f2f6fc}
.navrowico{flex:0 0 auto;font-size:17px;line-height:1;width:20px}
.navrowtx{flex:1;min-width:0;font-size:13.5px;line-height:1.35}
.navrowtx b{display:block;font-weight:700}
.navrowtx i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);line-height:1.35;
  margin-top:1px}
.navrown{flex:0 0 auto;font-size:11.5px;color:var(--muted)}
.navrowchev{flex:0 0 auto;width:7px;height:7px;border-right:1.7px solid var(--muted);
  border-bottom:1.7px solid var(--muted);transform:rotate(-45deg);margin-right:3px}
.navdrill:hover .navrowchev{border-color:var(--b)}
.navexplore{color:var(--b)}
.navexplore .navrowtx b{font-weight:700}
.navrowall{color:var(--b)}
.navsechead{padding:12px 20px 6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted)}
.navrule{height:1px;background:var(--line);margin:8px 0}
.navfoot{padding:12px 20px;margin-top:6px;border-top:1px solid var(--line);font-size:11.5px;
  color:var(--muted);background:#fbfcfe}
.navcollrow .navrowart{flex:0 0 auto;display:flex;width:32px;height:32px;align-items:center;
  justify-content:center;border-radius:8px;background:var(--ccl);color:var(--cc)}
.navcollrow:hover{background:var(--ccl)}
.colltag{flex:none;display:block;background:none;border:0;padding:0;margin:0}
body.noscroll{overflow:hidden}

/* department subcategory chips on the department page */
.deptcats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.deptcat{display:inline-flex;align-items:baseline;gap:7px;padding:7px 13px;border:1px solid var(--line);
  border-radius:999px;font-size:12.5px;background:#fff;cursor:pointer;color:#22324a}
.deptcat:hover{border-color:var(--b);color:var(--b)}
.deptcat.on{background:var(--b);border-color:var(--b);color:#fff}
.deptcat.on span{color:rgba(255,255,255,.75)}
.deptcat span{font-size:11px;color:var(--muted)}
.deptcat.ghost{color:var(--muted)}

/* ==========================================================================
   Collection wallpapers, the 1P treatment.
   The wallpaper is artwork, not an icon, so it must not inherit the currentColor
   reset that .colltag applies. Rounded and inset so a 16px chip reads as a
   deliberate swatch rather than a clipping artefact, which keeps the comparison
   against the icon arm fair.
   ========================================================================== */
.collwall{flex:none;display:block;border-radius:5px;overflow:hidden;
  box-shadow:inset 0 0 0 1px #0000001f}
.cbadge .collwall,.csyntag .collwall{border-radius:4px}
.cchoiceart .collwall,.cscellart .collwall,.navrowart .collwall,
.advcollart .collwall,.cbladeart .collwall,.collheroart .collwall{border-radius:8px}
.collheroart .collwall{border-radius:12px}
/* the art wells carry a tinted background for the icon arm; a wallpaper fills
   the well itself, so the tint would show as a halo */
.navcollrow .navrowart:has(.collwall),.cchoiceart:has(.collwall),
.cscellart:has(.collwall){background:none}

/* ---- the dark collection banner (TP3, TP6) --------------------------------
   The 1P presentation of the framework: a near-black panel that lets five
   wallpapers do the identifying before any label is read. Deliberately not a
   variant of .cstrip, because the light strip is still the right control to
   compare it against and the two have to be able to differ. */
.cbanner{margin:0 0 18px;padding:26px 24px 24px;border-radius:var(--radius);
  background:radial-gradient(120% 140% at 50% -20%,#20242c 0%,#111318 46%,#0a0b0e 100%);
  border:1px solid #23262e;position:relative;overflow:hidden}
.cbanner::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,#0a6cd4,#2f9bf0 45%,#0a6cd4)}
.cbannerhead{text-align:center;margin-bottom:20px}
.cbannerhead b{display:block;font-size:21px;line-height:1.2;color:#fff;letter-spacing:-.015em}
.cbannerhead span{display:block;margin-top:5px;font-size:12.5px;color:#9aa2b0}
.cbannerrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.cbcell{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;
  padding:14px 12px 15px;border:1px solid #272b34;border-radius:13px;background:#17191f;
  cursor:pointer;text-align:center;color:#fff;
  transition:border-color .14s,background .14s,transform .14s}
.cbcell:hover{border-color:hsl(var(--ch) 70% 58%);background:#1d2029;transform:translateY(-2px)}
.cbcell.on{border-color:hsl(var(--ch) 76% 62%);background:#1d2029}
.cbart{position:relative;display:flex;align-items:center;justify-content:center;
  width:100%;aspect-ratio:16/11;margin-bottom:6px}
.cbart svg{width:100%;height:100%;display:block;transform:scale(1.38);transform-origin:50% 48%}
.cbicon{display:flex;align-items:center;justify-content:center;width:72px;height:72px;
  border-radius:16px;background:hsl(var(--ch) 60% 20%);color:hsl(var(--ch) 85% 76%)}
.cbmark{position:absolute;right:12%;bottom:14%;display:flex;align-items:center;
  justify-content:center;width:34px;height:34px;border-radius:9px;
  background:rgba(8,9,12,.72);color:#fff}
.cbcell b{font-size:13.5px;line-height:1.25;color:#fff;letter-spacing:-.005em}
.cbsub{font-size:11.5px;line-height:1.4;color:#9aa2b0}
.cbcount{margin-top:5px;font-size:11px;font-weight:700;color:hsl(var(--ch) 78% 70%)}
@media (max-width:1000px){
  .cbannerrow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cbanner{padding:20px 16px 18px}
}
@media (max-width:640px){
  .cbannerrow{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .cbannerhead b{font-size:18px}
  .cbcell b{font-size:12.5px}
}

/* ---- PDP collection assets (TP10, TP11) -----------------------------------
   The gallery slots the brand supplies alongside the device angles: the
   wallpaper shot, an infographic, and a video still. They are rendered rather
   than dropped in as flat images so they restyle with the retailer skin and so
   a condition can remove them cleanly. */
.cinfo{position:relative;width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;
  background:#fff;border:1px solid var(--line);display:block}
.cinfo svg{width:100%;height:100%;display:block}
.cvid{position:relative;width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;display:block}
.cvid svg{width:100%;height:100%;display:block}
.cvidplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;width:34%;aspect-ratio:1;
  max-width:54px;border-radius:50%;background:rgba(9,11,15,.62);color:#fff;
  border:1.5px solid rgba(255,255,255,.8);font-size:15px;padding-left:3px}
.thumb .cvidplay{width:40%;font-size:11px;border-width:1px}
#galmain .cvidplay{width:76px;max-width:76px;font-size:24px}
.cwin11{margin:20px 0 0;padding:15px 16px;border-radius:11px;
  background:var(--ccl,#f4f7fb);border:1px solid var(--ccb,var(--line))}
.cwin11 b{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ccd,var(--d))}

/* ---------------------------------------------------------------------------
   Deterministic pseudo-random so every build is byte-identical.
--------------------------------------------------------------------------- */
let _s = 987654321;
function rnd() { _s = (_s * 1664525 + 1013904223) % 4294967296; return _s / 4294967296; }
function pick(a) { return a[Math.floor(rnd() * a.length)]; }
function between(lo, hi) { return lo + Math.floor(rnd() * (hi - lo + 1)); }

/* Review themes. Written to mirror the themes that genuinely dominate laptop
   reviews: design, boot speed and display run positive; memory headroom,
   port selection and battery claims run negative. */

  ]
};

const REVIEWERS = ['J. Rivera','M. Okafor','S. Lindqvist','D. Patel','A. Brennan',
                   'T. Nakamura','K. Adeyemi','R. Fontaine','C. Whitlock','P. Moreau'];

function makeReviews(rating, ram, portsHaveUsbA) {
  const out = [];
  const n = between(6, 10);
  for (let i = 0; i < n; i++) {
    let stars, body;
    const r = rnd();
    if (ram <= 8 && r > 0.82 && r < 0.90) { stars = between(3, 4); body = pick(REVIEW_POOL.ram8); }
    else if (!portsHaveUsbA && r >= 0.90 && r < 0.93) { stars = 4; body = pick(REVIEW_POOL.noUsbA); }
    else if (rating >= 4.5 ? r < 0.75 : r < 0.55) { stars = 5; body = pick(REVIEW_POOL.pos); }
    else if (r < 0.9) { stars = 4; body = pick(REVIEW_POOL.mid); }
    else { stars = between(2, 3); body = pick(REVIEW_POOL.neg); }
    out.push({
      stars,
      title: stars >= 5 ? 'Exactly what I wanted'
           : stars === 4 ? 'Very good with small caveats'
           : 'Mixed feelings',
      body,
      author: REVIEWERS[i % 10],
      verified: rnd() > 0.15,
      daysAgo: between(3, 240)
    });
  }
  return out;
}

function starDistribution(rating, count) {
  const skew = (rating - 3) / 2;
  const w = [0.03 + 0.05 * (1 - skew), 0.04 + 0.05 * (1 - skew), 0.08, 0.20 + 0.1 * skew, 0.55 + 0.25 * skew];
  const tot = w.reduce((a, b) => a + b, 0);
  const pct = w.map(x => x / tot);
  return [5, 4, 3, 2, 1].map((s, i) => ({ stars: s, count: Math.round(count * pct[4 - i]) }));
}
