}

/* ---- TP11, below the fold PDP. Slide 24 ------------------------------------
   P3, the lowest tier, and the deck is clear about why: the shopper does not
   choose a Collection here, the page confirms the one they already arrived
   with. Device highlights restate the use case at the decision point.
   "Win your day" is the deck's own feature-content line. */
function collHighlights(p) {
  const c = collByName(p.collection);
  if (!c) return '';
  const hl = COLL_HIGHLIGHTS[c.id] || [];
  return `<section class="chl" style="${collCss(c)}">
    <div class="chlhead">${collTagSvg(c, 22)}
      <div><b>Win your day</b><span>Why this machine sits in ${esc(c.name)}.</span></div></div>
    <div class="chlrow">${hl.map(x => `<div class="chlcard">
      <b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>
  </section>`;
}
/* Three highlights per collection. Written against what the collection is for
   rather than against a specification, which is the whole point of the
   framework: a shopper should not need to price out a GPU to know this is the
   right shelf for them. */
const COLL_HIGHLIGHTS = {
  'premium-performance': [
    ['Lasts the working day', 'Enough battery to get from a morning commute to an evening train without hunting for a socket.'],
    ['Handles the pile-up', 'Calls, spreadsheets and twenty tabs at once, without the fan telling everyone about it.'],
    ['Built to be carried', 'Premium chassis, proper hinge, screen you can actually work on outdoors.']],
  'everyday-productivity': [
    ['Made for coursework', 'Essays, research, a video call and your music, all open at the same time.'],
    ['Enough headroom to last', 'Specified so it still feels quick in second year, not just in the shop.'],
    ['Fits the budget', 'The sensible middle of the range, where most people genuinely should be.']],
  'power-gaming': [
    ['Holds a frame rate', 'Dedicated graphics and a high refresh panel, so the number stays up when it matters.'],
    ['Cooling that keeps up', 'Built to run under load for hours rather than for a benchmark.'],
    ['Doubles as a workhorse', 'The same graphics power that renders a game renders a timeline.']],
  'creator-pro': [

    ['Room for the files', 'Storage and memory specified for raw footage, not for documents.']],
  'core-essentials': [
    ['Does the everyday well', 'Email, the web, streaming and documents, quickly and without fuss.'],
    ['Nothing you will not use', 'Not paying for power that would sit idle is the point, not a compromise.'],
    ['Simple to live with', 'Light, quiet, and straightforward to set up on the first evening.']]
};

/* ---- TP8, syndicated content. Slides 24 and 28 ----------------------------
   P2. Slide 28 sets the rule: creators own a relatable use case, not product
   specs, and the creator is cast to the Collection. Slide 29 does that casting
   explicitly, so the territories below are the deck's, not invented. Licensed
   content lands on the product page, which is where social discovery closes. */
const COLL_CREATORS = {
  'premium-performance': { who: 'Deep-dive workflow reviewers', where: 'YouTube and Reddit',
    line: 'Performance under pressure, from people who depend on the machine.',
    piece: 'Long-form review: a full working week on one charge cycle' },

  else S.compare = S.compare.filter(x => x !== id);

  track('compare_changed', { id, on, count: S.compare.length });
  paintCompareBar();
}
function paintCompareBar() {
  const bar = document.getElementById('cmpbar');

  bar.classList.toggle('show', S.compare.length > 0);

function addToCart(id) {

  else track('cart_qty_changed', { id, qty: l.qty });

}

/* ---------------- advisor: TP5, Help Me Choose. Slides 18 and 19 -------------
   P1, and the deck's clearest before-and-after. The existing tool is
   product-first: it opens by asking what specification you want. The RISE
   version is customer-and-intent-first, and opens with the five Collections
   under the question "Which of these best fits your needs?".

   Live, this tool converts at 8% across 40 retailers, four times the industry
   average. So the interesting comparison is not whether guidance helps. It is
   whether opening on intent beats opening on specification. Switching TP5 off
   drops the Collection step and starts on the specification question, which is
   exactly the From state in the deck. */
let ADV = { step: 0, answers: {} };
const ADV_Q = [
  { k: 'use', q: 'What will you mainly use it for?', opts: ['School', 'Work', 'Creative', 'Gaming', 'Everyday'] },
  { k: 'priority', q: 'What matters most?', opts: ['Lowest price', 'Long battery life', 'Fast performance', 'Light to carry'] },
  { k: 'budget', q: "What's your budget?", opts: ['Under $600', '$600 to $1,000', '$1,000 to $1,500', 'Over $1,500'] },
  { k: 'size', q: 'Preferred screen size?', opts: ['13 to 14 inches', '15 inches', '16 inches or larger', 'No preference'] }
];
/* The Collection step is step 0 when TP5 is live, pushing the specification
   questions back one. Kept as a derived list rather than a mutated constant so
   a condition change mid-session cannot corrupt the flow. */
function advSteps() {
  return (tpOn(5) ? [{ k: 'collection', coll: true, q: 'Which of these best fits your needs?' }] : []).concat(ADV_Q);
}
function advPickColl(id) {
  const c = COLL(id); if (!c) return;
  ADV.answers.collection = c.name;
  track('advisor_collection_picked', { collection: id, step: 0 });
  pickCollection(id, 'advisor_step', { stay: true });
  ADV.step++; render();
}
function advSkipColl() {
  track('advisor_collection_skipped', {});
  ADV.step++; render();
}
function viewAdvisor() {
  const steps = advSteps();
  if (ADV.step >= steps.length) return advisorResults();
  const q = steps[ADV.step];
  const head = `${crumbs([['Home', '#/'], ['Find your PC', '#/advisor']])}
  <div class="advwrap">
    <div class="advprog"><span style="width:${Math.round((ADV.step / steps.length) * 100)}%"></span></div>
    <div class="sub">Question ${ADV.step + 1} of ${steps.length}</div>`;
  /* The Collection step. Every card carries an image, the name and the
     descriptor, which is the deck's own card anatomy, and Skip preserves
     agency exactly as slide 19 shows it. */
  if (q.coll) {
    return `${head}
    <h1 class="h1" style="margin:6px 0 4px">${q.q}</h1>
    <p class="sub" style="margin:0 0 18px">Pick what you want to do with it. We will handle the specification.</p>
    ${collChooser("advPickColl('%ID%')")}
    <div style="display:flex;gap:9px;margin-top:22px">
      <button class="btn ghost" onclick="advSkipColl()">Skip, I'd rather answer questions</button>
      <button class="btn ghost" onclick="track('advisor_abandoned',ADV.step);go('#/laptops')">Skip, just browse</button>
    </div>
  </div>`;
  }
  return `${head}
    <h1 class="h1" style="margin:6px 0 18px">${q.q}</h1>
    <div class="qopts">${q.opts.map(o => `<button class="${ADV.answers[q.k] === o ? 'on' : ''}"
      onclick="advPick('${q.k}','${o}')">${o}</button>`).join('')}</div>
    <div style="display:flex;gap:9px;margin-top:24px">
      ${ADV.step > 0 ? `<button class="btn ghost" onclick="ADV.step--;render()">Back</button>` : ''}
      <button class="btn pri" onclick="advNext()">${ADV.step === steps.length - 1 ? 'Show my matches' : 'Continue'}</button>
      <button class="btn ghost" onclick="track('advisor_abandoned',ADV.step);go('#/laptops')">Skip, just browse</button>
    </div>
  </div>`;
}
function advPick(k, v) { ADV.answers[k] = v; track('advisor_answer', { q: k, a: v }); render(); }
function advNext() {
  const steps = advSteps(), q = steps[ADV.step];
  if (q && !q.coll && q.k === 'use' && !ADV.answers.use) { toast('Pick an option to continue'); return; }
  ADV.step++;
  if (ADV.step >= steps.length) track('advisor_completed', ADV.answers);
  render();
}
function advisorMatches() {
  const a = ADV.answers;
  let list = CATALOG.slice();
  /* The Collection answer is a starting point, not a cage. Slide 30, Empower:
     do not over-pigeonhole. If the later answers empty the collection, widen
     back out rather than showing nothing, and say so in the results copy. */
  let widened = false;
  if (a.collection) {
    const inColl = list.filter(p => p.collection === a.collection);
    if (inColl.length) list = inColl;
  }
  if (a.use) {
    const byUse = list.filter(p => p.use.includes(a.use));
    if (byUse.length) list = byUse; else widened = true;
  }
  const band = l => {
    if (a.budget === 'Under $600') return l.filter(p => p.price < 600);
    if (a.budget === '$600 to $1,000') return l.filter(p => p.price >= 600 && p.price <= 1000);
    if (a.budget === '$1,000 to $1,500') return l.filter(p => p.price > 1000 && p.price <= 1500);
    if (a.budget === 'Over $1,500') return l.filter(p => p.price > 1500);
    return l;
  };
  const priced = band(list);
  if (priced.length) list = priced; else if (a.budget) widened = true;
  const sized = a.size === '13 to 14 inches' ? list.filter(p => p.screenSize <= 14)
    : a.size === '15 inches' ? list.filter(p => p.screenSize > 14 && p.screenSize < 16)
    : a.size === '16 inches or larger' ? list.filter(p => p.screenSize >= 16) : list;
  if (sized.length) list = sized; else if (a.size && a.size !== 'No preference') widened = true;
  if (!list.length) list = CATALOG.slice();
  if (a.priority === 'Lowest price') list.sort((x, y) => x.price - y.price);
  else if (a.priority === 'Long battery life') list.sort((x, y) => parseInt(y.battery) - parseInt(x.battery));
  else if (a.priority === 'Light to carry') list.sort((x, y) => parseFloat(x.weight) - parseFloat(y.weight));
  else list.sort((x, y) => y.rating - x.rating);
  ADV.widened = widened;
  return list.slice(0, 6);
}
function advisorResults() {
  const m = advisorMatches(), a = ADV.answers;
  const c = a.collection ? collByName(a.collection) : null;
  const said = Object.keys(a).filter(k => k !== 'collection').map(k => a[k]).join(', ').toLowerCase();
  return `${crumbs([['Home', '#/'], ['Find your PC', '#/advisor']])}
  <div class="sectionhead"><div><h1 class="h1">Your matches</h1>
    <p class="sub">${c ? `From <b>${esc(c.name)}</b>${said ? ', ' + said : ''}.` : (said ? `Based on ${said}.` : '')}
      ${ADV.widened ? 'We widened the search slightly so you still have real choices.' : ''}</p></div>
    <button class="btn ghost" onclick="ADV={step:0,answers:{}};track('advisor_restarted');render()">Start over</button></div>
  ${c ? `<div class="advcoll" style="${collCss(c)}">
    <span class="advcollart">${collTagSvg(c, 30)}</span>
    <div><b>${esc(c.name)}</b><span>${esc(c.blurb)}</span></div>
    <button class="btn out" onclick="pickCollection('${c.id}','advisor_results')">See the collection</button>

/* ---------------- collections ----------------

function collItems(c) { return CATALOG.filter(p => p.collection === c.name); }

}

  'Which collection is right for me?',
  'What is good for photo editing?',
  'Which of these has the best battery?',
  'Show me something under $700',
  'What is the difference between 8 GB and 16 GB?'
];

function paintAssistant() {
  const root = document.getElementById('assistroot');
  if (!root) return;
  if (!cond().assistant) { root.innerHTML = ''; return; }
  root.innerHTML = `
    ${ASSIST_OPEN ? '' : `<button class="asstbtn" onclick="toggleAssist(true)">Ask ${esc(BRAND.name || 'novi')}</button>`}
    <section class="asst ${ASSIST_OPEN ? 'open' : ''}" aria-label="Shopping assistant">
      <div class="head">
        <div><b>Shopping assistant</b><div style="font-size:11px;opacity:.85">Answers from novi's product data</div></div>
        <button onclick="toggleAssist(false)" aria-label="Close"
          style="background:none;border:0;color:#fff;font-size:22px;line-height:1">&times;</button>
      </div>
      <div class="body" id="amsgs">${ASSIST_MSGS.map(renderMsg).join('') || greeting()}</div>
      <div class="sugg">${ASSIST_CHIPS.map(c => `<button data-q="${esc(c)}" onclick="assistSend(this.dataset.q)">${c}</button>`).join('')}</div>
      <div class="sugg" style="border-top:0;gap:8px">
        <input id="ain" placeholder="Ask about any laptop" style="flex:1;padding:10px;border:1px solid #c3d2e3;border-radius:8px"
          onkeydown="if(event.key==='Enter')assistSubmit()">
        <button class="btn pri" onclick="assistSubmit()">Send</button>
      </div>
    </section>`;
  const m = document.getElementById('amsgs');
  if (m) m.scrollTop = m.scrollHeight;
}
/* ---- TP9, the AI shopping agent. Slide 20 ----------------------------------
   P2. The deck's move is that the assistant's first structured response to a
   broad intent ("I am starting college and need a laptop") is a Collection
   chooser, not a specification question. The chooser is a rich card inside the
   conversation, with the same anatomy as Help Me Choose, and a Skip.

   63% of shoppers in the study used an AI agent before they reached a retailer
   site at all, which is why this is a touchpoint and not a gimmick. */
function greeting() {
  if (!tpOn(9)) {
    return `<div class="msg a"><div class="bub">Hi. I can help you narrow this down.
      <div style="margin-top:9px">Tell me your budget and what you need it for.</div></div></div>`;
  }
  return `<div class="msg a"><div class="bub">Welcome, how can I help you today?
    <div style="margin:10px 0 6px">To get started, which of the below options best fits your needs?</div>
    ${collChooser("assistCollection('%ID%')", { compact: true })}
    <div class="askip"><button onclick="assistSkipColl()">Skip</button>
      <span>Or tell me what you'll use it for, and I'll work it out.</span></div></div></div>`;
}
function assistSkipColl() {
  track('assistant_collection_skipped', {});
  ASSIST_MSGS.push({ role: 'a', text: `No problem. Tell me roughly what you'll use it for and what you'd like to spend, and I'll shortlist from there.` });
  paintAssistant();
}
/* Picking a collection in the assistant is the same act as picking one in the
   nav, so it lands the shopper on the collection rather than a dead-end reply. */
function assistCollection(id) {
  const c = COLLECTIONS.find(x => x.id === id);
  if (!c) return;
  pickCollection(id, 'assistant', { stay: true });
  const items = CATALOG.filter(p => p.collection === c.name)
    .sort((a, b) => (b.rating - b.price / 3000) - (a.rating - a.price / 3000)).slice(0, 3);
  const r = (typeof collPriceRange === 'function') ? collPriceRange(c.id) : null;
  ASSIST_MSGS.push({ role: 'u', text: esc(c.name) });
  ASSIST_MSGS.push({
    role: 'a',
    text: `<b>${esc(c.name)}</b> is ${esc(c.blurb.replace(/^(For|Ideal for|Designed for|Built for|Delivers) /, m => m.toLowerCase()))}. ${esc(c.long)}
      ${r ? `<div class="abub_facts">${money(r.lo)} to ${money(r.hi)}</div>` : ''}
      <div style="margin-top:8px">Here are three to start with.</div>`,
    cards: items.map(p => p.id),
    actions: `<button class="btn out" style="padding:7px 11px;font-size:12px"
      onclick="toggleAssist(false);pickCollection('${c.id}','assistant')">See all ${esc(c.name)}</button>`
  });
  track('assistant_collection_picked', { collection: c.id });
  paintAssistant();
}
function renderMsg(m) {
  return `<div class="msg ${m.role}"><div class="bub">${m.text}
    ${m.cards && m.cards.length ? m.cards.map(id => acard(P(id))).join('') : ''}
    ${m.actions ? `<div style="margin-top:10px;display:flex;gap:7px;flex-wrap:wrap">${m.actions}</div>` : ''}</div></div>`;
}
function acard(p) {
  if (!p) return '';
  return `<div class="asstcard" onclick="track('assistant_card_clicked','${p.sku}');go('#/product/${p.id}')">
    ${vizLap(p)}
    <div style="flex:1"><b>${p.name}</b><small>${money(p.price)} · ${p.ram} · ${p.storage} · ${p.rating} ★</small></div>
    <button class="btn pri" style="padding:7px 11px;font-size:12px;align-self:center"
      onclick="event.stopPropagation();addToCart(${p.id})">Add</button>
  </div>`;
}

function toggleAssist(on) {
  ASSIST_OPEN = on;
  track(on ? 'assistant_opened' : 'assistant_closed', location.hash);
  paintAssistant();
  if (on) setTimeout(() => { const i = document.getElementById('ain'); if (i) i.focus(); }, 60);
}
function assistSubmit() {
  const i = document.getElementById('ain');
  if (!i || !i.value.trim()) return;
  const v = i.value.trim(); i.value = '';
  assistSend(v);
}
function assistSend(text) {
  ASSIST_MSGS.push({ role: 'u', text: esc(text) });
  track('assistant_question', text);
  paintAssistant();
  const reply = assistAnswer(text);
  setTimeout(() => {
    ASSIST_MSGS.push(reply);
    track('assistant_answer', { grounded: reply.grounded, hedged: !!reply.hedged });
    paintAssistant();
  }, 420);
}
function askAboutProduct(id) {
  ASSIST_CTX = id;
  ASSIST_OPEN = true;
  paintAssistant();
  assistSend('Tell me about the ' + P(id).name);
}

/* ---- intent matching ----------------------------------------------------- */
/* Real model names are long ("Surface Laptop, 7th Edition 13.8""), so a shopper
   never types them in full. Match on brand and product family instead, on whole
   words, and ignore family words that are too generic to identify anything. */
const GENERIC_TOKENS = new Set(['laptop','laptops','chromebook','book','plus','gaming',
  'pro','air','go','slim','flex','ultra','x','s','edition','the','and']);

function familyTokens(p) {
  return [...new Set((p.brand + ' ' + p.family).toLowerCase().split(/[^a-z0-9]+/))]
    .filter(t => t.length > 1);
}
/* The words that actually identify a product line: the family, minus its brand
   and minus words too generic to name anything ("laptop", "pro", "plus"). */
function keyTokens(p) {
  const brand = new Set(p.brand.toLowerCase().split(/[^a-z0-9]+/));
  return p.family.toLowerCase().split(/[^a-z0-9]+/)
    .filter(t => t.length > 1 && !GENERIC_TOKENS.has(t) && !brand.has(t));
}
function hasWord(q, t) {
  return new RegExp('\\b' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(q);
}
function matchProduct(q) {
  let best = null, bestScore = 0;
  for (const p of CATALOG) {
    const key = keyTokens(p);
    if (!key.length) continue;                       // nothing distinctive to match on
    if (!key.every(t => hasWord(q, t))) continue;    // every distinctive word must be present
    let score = familyTokens(p).filter(t => hasWord(q, t)).length * 10;
    if (q.includes(String(p.screenSize))) score += 25;
    if (q.includes(p.name.toLowerCase())) score += 100;
    score += p.rating;                               // stable tie-break
    if (score > bestScore) { bestScore = score; best = p; }
  }
  return best;
}

function assistAnswer(qRaw) {
  const q = qRaw.toLowerCase();

  // 0. a question about another department. Novi is a full-line retailer, so the
  // assistant must not answer "I need a TV" with a laptop shortlist. It is
  // grounded on laptops only, and it should say so and hand the shopper over.
  const other = matchDepartment(q);
  if (other) return answerDepartment(other);

  // 1. a collection asked for by name, or a request to be placed in one
  const namedColl = COLLECTIONS.find(c => q.includes(c.name.toLowerCase()));
  if (namedColl) return answerCollection(namedColl);
  if (/which collection|what collection|collections?\b.*(right|for me|should i)|explain.*collections?/.test(q))
    return answerCollectionsOverview();

  // 2. a named product, or the product currently in context
  let target = matchProduct(q);
  if (!target && ASSIST_CTX && /\b(it|this|that|the laptop)\b/.test(q)) target = P(ASSIST_CTX);
  if (target) { ASSIST_CTX = target.id; return answerAboutProduct(target, q); }

  // 3. concept explainers
  const concept = CONCEPTS.find(c => c.re.test(q));
  if (concept) return { role: 'a', text: concept.a, grounded: 'general' };

  // 4. otherwise treat it as a shortlist request
  return answerShortlist(q);
}
/* Department cues. Deliberately narrow: a laptop shopper saying "I want a big
   screen" must not be bounced to TVs, so we only match explicit product words. */
const DEPT_CUES = [
  { d: 'tv',         re: /\b(tv|tvs|television|oled|qled|soundbar|projector|home theatre|home theater|roku|streaming stick)\b/ },
  { d: 'mobile',     re: /\b(phone|phones|iphone|galaxy s\d|pixel \d|smartwatch|smart watch|apple watch|fitbit|garmin)\b/ },
  { d: 'audio',      re: /\b(headphone|headphones|earbud|earbuds|airpod|airpods|speaker|speakers|turntable|soundsystem)\b/ },
  { d: 'gaming',     re: /\b(playstation|ps5|xbox|nintendo|switch|console|steam deck)\b/ },
  { d: 'appliances', re: /\b(fridge|refrigerator|washer|washing machine|dryer|dishwasher|air fryer|vacuum|roomba|coffee maker)\b/ },
  { d: 'cameras',    re: /\b(camera|cameras|mirrorless|dslr|gopro|drone|drones)\b/ },
  { d: 'smarthome',  re: /\b(doorbell|thermostat|smart lock|smart light|smart bulb|security camera|echo show|nest hub)\b/ }
];
function matchDepartment(q) {
  /* If they also say laptop, they mean a laptop. Stay on task. */
  if (/\b(laptop|notebook|macbook|chromebook|ultrabook|pc)\b/.test(q)) return null;
  const hit = DEPT_CUES.find(c => c.re.test(q));
  return hit ? deptById(hit.d) : null;
}
function answerDepartment(d) {
  const items = deptItems(d.id)
    .sort((a, b) => b.reviewCount - a.reviewCount).slice(0, 3);
  return {
    role: 'a', grounded: 'department', hedged: true,
    text: `I help with laptops, so I can't advise on ${esc(d.name.toLowerCase())} in any detail.
      We do stock that department. Our most reviewed are
      ${items.map(p => `<b>${esc(p.brand)} ${esc(p.name)}</b>`).join(', ')}.`,
    actions: `<button class="btn out" style="padding:7px 11px;font-size:12px"
      onclick="track('assistant_dept_handoff','${d.id}');go('#/d/${d.id}')">Browse ${esc(d.name)}</button>`
  };
}

function answerCollection(c) {  const pool = CATALOG.filter(p => p.collection === c.name);
  const items = pool.sort((a, b) => (b.rating - b.price / 3000) - (a.rating - a.price / 3000)).slice(0, 3);
  return {
    role: 'a', grounded: 'collection',
    text: `<b>${c.name}</b> is ${c.blurb.replace(/^For /, 'for ').replace(/\.$/, '')}. ${c.long}
      <div style="margin-top:8px">It starts from
      ${money(Math.min(...pool.map(p => p.price)))}. Three worth a look:</div>`,
    cards: items.map(p => p.id),
    actions: `<button class="btn out" style="padding:7px 11px;font-size:12px"
      onclick="toggleAssist(false);go('#/collections/${c.id}')">See all ${c.name}</button>`
  };
}
function answerCollectionsOverview() {
  return {
    role: 'a', grounded: 'collection',
    text: `There are five, and every Windows laptop sits in exactly one. Pick the one that sounds most like you.
      ${collChooser("assistCollection('%ID%')", { compact: true })}`
  };
}

const CONCEPTS = [
  { re: /8\s*gb.*16\s*gb|16\s*gb.*8\s*gb|how much (ram|memory)|difference.*(ram|memory)/,
    a: `Memory is how much the laptop holds in its head at once. <b>8 GB</b> copes with browsing, documents and video calls, but it slows down with a lot of tabs and apps open. <b>16 GB</b> is the comfortable modern baseline and is what I would pick if the machine needs to last four or five years. <b>32 GB</b> only pays off for video editing or large photo libraries.` },
  { re: /ssd|hard drive|storage|how much space|gb.*storage/,
    a: `Storage is what you keep on it. 256 GB fills faster than people expect once photos and downloads pile up. <b>512 GB</b> is the safe default for most people. All the laptops here use solid-state storage, so all of them boot quickly.` },
  { re: /oled|panel|ips|screen type|display type/,
    a: `<b>IPS</b> panels are accurate and cost less. <b>OLED</b> gives you true blacks and much better contrast, which matters for film and photo work, but costs more and uses more battery. High refresh rates above 60 Hz mainly help gaming.` },
  { re: /refresh rate|hz/,
    a: `Refresh rate is how many times a second the screen redraws. 60 Hz is fine for everyday work. 120 Hz and above makes motion look smoother and is worth it for gaming.` },
  { re: /warranty|returns|return policy/,
    a: `Everything here carries at least a one-year limited warranty, and some models carry two. Returns are 15 days, free, in store or by post. A two-year protection plan covering accidental damage can be added on any product page.` },
  { re: /windows|chromeos|macos|operating system|which os/,
    a: `<b>Windows</b> runs the widest range of software and covers everything from budget machines to gaming. <b>ChromeOS</b> is simple, cheap and secure but relies on web apps. <b>macOS</b> is efficient and well integrated if the rest of your devices already are. You can filter by operating system on the laptops page.` }
];

/* ---- product answers, where richness bites ------------------------------- */
function answerAboutProduct(p, q) {
  const rich = effectiveRichness(p) === 'rich';
  const wantsBattery = /battery|last|charge/.test(q);
  const wantsWeight = /weight|heavy|light|carry|travel/.test(q);
  const wantsPorts = /port|hdmi|usb|thunderbolt|connect/.test(q);
  const wantsGaming = /game|gaming|fps|graphics|gpu/.test(q);

  if (!rich) {
    // thin data: the assistant can only answer from five published attributes
    let gap = 'the full specification';
    if (wantsBattery) gap = 'battery life';
    else if (wantsWeight) gap = 'weight and dimensions';
    else if (wantsPorts) gap = 'the port selection';
    else if (wantsGaming) gap = 'the graphics hardware';
    return {
      role: 'a', grounded: 'thin', hedged: true,
      text: `I can only tell you part of this. The listing for the <b>${p.name}</b> publishes
        five attributes: ${p.os}, ${p.cpu}, ${p.ram}, ${p.storage} and a ${p.screenSize}" display, at ${money(p.price)}.
        <b>${gap.charAt(0).toUpperCase() + gap.slice(1)} is not supplied for this model</b>, so I would be guessing,
        and I would rather not guess on something you're spending ${money(p.price)} on.
        <span class="hedge">Answer limited by missing product data.</span>`,
      cards: [p.id],
      actions: `<button class="btn out" onclick="assistSend('Show me something similar with full details')">Show me one with full details</button>`
    };
  }

  let text = `The <b>${p.name}</b> is ${money(p.price)}. It runs ${p.os} on ${p.cpu} with ${p.ram} of memory and ${p.storage}.`;
  if (wantsBattery) text += ` Battery is rated up to <b>${p.battery}</b>, which in real use with the screen at half brightness usually means a full working day${parseInt(p.battery) >= 12 ? ' with room to spare' : ''}.`;
  if (wantsWeight) text += ` It weighs <b>${p.weight}</b> and measures ${p.dimensions}, so it ${parseFloat(p.weight) < 3.2 ? 'travels easily' : 'is better suited to sitting on a desk'}.`;
  if (wantsPorts) text += ` Ports: ${p.ports}.`;
  if (wantsGaming) text += ` Graphics are handled by ${p.gpu}, which ${/RTX|Radeon RX/.test(p.gpu) ? 'is dedicated hardware and will run modern titles well' : 'is integrated, so it is fine for everyday work but not for demanding games'}.`;
  if (!wantsBattery && !wantsWeight && !wantsPorts && !wantsGaming)
    text += ` The ${p.screenSize}" ${p.panel} runs at ${p.resolution}, battery is rated up to ${p.battery}, and it weighs ${p.weight}. It suits ${p.use.join(', ').toLowerCase()}.`;
  text += ` It holds ${p.rating} stars across ${p.reviewCount.toLocaleString()} reviews.`;

  return { role: 'a', grounded: 'rich', text, cards: [p.id] };
}

/* ---- shortlist answers --------------------------------------------------- */
function answerShortlist(q) {
  let list = CATALOG.slice();
  const notes = [];

  const budget = q.match(/\$?\s?(\d{3,4})/);
  if (budget && /under|below|less than|max|budget|cheap/.test(q)) {
    const cap = +budget[1]; list = list.filter(p => p.price <= cap); notes.push('under ' + money(cap));
  }
  const useMap = [[/school|student|college|study|homework/, 'School'], [/work|office|business|meetings|home working/, 'Work'],
                  [/photo|video|creative|design|edit|render/, 'Creative'], [/game|gaming|fps/, 'Gaming'],
                  [/everyday|browsing|email|streaming|basic|simple/, 'Everyday']];
  const use = useMap.find(u => u[0].test(q));
  if (use) { list = list.filter(p => p.use.includes(use[1])); notes.push('for ' + use[1].toLowerCase()); }
  if (/chromebook|chromeos/.test(q)) { list = list.filter(p => p.os === 'ChromeOS'); notes.push('ChromeOS'); }
  if (/mac|macos/.test(q)) { list = list.filter(p => p.os === 'macOS'); notes.push('macOS'); }
  if (/windows/.test(q)) { list = list.filter(p => /Windows/.test(p.os)); notes.push('Windows'); }
  if (/light|thin|portable|carry|travel/.test(q)) { list.sort((a, b) => parseFloat(a.weight) - parseFloat(b.weight)); notes.push('lightest first'); }
  else if (/battery|all.?day|long lasting/.test(q)) { list.sort((a, b) => parseInt(b.battery) - parseInt(a.battery)); notes.push('longest battery first'); }
  else if (/cheap|budget|afford|low price/.test(q)) { list.sort((a, b) => a.price - b.price); notes.push('lowest price first'); }
  else list.sort((a, b) => (b.rating - b.price / 3000) - (a.rating - a.price / 3000) || b.reviewCount - a.reviewCount);

  if (!list.length) {
    return { role: 'a', grounded: 'catalog', hedged: true,
      text: `Nothing in the range matches all of that. If you can relax one of the constraints, price is usually the one with most give. Or I can show you the closest three.`,
      actions: `<button class="btn out" onclick="assistSend('Show me the closest options')">Show closest options</button>` };
  }

  const picks = list.slice(0, 3);
  const why = picks.map(p => `<b>${p.name}</b> at ${money(p.price)}, ${p.ram} and ${p.storage}, ${p.battery} battery, ${p.rating} stars`);
  return {
    role: 'a', grounded: 'catalog',
    text: `Plenty fit${notes.length ? ' ' + notes.join(', ') : ''}. The three I would look at first:
      <br><br>${why.map((w, i) => (i + 1) + '. ' + w).join('<br>')}
      <br><br>${picks[0].price < picks[2].price
        ? `The ${picks[0].name} is the value pick. Stepping up to the ${picks[2].name} buys you ${picks[2].ramGb > picks[0].ramGb ? 'more memory' : 'a better screen'} for ${money(picks[2].price - picks[0].price)} more.`
        : `They are close on price, so this comes down to size and screen.`}`,
    cards: picks.map(p => p.id),
    actions: `<button class="btn out" onclick="S.compare=[${picks.map(p => p.id).join(',')}];track('assistant_compare_built');go('#/compare')">Compare these three</button>`
  };
}


/* ===== app-console.js ===== */
/* ==========================================================================
   Part 5: the research console.

   This is the product. The storefront is the stimulus; everything here is what
   makes it a research instrument rather than a mock website:

     Overview    engagement, funnel, time to task
     Heatmap     where people actually clicked, per route
     Journeys    route to route flow with drop-off
     Designer    reconfigure the experience live, no code, no rebuild
     Cohorts     two conditions side by side on identical metrics
     Replay      scrub the session as a timeline
     Roadshow    rebrand to a named retailer in one click
     Data        export, session links, raw stream
   ========================================================================== */

let CTAB = 'stage';
function setCTab(t) { CTAB = t; track('console_tab', t); paintConsole(); }

/* ---- shared helpers ------------------------------------------------------ */
function evDetail(e) { try { return JSON.parse(e.detail); } catch (x) { return {}; } }
function pct(n, d) { return d ? Math.round((n / d) * 100) : 0; }
function ms(n) { return n === null || n === undefined ? '—' : (n / 1000).toFixed(1) + 's'; }
function routeName(r) {
  if (!r || r === '#/' || r === '') return 'Home';
  if (/^#\/product\//.test(r)) { const p = P(+r.split('/')[2]); return p ? p.name.slice(0, 28) : 'Product'; }
  if (/^#\/collections\/(.+)/.test(r)) {
    const id = r.match(/^#\/collections\/(.+)/)[1];
    const c = COLLECTIONS.find(x => x.id === id);
    return c ? c.name : 'Collection';
  }
  if (/^#\/(d|dept)\/(.+)/.test(r)) {
    const id = r.match(/^#\/(?:d|dept)\/(.+)/)[1];
    const d = (typeof DEPARTMENTS !== 'undefined' ? DEPARTMENTS : []).find(x => x.id === id);
    return d ? d.name : 'Department';
  }
  if (/^#\/s\//.test(r)) {
    const p = (typeof STORE !== 'undefined' ? STORE : []).find(x => String(x.id) === r.split('/')[2]);
    return p ? (p.title || p.name || 'Product').slice(0, 28) : 'Product';
  }
  if (/^#\/search/.test(r)) {
    const q = decodeURIComponent((r.split('=').pop() || '')).replace(/\+/g, ' ');
    return q ? 'Search: ' + q.slice(0, 20) : 'Search';
  }
  return r.replace('#/', '').replace(/\//g, ' ').replace(/^\w/, c => c.toUpperCase()) || 'Home';
}

/* Metrics are computed from the event stream on demand rather than accumulated,
   so a moderator can change the condition mid-session and the numbers stay
   attributable to the cell the participant was actually in. */
function metrics(filterCond, source) {
  const base = source || EVENTS;
  const ev = filterCond ? base.filter(e => e.condition === filterCond) : base;
  const of = n => ev.filter(e => e.event === n);
  const exits = of('page_exit').map(evDetail);
  const dwell = exits.map(d => d.dwellMs || 0).filter(Boolean);
  const scroll = exits.map(d => d.maxScrollPct || 0);
  const viewed = new Set(of('product_viewed').map(e => e.detail));
  const ptl = of('path_to_laptops').map(evDetail);
  const succ = of('task_success');
  /* Laptops and merchandise are both product_viewed, separated by grade. Novi
     sells eight departments now, so "did the shopper stay in the laptop aisle"
     is a real question and the console could not answer it. */
  const pv = of('product_viewed').map(evDetail);
  const merchPdp = pv.filter(d => d.grade === 'merch').length;
  /* Search intent. TP1 is gated on it, so the entry rate is meaningless
     without the eligible denominator alongside the raw count. */
  const srch = of('search_submitted').map(evDetail);
  const intent = srch.filter(d => d.laptopIntent).length;
  const acs = of('autocomplete_shown').map(evDetail);
  return {
    events: ev.length,
    productsViewed: viewed.size,
    pdpViews: of('product_viewed').length,
    laptopPdpViews: of('product_viewed').length - merchPdp,
    merchPdpViews: merchPdp,
    deptViews: of('department_viewed').length,
    searches: srch.length,
    laptopSearches: intent,
    merchSearches: srch.length - intent,
    zeroResultSearches: srch.filter(d => d.zeroResults).length,
    collSearchImpressions: srch.filter(d => d.collectionsShown).length,
    acShown: acs.length,
    acWithColl: acs.filter(d => d.laptopIntent).length,
    assistOpens: of('assistant_opened').length,
    /* These three counted event names that are never emitted, so the funnel
       could not complete, the cohort table read zero and the study CSV
       exported zeros no matter what the participant did. */
    assistMsgs: of('assistant_question').length,
    collViews: of('collection_viewed').length + of('collections_index_viewed').length,
    schemaOpens: of('structured_data_opened').length,
    addToCart: of('add_to_cart').length,
    checkouts: of('checkout_completed').length,
    compares: of('compare_changed').map(evDetail).filter(d => d.on).length,
    medianDwell: dwell.length ? dwell.slice().sort((a, b) => a - b)[Math.floor(dwell.length / 2)] : 0,
    avgScroll: scroll.length ? Math.round(scroll.reduce((a, b) => a + b, 0) / scroll.length) : 0,
    pathMs: ptl.length ? ptl[0].ms : null,
    pathSteps: ptl.length ? ptl[0].steps : null,
    successMs: succ.length ? parseInt(String(succ[0].detail).replace('ms=', ''), 10) : null,
    success: succ.length > 0
  };
}
/* The art arm rides on every event, so it can be read back off the stream
   without a separate accumulator. A session that was switched mid-way reports
   whichever arm produced each event, which is the honest reading. */
function artOf(e) { return e.art || 'wall'; }
function metricsByArt(arm, source) {
  return metrics(null, (source || EVENTS).filter(e => artOf(e) === arm));
}

/* ==========================================================================
   Touchpoints. The console view of slide 14.

   This is the tab that turns the matrix from a recommendation into a
   measurement. For each of the eleven touchpoints it reports whether it is
   live in the running condition, how many shoppers entered a collection
   through it, and what happened to them afterwards.

   The deck could only rank touchpoints by what shoppers said they would
   prefer. This ranks them by what shoppers actually did.
   ========================================================================== */
const TP_SOURCE_LABEL = {
  search_autocomplete: 1, search_results_strip: 1,
  nav_flyout: 2, nav_drawer: 2, nav_menu: 2,
  category_strip: 3,
  listing_blade: 4, collection_tile: 4, compare_table: 4, tile_badge: 4,
  advisor_step: 5, advisor_results: 5,
  brand_store_strip: 6, brand_blade: 6,
  pdp_badge: 7,
  syndicated: 8,
  assistant: 9,
  screen_fill: 10,
  below_fold: 11
};
function tpEntries(source) {
  const ev = (source || EVENTS).filter(e => e.event === 'collection_entered');
  const by = {};
  ev.forEach(e => {
    const d = evDetail(e), n = TP_SOURCE_LABEL[d.touchpoint];
    if (!n) return;
    by[n] = (by[n] || 0) + 1;
  });
  return by;
}
/* Any entry whose source is not in the map is dropped silently, which has bitten
   this build before: a new surface ships, its entries never appear, and the
   touchpoint looks unused rather than unmapped. Surfaced instead of swallowed. */
function tpUnmapped(source) {
  const out = {};
  (source || EVENTS).filter(e => e.event === 'collection_entered').forEach(e => {
    const s = evDetail(e).touchpoint || '(none)';
    if (!TP_SOURCE_LABEL[s]) out[s] = (out[s] || 0) + 1;
  });
  return out;
}
function cTouchpoints() {
  const live = (typeof tpList === 'function') ? tpList() : [];
  const entries = tpEntries();
  const total = Object.keys(entries).reduce((a, k) => a + entries[k], 0);
  const m = metrics();
  /* Whether the shopper who entered through a touchpoint went on to reach a
     laptop, and how fast. With one live session these are a single journey,
     not a statistic, and the copy says so rather than implying a sample. */
  const advColl = EVENTS.filter(e => e.event === 'advisor_collection_picked').length;
  const advSkip = EVENTS.filter(e => e.event === 'advisor_collection_skipped').length;
  const unmapped = tpUnmapped();
  const unmappedKeys = Object.keys(unmapped);

  const row = t => {
    const on = live.indexOf(t.n) !== -1;
    const n = entries[t.n] || 0;
    const share = total ? Math.round((n / total) * 100) : 0;
    return `<tr class="${on ? '' : 'tpoff'}">
      <td class="tpn">${t.n}</td>
      <td><span class="tptier t${t.tier}">${t.tier}</span></td>
      <td><b>${esc(t.name)}</b><span class="tpnote">${esc(t.note)}</span></td>
      <td class="tpsaid">${t.pref == null ? '<i>not tested</i>' : t.pref + '%'}</td>
      <td class="tpstate">${on ? '<span class="tplive">Live</span>' : '<span class="tpdark">Off</span>'}</td>
      <td class="tpdid"><b>${n}</b>${total ? `<span class="tpbar"><i style="width:${share}%"></i></span>` : ''}</td>
    </tr>`;
  };

  return `
  <div class="cpanel">
    <div class="cpanelhead"><div><h2>RISE touchpoint matrix</h2>
      <p>The eleven touchpoints on slide 14 of RISE Online, and what each one is
         doing in this session. <b>Said</b> is what shoppers told the GWI study.
         <b>Did</b> is what has actually happened here.</p></div>
      <div class="tpcondnow">Condition ${esc(S.condition)}<span>${esc((CONDITIONS[S.condition] || {}).label || '')}</span></div>
    </div>
    <table class="tptable">
      <thead><tr><th></th><th>Tier</th><th>Touchpoint</th><th>Said</th><th>In this run</th><th>Entries</th></tr></thead>
      ${TIERS.map(tier => `<tbody class="tpgroup">
        <tr class="tphead"><td colspan="6">${tier} &middot; ${esc(TIER_NOTE[tier])}</td></tr>
        ${tpsInTier(tier).map(row).join('')}
      </tbody>`).join('')}
    </table>
    <div class="tpfoot">
      <div><b>${total}</b><span>collection entries</span></div>
      <div><b>${S.firstCollTp ? esc(prettyTp(S.firstCollTp)) : '&mdash;'}</b><span>first entry point</span></div>
      <div><b>${m.pathMs != null ? (m.pathMs / 1000).toFixed(1) + 's' : '&mdash;'}</b><span>time to a laptop</span></div>
      <div><b>${m.pathSteps != null ? m.pathSteps : '&mdash;'}</b><span>steps to a laptop</span></div>
      <div><b>${advColl}/${advColl + advSkip}</b><span>took the collection step in Help Me Choose</span></div>
    </div>
    ${unmappedKeys.length ? `<p class="tphint" style="color:#f0b429">
      Unmapped entry ${unmappedKeys.length === 1 ? 'source' : 'sources'}:
      ${unmappedKeys.map(k => `<b>${esc(k)}</b> (${unmapped[k]})</b>`).join(', ')}.
      These entries are real but are not counted against any touchpoint. Add them to
      TP_SOURCE_LABEL.</p>` : ''}
  </div>

  ${searchIntentPanel(m)}

  <div class="cpanel">
    <div class="cpanelhead"><div><h2>What this can settle</h2>
      <p>Conditions F to I hold everything else still and move only which tier of
         the matrix is live, so the difference between them is the tier.</p></div></div>
    <div class="tparms">
      ${[['F', 'P0 only', 'Search, navigation, category. The three earliest placements, and 71% of stated preference.'],
         ['G', 'P0 + P1', 'Adds listing blades, Help Me Choose and the brand store.'],
         ['H', 'P2 + P3 only', 'Badges and reinforcement with no early guidance. The arm that tests whether badging alone does anything.'],
         ['I', 'Every touchpoint', 'Full RISE.']].map(a => `
        <button class="tparm ${S.condition === a[0] ? 'on' : ''}" onclick="setCondition('${a[0]}')">
          <b>${a[0]}</b><span class="tparmn">${esc(a[1])}</span><span class="tparmd">${esc(a[2])}</span></button>`).join('')}
    </div>
    <p class="tphint">Switching here changes the participant's storefront immediately, on their screen, mid-session.</p>
  </div>`;
}
/* ---- Search intent -------------------------------------------------------
   Novi sells eight departments, so Collections only enter search when the
   shopper shows laptop intent. That changes what TP1's entry count means: the
   denominator is no longer every search, it is every search that was eligible.
   Reporting the raw count alone would understate TP1 on a session where the
   participant spent half their searches in the television aisle. */
function searchIntentPanel(m) {
  const elig = m.collSearchImpressions;
  const tp1 = (tpEntries()[1] || 0);
  const bars = [
    ['Laptop intent', m.laptopSearches],
    ['Other departments', m.merchSearches],
    ['Returned nothing', m.zeroResultSearches]
  ];
  const max = Math.max.apply(null, bars.map(b => b[1]).concat([1]));
  return `
  <div class="cpanel">
    <div class="cpanelhead"><div><h2>Search intent</h2>
      <p>Novi is a full-line retailer, so Collections only appear in search once
         the shopper has shown laptop intent. TP1 is measured against the searches
         that were eligible, not against every search.</p></div></div>
    <div class="tpfoot" style="margin-top:0">
      <div><b>${m.searches}</b><span>searches</span></div>
      <div><b>${m.laptopSearches}</b><span>showed laptop intent</span></div>
      <div><b>${elig}</b><span>eligible for Collections</span></div>
      <div><b>${tp1}</b><span>entries via search</span></div>
      <div><b>${elig ? pct(tp1, elig) + '%' : '&mdash;'}</b><span>entry rate when eligible</span></div>
      <div><b>${m.searches ? pct(tp1, m.searches) + '%' : '&mdash;'}</b><span>entry rate, all searches</span></div>
    </div>
    <div class="bars" style="margin-top:14px">
      ${bars.map((b, i) => barRow(b[0], b[1], max, b[1], i % 2 === 1)).join('')}
    </div>
    <p class="tphint">${m.searches
      ? (elig
        ? 'The gap between the two entry rates is the cost of measuring TP1 on a store that sells more than laptops. Quote the eligible rate.'
        : 'No search yet has been eligible for Collections, so TP1 has had no chance to fire. Search a laptop word to arm it.')
      : 'No searches captured yet.'}
      ${m.zeroResultSearches ? ` <b>${m.zeroResultSearches}</b> ${m.zeroResultSearches === 1 ? 'search' : 'searches'} returned nothing at all, which ends the journey rather than redirecting it.` : ''}</p>
  </div>`;
}

/* ==========================================================================
   Collection art. The photography / graphic mark arm.

   How a collection is fronted is an open question with two reasonable answers.
   One is to use the product photography the brand already ships, the device
   displaying its own collection wallpaper, because that is real merchandising
   and shoppers respond to device imagery. The other is that most shoppers
   arrive on mobile, where the collection name truncates and the render sits at
   thumbnail size beside competing device imagery, so it does not
   differentiate. Both are reasonable. Neither side has evidence.

   The arm rides on every event, so the same session can be compared under
   both treatments without rerunning anything.
   ========================================================================== */
const ART_ARMS = [
  ['wall', 'Product photography', 'The device shown displaying its collection wallpaper, the way brand assets normally ship.'],
  ['icon', 'Graphic mark', 'A distinct mark per collection, legible at thumbnail size and in a truncated mobile row.'],
  ['both', 'Both', 'Photography on the device, mark on the label. The compromise nobody has costed.']
];
function cArt() {
  const arms = ART_ARMS.map(a => {
    const ev = EVENTS.filter(e => artOf(e) === a[0]);
    const m = metrics(null, ev);
    const entries = tpEntries(ev);
    return {
      key: a[0], name: a[1], note: a[2], m: m, ev: ev,
      entries: Object.keys(entries).reduce((x, k) => x + entries[k], 0)
    };
  });
  const seen = arms.filter(a => a.ev.length);
  const maxE = Math.max.apply(null, arms.map(a => a.entries).concat([1]));
  const maxP = Math.max.apply(null, arms.map(a => a.m.pdpViews).concat([1]));
  const cur = (typeof artMode === 'function') ? artMode() : 'wall';

  const rows = [
    ['Events captured', a => a.m.events],
    ['Collection entries', a => a.entries],
    ['Collection pages viewed', a => a.m.collViews],
    ['Laptop PDPs reached', a => a.m.laptopPdpViews],
    ['Searches with laptop intent', a => a.m.laptopSearches],
    ['Time to a laptop', a => a.m.pathMs ? ms(a.m.pathMs) : '—'],
    ['Steps to a laptop', a => a.m.pathSteps == null ? '—' : a.m.pathSteps],
    ['Median dwell', a => ms(a.m.medianDwell)],
    ['Avg scroll depth', a => a.m.avgScroll + '%'],
    ['Added to cart', a => a.m.addToCart]
  ];

  return `
  <div class="cpanel cfull">
    <div class="cpanelhead"><div><h2>Collection art</h2>
      <p>Icons or wallpapers on the collection tiles, switchable mid-session.
         The storefront is identical in every other respect, so any difference
         here is the treatment.</p></div>
    </div>
    <div class="tparms three">
      ${ART_ARMS.map(a => `<button class="tparm ${cur === a[0] ? 'on' : ''}" onclick="setArtMode('${a[0]}')">
        <b>${esc(a[1])}</b><span class="tparmd">${esc(a[2])}</span></button>`).join('')}
    </div>
    <p class="tphint">Switching changes the participant's screen immediately. Every event from that
      point carries the new arm, so the two are never mixed in the same number.</p>
  </div>

  <div class="cpanel cfull">
    <div class="cpanelhead"><div><h2>Arm comparison</h2>
      <p>Only arms with captured events are meaningful. ${seen.length < 2
        ? '<b>One arm has data so far.</b> Run the same task under a second arm and this table becomes the finding.'
        : 'Both arms have data. Same catalogue, same task, one variable moved.'}</p></div></div>
    <table class="cohort">
      <thead><tr><th>Metric</th>${ART_ARMS.map(a =>
        `<th>${esc(a[1])}${a[0] === cur ? '<span class="armlive">showing now</span>' : ''}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr><td>${r[0]}</td>${arms.map(a =>
        `<td>${a.ev.length ? r[1](a) : '<span class="sub">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:18px">
      <div><h3 style="font-size:12px">Collection entries by arm</h3><div class="bars">
        ${arms.map(a => barRow(a.name, a.entries, maxE, a.entries)).join('')}
      </div></div>
      <div><h3 style="font-size:12px">Laptop PDPs reached by arm</h3><div class="bars">
        ${arms.map(a => barRow(a.name, a.m.pdpViews, maxP, a.m.pdpViews, true)).join('')}
      </div></div>
    </div>
  </div>

  <div class="cpanel cfull">
    <div class="cpanelhead"><div><h2>What to say about this</h2></div></div>
    <div class="tparms three">
      <div class="tparm" style="cursor:default">
        <b>It is a real open question</b>
        <span class="tparmd">One view is to use the product photography brands already ship, and that adding
          another element causes confusion. The counter is that at thumbnail size beside competing device
          imagery the render does not differentiate, and on mobile the name truncates. Both are defensible.</span></div>
      <div class="tparm" style="cursor:default">
        <b>The instrument does not take a side</b>
        <span class="tparmd">It runs both and reports what shoppers did. The photography arm renders the
          device displaying its wallpaper, which is what the real asset shows, not a bare swatch. Presenting
          it any other way would have rigged the comparison before it started.</span></div>
      <div class="tparm" style="cursor:default">
        <b>Disclose the palette caveat</b>
        <span class="tparmd">The wallpaper colours are sampled from reference artwork, so they are faithful
          in hue and structure but not pixel-exact to the production assets. Worth volunteering rather than
          being asked.</span></div>
    </div>
  </div>`;
}

/* ==========================================================================
   Command center. The stage surface.

   The other ten tabs are for analysis, where hunting through a matrix is fine
   because nobody is watching. On stage the failure mode is different: seven
   minutes, a live audience, and a moderator who cannot afford to go looking
   for a control. So every lever that changes the participant's screen is on
   this one page, at a size that can be hit without aiming, with the running
   order beside it and the current state readable from the back of the room.

   Nothing here is new capability. It is the same setCondition, setArtMode and
   setDensity the other tabs call. What is new is that the demo no longer
   depends on remembering which tab a control lives in.
   ========================================================================== */
const BEATS = [
  ['A marketer built this',
   'A full working store. Eight departments, sixty-five laptops. No engineer, no agency. That fact is the opening line.',
   null, null],
  ['Run the experiment, live',
   'Spec-led versus use-case-led, as two live conditions in the same store. Open on P2 + P3, then switch it under her mid-visit. What arrives on the category page is the collection banner, five machines and five wallpapers.',
   null, null],
  ['Evidence, not opinion',
   'Not a point of view, a number. Where shoppers actually went, recorded rather than recalled.',
   'heatmap', 'Open the heatmap'],
  ['Any partner, any market',
   'One click and the shopper is standing in their store instead of ours. For a seller, this is the beat that starts the account conversation.',
   'roadshow', 'Open the profiles'],
  ['Eleven placements, funding for three',
   'This is the meeting that used to be won by whoever spoke loudest. Now it is a measurement.',
   'touchpoints', 'Open the matrix']
];
/* The full condition labels run to nine words, which stacks the lever four
   buttons high and strands the other two columns in white space. On stage the
   tier is the only part that matters, so the buttons carry the tier and the
   sentence lives in the state line above. */
const COND_SHORT = { F: 'P0 only', G: 'P0 + P1', H: 'P2 + P3', I: 'Every touchpoint' };
function cStage() {
  const m = metrics();
  const art = (typeof artMode === 'function') ? artMode() : 'wall';
  const cond = CONDITIONS[S.condition] || {};
  const dens = (typeof density === 'function') ? density() : 'busy';
  const ent = tpEntries();
  const total = Object.keys(ent).reduce((a, k) => a + ent[k], 0);
  const live = EVENTS.length;

  const lever = (label, opts, current, fn) => `
    <div class="lvr">
      <div class="lvrlab">${label}</div>
      <div class="lvrbtns">${opts.map(o => `<button class="lvrb ${current === o[0] ? 'on' : ''}"
        onclick="${fn}('${o[0]}')">${esc(o[1])}</button>`).join('')}</div>
    </div>`;

  return `
  <div class="cpanel cfull stagenow">
    <div class="snhead">
      <div><span class="snlab">On the participant screen right now</span>
        <h2>${esc((typeof ART_LABEL !== 'undefined' && ART_LABEL[art]) || art)}</h2>
        <p>${esc(cond.label || S.condition)} &middot; ${dens === 'busy' ? 'Busy retail' : 'Clean retail'}
           &middot; ${esc(((ROADSHOW.find(r => r.id === (S.profile || 'novi')) || {}).name || 'Novi').replace(' (default)', ''))}</p></div>
      <div class="sncounts">
        <div><b>${live}</b><span>events</span></div>
        <div><b>${total}</b><span>collection entries</span></div>
        <div><b>${m.pathMs ? ms(m.pathMs) : '&mdash;'}</b><span>time to a laptop</span></div>
      </div>
    </div>
    <div class="levers">
      ${lever('Collection art', ART_ARMS.map(a => [a[0], a[1]]), art, 'setArtMode')}
      ${lever('RISE condition', ['F', 'G', 'H', 'I'].filter(k => CONDITIONS[k])
        .map(k => [k, COND_SHORT[k] || k]), S.condition, 'setCondition')}
      ${lever('Retail density', [['busy', 'Busy'], ['clean', 'Clean']], dens, 'setDensity')}
    </div>
    <p class="tphint">Every button here changes the participant's screen immediately, and every event
      from that point carries the new value. Nothing is retroactive, so the two arms never mix.</p>
    <div class="lvr" style="margin-top:18px">
      <div class="lvrlab">Retailer profile &middot; reskins the participant's storefront</div>
      <div class="lvrbtns">${ROADSHOW.map(r => `<button class="lvrb ${(S.profile || 'novi') === r.id ? 'on' : ''}"
        onclick="applyRoadshow('${r.id}')" title="${esc(r.tag)}">${esc(r.name.replace(' (default)', ''))}</button>`).join('')}</div>
    </div>
    <div class="stagebtns">
      <button class="btn pri" onclick="openParticipantTab()">Open the storefront</button>
      <button class="btn out" onclick="copyLink()">Copy participant link</button>
    </div>
  </div>

  <div class="cpanel cfull">
    <div class="cpanelhead"><div><h2>Running order</h2>
      <p>Seven minutes. Each beat is one move and one sentence.</p></div></div>
    <div class="beats">
      ${BEATS.map((b, i) => `<div class="beat">
        <div class="beatn">${i + 1}</div>
        <div class="beatbody"><b>${esc(b[0])}</b><span>${esc(b[1])}</span></div>
        <div class="beatgo">${b[2]
          ? `<button class="btn out" onclick="setCTab('${b[2]}')">${esc(b[3])}</button>`
          : i === 1
            ? `<div class="lvrbtns">${['H', 'I'].filter(k => CONDITIONS[k]).map(k =>
                `<button class="lvrb ${S.condition === k ? 'on' : ''}" onclick="setCondition('${k}')">${esc(COND_SHORT[k] || k)}</button>`).join('')}</div>`
            : `<span class="sub" style="font-size:11.5px">Storefront screen</span>`}</div>
      </div>`).join('')}
    </div>
  </div>

  <div class="cpanel cfull">
    <div class="cpanelhead"><div><h2>Evidence to point at</h2>
      <p>The numbers behind beats three and five, so you are not switching tabs to quote them.</p></div></div>
    <div class="tpfoot" style="margin-top:0">
      <div><b>${m.searches}</b><span>searches</span></div>
      <div><b>${m.laptopSearches}</b><span>showed laptop intent</span></div>
      <div><b>${m.laptopPdpViews}</b><span>laptop products opened</span></div>
      <div><b>${m.merchPdpViews}</b><span>other departments</span></div>
      <div><b>${m.collViews}</b><span>collection pages</span></div>
      <div><b>${m.pathSteps != null ? m.pathSteps : '&mdash;'}</b><span>steps to a laptop</span></div>
    </div>
    ${live === 0 ? `<p class="tphint" style="color:#f0b429">No events captured yet. Open the storefront
      and shop for a moment before the talk, or the panels will be empty on stage.</p>` : ''}
  </div>`;
}

const TIER_NOTE = {
  P0: 'Build first. Early journey, where the shopper is still orienting.',
  P1: 'Build next. Guided discovery and assortment.',
  P2: 'Reinforcement. Confirms a decision rather than starting one.',
  P3: 'Finishing. Lowest priority in the deck.'
};
function prettyTp(src) {
  const n = TP_SOURCE_LABEL[src];
  const t = n ? tpByN(n) : null;
  return t ? t.n + ' ' + t.name : String(src || '').replace(/_/g, ' ');
}

/* ========================================================================== */
function viewConsole() {
  return `<div class="sectionhead" style="margin-top:22px">
      <div><h1 class="h1">Intelligence console</h1>
      <p class="sub">Moderator only. Participants should not see this screen.</p></div>
      <button class="btn ghost" onclick="${'openParticipantTab()'}">Open storefront</button></div>
    <div class="ctabs" id="ctabs"></div>
    <div class="console" id="consolebody"></div>`;
}

const CTABS = [
  ['stage', 'Command center'], ['overview', 'Overview'], ['touchpoints', 'Touchpoints'],
  ['art', 'Collection art'], ['heatmap', 'Heatmap'], ['journeys', 'Journeys'],
  ['designer', 'Designer'], ['sessions', 'Sessions'], ['cohorts', 'Cohorts'],
  ['replay', 'Replay'], ['roadshow', 'Roadshow'], ['data', 'Data']
];

function paintConsole() {
  const tabs = document.getElementById('ctabs');
  if (tabs) tabs.innerHTML = CTABS.map(t =>
    `<button class="${CTAB === t[0] ? 'on' : ''}" onclick="setCTab('${t[0]}')">${t[1]}</button>`).join('');
  const el = document.getElementById('consolebody');
  if (!el) return;
  el.className = 'console' + (CTAB === 'overview' || CTAB === 'data' ? '' : ' wide');  el.innerHTML =
      CTAB === 'stage'    ? cStage()
    : CTAB === 'heatmap'  ? cHeatmap()
    : CTAB === 'touchpoints' ? cTouchpoints()
    : CTAB === 'art'      ? cArt()
    : CTAB === 'journeys' ? cJourneys()
    : CTAB === 'designer' ? cDesigner()
    : CTAB === 'cohorts'  ? cCohorts()
    : CTAB === 'sessions' ? cSessions()
    : CTAB === 'replay'   ? cReplay()
    : CTAB === 'roadshow' ? cRoadshow()
    : CTAB === 'data'     ? cData()
    : cOverview();
  if (CTAB === 'overview' || CTAB === 'data') paintLog();
  if (CTAB === 'heatmap') drawHeat();
  if (CTAB === 'replay') paintReplay();
}

/* ---- visual primitives ---------------------------------------------------
   The console is the product in this demo, so the numbers have to read as
   findings rather than as a form. These are small and dependency-free: inline
   SVG and flex bars, drawn from the same event stream as everything else. */
function kpi(label, value, note, tone) {
  return `<div class="kpi ${tone || ''}"><div class="kl">${label}</div>
    <div class="kv">${value}</div>${note ? `<div class="kn">${note}</div>` : ''}</div>`;
}
function sparkline(vals, w, h, color) {
  if (!vals || vals.length < 2) return '';
  const max = Math.max.apply(null, vals) || 1;
  const step = w / (vals.length - 1);
  const pts = vals.map((v, i) => `${(i * step).toFixed(1)},${(h - (v / max) * (h - 2) - 1).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color || '#4da3ff'}" stroke-width="1.6"
      stroke-linejoin="round" stroke-linecap="round"/>
    <polygon points="0,${h} ${pts.join(' ')} ${w},${h}" fill="${color || '#4da3ff'}" opacity=".18"/></svg>`;
}
function barRow(label, value, max, display, alt) {
  const w = max > 0 ? Math.max(2, Math.round((value / max) * 100)) : 0;
  return `<div class="barrow ${alt ? 'alt' : ''}"><div class="bl" title="${esc(String(label))}">${esc(String(label))}</div>
    <div class="bt"><div class="bf" style="width:${w}%"></div></div>
    <div class="bv">${display === undefined ? value : display}</div></div>`;
}
/* Activity over the session, bucketed, so a moderator can see at a glance
   whether the participant is still moving or has stalled. */
function activityBuckets(n) {
  n = n || 26;
  if (!EVENTS.length) return [];
  const first = S.startedAt, last = Date.now();
  const span = Math.max(1, last - first), out = new Array(n).fill(0);
  EVENTS.forEach(e => {
    const t = typeof e.msSinceSession === 'number' ? e.msSinceSession : 0;
    const i = Math.min(n - 1, Math.max(0, Math.floor((t / span) * n)));
    out[i]++;
  });
  return out;
}

/* ---------------- Heatmap ---------------- */
/* Clicks are stored as viewport percentages, so the map is comparable across
   screen sizes. Rendered to a canvas as additive radial gradients, then a
   palette is applied per pixel, which is how real heatmap tools do it. */
let HEAT_ROUTE = 'all';
function heatRoutes() {
  const seen = {};
  CLICKS.forEach(c => { seen[c.route] = (seen[c.route] || 0) + 1; });
  return Object.keys(seen).sort((a, b) => seen[b] - seen[a]).map(r => [r, seen[r]]);
}
function setHeatRoute(r) { HEAT_ROUTE = r; paintConsole(); }

function cHeatmap() {
  const routes = heatRoutes();
  const pool = HEAT_ROUTE === 'all' ? CLICKS : CLICKS.filter(c => c.route === HEAT_ROUTE);
  const byLabel = {};
  pool.forEach(c => { byLabel[c.label] = (byLabel[c.label] || 0) + 1; });
  const top = Object.keys(byLabel).sort((a, b) => byLabel[b] - byLabel[a]).slice(0, 12);
  return `
  <div class="card panel">
    <h3>Click heatmap</h3>
    <p class="sub" style="font-size:11px;margin:0 0 10px">${CLICKS.length} clicks captured this session.
      Positions are stored as a percentage of the viewport, so the map stays comparable across screen sizes.</p>
    <div class="field"><label>Page</label>
      <select onchange="setHeatRoute(this.value)">
        <option value="all" ${HEAT_ROUTE === 'all' ? 'selected' : ''}>All pages (${CLICKS.length})</option>
        ${routes.map(r => `<option value="${esc(r[0])}" ${HEAT_ROUTE === r[0] ? 'selected' : ''}>${esc(routeName(r[0]))} (${r[1]})</option>`).join('')}
      </select></div>
    <div class="heatwrap">
      <canvas id="heatcv" width="960" height="600"></canvas>
      <div class="heatempty" id="heatempty" style="display:${pool.length ? 'none' : 'flex'}">
        No clicks captured yet. Browse the store, then come back.</div>
    </div>
    <div class="heatlegend"><span>cold</span><i></i><span>hot</span>
      <span style="margin-left:auto">${pool.length} clicks shown</span></div>
  </div>

  <div class="card panel">
    <h3>Most clicked elements</h3>
    ${top.length ? `<div class="bars">${top.map(l =>
        barRow(l.slice(0, 44), byLabel[l], Math.max.apply(null, top.map(x => byLabel[x])), byLabel[l])).join('')}</div>`
      : '<p class="sub">Nothing yet.</p>'}
  </div>`;
}

function drawHeat() {
  const cv = document.getElementById('heatcv');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const pool = HEAT_ROUTE === 'all' ? CLICKS : CLICKS.filter(c => c.route === HEAT_ROUTE);
  if (!pool.length) return;

  /* pass 1: additive greyscale intensity */
  ctx.globalAlpha = 1;
  pool.forEach(c => {
    const x = (c.xPct / 100) * W, y = (c.yPct / 100) * H, r = 46;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,0.30)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  });

  /* pass 2: map accumulated alpha to a heat palette */
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const a = d[i + 3];
    if (!a) continue;
    const t = Math.min(1, a / 190);
    let r, g, b;
    if (t < 0.25)      { r = 30;  g = 80 + t * 400;  b = 220; }
    else if (t < 0.5)  { r = 30;  g = 190;           b = 220 - (t - 0.25) * 600; }
    else if (t < 0.75) { r = 30 + (t - 0.5) * 900; g = 210;  b = 60; }
    else               { r = 235; g = 210 - (t - 0.75) * 700; b = 50; }
    d[i] = Math.min(255, r); d[i + 1] = Math.min(255, Math.max(0, g)); d[i + 2] = Math.max(0, b);
    d[i + 3] = Math.min(235, a * 2.4);
  }
  ctx.putImageData(img, 0, 0);
}

/* ---------------- Journeys ---------------- */
/* Route-to-route transitions, reconstructed from page_exit plus the ordered
   event stream. Drop-off is the share of sessions that never went further. */
function transitions() {
  const seq = [];
  EVENTS.forEach(e => {
    const r = e.route || '#/';
    if (!seq.length || seq[seq.length - 1] !== r) seq.push(r);
  });
  const pairs = {};
  for (let i = 0; i < seq.length - 1; i++) {
    const k = seq[i] + ' \u2192 ' + seq[i + 1];
    pairs[k] = (pairs[k] || 0) + 1;
  }
  return { seq, pairs };
}
function cJourneys() {
  const { seq, pairs } = transitions();
  const keys = Object.keys(pairs).sort((a, b) => pairs[b] - pairs[a]);
  const max = keys.length ? pairs[keys[0]] : 1;
  const m = metrics();
  return `
  <div class="card panel">
    <h3>Click journey</h3>
    <p class="sub" style="font-size:11px;margin:0 0 12px">The ordered path this participant took.
      ${seq.length} distinct steps. Time to first laptop PDP: <b>${ms(m.pathMs)}</b> in
      <b>${m.pathSteps === null ? '—' : m.pathSteps}</b> steps.</p>
    <div class="jpath">
      ${seq.length ? seq.map((r, i) => `<span class="jnode${/^#\/product\//.test(r) ? ' pdp' : ''}">
        <i>${i + 1}</i>${esc(routeName(r))}</span>`).join('<span class="jarrow">\u2192</span>')
        : '<p class="sub">No navigation yet.</p>'}
    </div>
  </div>

  <div class="card panel">
    <h3>Transitions by frequency</h3>
    ${keys.length ? keys.slice(0, 16).map(k => {
      const [from, to] = k.split(' \u2192 ');
      return `<div class="flowrow">
        <span>${esc(routeName(from))} <i>\u2192</i> ${esc(routeName(to))}</span>
        <div class="flowbar"><div style="width:${pct(pairs[k], max)}%"></div></div>
        <b>${pairs[k]}</b></div>`;
    }).join('') : '<p class="sub">Nothing yet.</p>'}
  </div>`;
}

let DESIGN_KEY = null;
function designKey() { return DESIGN_KEY || S.condition; }
function setDesignKey(k) { DESIGN_KEY = k; paintConsole(); }

function setFlag(key, field, val) {
  const c = CONDITIONS[key];
  if (!c) return;
  c[field] = (val === 'true') ? true : (val === 'false') ? false : val;
  saveFlags();
  track('condition_edited', { condition: key, field: field, value: String(c[field]) });

/* ---------------- Sessions ----------------
   The archive is what turns one demo into a study. Every completed session is
   kept, so conditions can be compared across participants rather than only
   within whichever run happens to be loaded. Still entirely on this machine.
------------------------------------------------------------------------- */
function archMetrics(a) {
  const m = metrics(null, a.events || []);
  const mins = a.endedAt && a.startedAt ? ((a.endedAt - a.startedAt) / 60000) : 0;
  return Object.assign(m, { mins: mins, clicks: (a.clicks || []).length, art: archArt(a) });
}
/* A session can be switched mid-run, so the arm is whichever produced most of
   the events rather than whatever happened to be set when it was archived. */
function archArt(a) {
  const by = {};
  (a.events || []).forEach(e => { const k = artOf(e); by[k] = (by[k] || 0) + 1; });
  const ks = Object.keys(by);
  if (!ks.length) return '—';
  const top = ks.sort((x, y) => by[y] - by[x])[0];
  return ks.length > 1 ? top + ' (mixed)' : top;
}
function sessionRows() {
  loadArchive();
  const live = EVENTS.length ? [{
    archiveId: '__live', participantId: S.participantId || '(unnamed)',
    condition: S.condition, conditionLabel: (CONDITIONS[S.condition] || {}).label || S.condition,
    missionLabel: (MISSIONS[S.mission] || {}).label || 'Free exploration',
    startedAt: S.startedAt, endedAt: Date.now(), events: EVENTS, clicks: CLICKS, live: true
  }] : [];
  return live.concat(ARCHIVE.slice().reverse());
}

    b.n++;
