/* ---- TP2, Navigation. Slide 17 --------------------------------------------
   P0. With Collections switched off, the Windows merchandising framework leaves
   the navigation entirely and the shopper falls back to raw category browsing.
   That contrast is the study.

   The nav entry carries a menu rather than being a bare link, because slide
   30 is explicit that a Collection should never appear as a name on its own.
   A shopper who has never met the framework meets it here, with a descriptor.

   The pattern is the mainstream US big-box one: a blue band of pill controls,
   a primary Shop control that opens a single narrow drill-down panel, and
   utility links to the right. It is one component at every width rather than a
   mega menu on desktop and a drawer on mobile, which matters for the study:
   if desktop and mobile shoppers navigate through different structures then
   breakpoint becomes a confound in every journey comparison. */
function deptCats(id) {
  const items = deptItems(id);
  const seen = {}, out = [];
  items.forEach(p => {
    if (!seen[p.cat]) { seen[p.cat] = { cat: p.cat, n: 0 }; out.push(seen[p.cat]); }
    seen[p.cat].n++;
  });
  return out.sort((a, b) => b.n - a.n);
}
function catSlug(c) { return String(c).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

/* Computers & Tablets holds no merchandising stock of its own, because its
   stock is the laptop catalogue the study is about. Its level is therefore
   built from laptop types rather than from STORE, which would be empty. */
function deptRows(id) {
  if (id === 'computers') {
    return TYPES.map(t => ({ label: t, n: CATALOG.filter(p => p.type === t).length,
        /* Windows laptops drills one level further, because that is where the
           Collections framework lives. Every other type goes straight to the
           filtered listing. */
        drill: t === 'Windows laptops' ? 'windows' : null,
        act: `navPick(&quot;type&quot;,'${t.replace(/'/g, "\\'")}')` }))
      .filter(x => x.n).sort((a, b) => b.n - a.n);
  }
  return deptCats(id).map(c => ({ label: c.cat, n: c.n, drill: null,
    act: `navGo('#/d/${id}/${catSlug(c.cat)}')` }));
}

/* Collections is a Windows laptop merchandising framework, not a department and
   not a top-level destination. Exposing it in the nav band or at the first
   level of the menu would have made it more prominent than the real retailer
   would ever make it, and an inflated treatment inflates the result. It sits
   where its products sit: Computers & Tablets, then Windows laptops. */
function paintNav() {
  const el = document.getElementById('mainnav');
  if (!el) return;

  let h = `<div class="navpills">
    <button class="navpill navshop" id="navshop" onclick="toggleNavMenu()" aria-expanded="false">
      <span class="navallico"><i></i><i></i><i></i></span>Shop<i class="navcar"></i></button>
    <button class="navpill" onclick="go('#/deals')">Deals</button>
    <button class="navpill" onclick="go('#/guide')">Buying guides</button>
  </div>
  <div class="navlinks">
    <a onclick="go('#/laptops')">Laptops</a>
    <a onclick="go('#/advisor')">Find your PC</a>
    <a onclick="go('#/compare')">Compare</a>
    <a onclick="go('#/d/tv')">TV &amp; Home Theatre</a>
    <a onclick="go('#/d/mobile')">Mobile</a>
    <a class="navmore" onclick="openNavMenu()">More <i class="navcar"></i></a>
  </div>`;
  el.innerHTML = h;
  /* The footer is a navigation surface too. A Collections link sitting there in
     the control arm would be exactly the kind of leak that makes a control arm
     stop being one, so it is gated on the same touchpoint as the menu. */
  const fc = document.getElementById('footcoll');
  if (fc) fc.innerHTML = tpOn(2)
    ? `<a onclick="go('#/collections')">Collections</a>` : '';
  paintBrand();
}

/* ---- the Shop menu ---------------------------------------------------------
   A drill-down stack rather than an expanding accordion. Each level replaces
   the one before it with a back control, so the panel stays one column at any
   depth and the same panel works on a phone and on a 1500px screen.

   Collections appear here only when TP2 is live. This is navigation, so
   putting Collections in it unconditionally would reopen the exact validity
   hole that made the old control arm useless. */
let NAV_LEVEL = null;
let NAV_T = null;

function navRoot() { return document.getElementById('drawer'); }
function navIsOpen() { const r = navRoot(); return !!r && r.classList.contains('open'); }

function openNavMenu(level) {
  const r = navRoot();
  if (!r) return;
  NAV_LEVEL = level || null;
  clearTimeout(NAV_T);
  syncModOffset();
  r.innerHTML = navHtml();
  r.classList.add('open');
  document.body.classList.add('noscroll');
  const sh = document.getElementById('navshop');
  if (sh) sh.setAttribute('aria-expanded', 'true');
  /* The panel is display:none when closed, so it has to be laid out for one
     frame before the transform can animate. */
  void r.offsetWidth;
  requestAnimationFrame(() => r.classList.add('in'));
  track('nav_menu_opened', { collections: tpOn(2), level: NAV_LEVEL || 'root' });
}
/* Kept under the old name because the header control and the Escape handler
   both call it, and because a moderator may have it in muscle memory. */
function openDrawer() { openNavMenu(); }
function toggleNavMenu() { navIsOpen() ? closeDrawer() : openNavMenu(); }

function closeDrawer() {
  const r = navRoot();
  if (!r || !r.classList.contains('open')) return;
  r.classList.remove('in');
  document.body.classList.remove('noscroll');
  const sh = document.getElementById('navshop');
  if (sh) sh.setAttribute('aria-expanded', 'false');
  clearTimeout(NAV_T);
  NAV_T = setTimeout(() => { r.classList.remove('open'); r.innerHTML = ''; }, 190);
}
function navLevel(id) {
  NAV_LEVEL = id;
  const r = navRoot();
  if (r) { r.innerHTML = navHtml(); const bd = r.querySelector('.navbody'); if (bd) bd.scrollTop = 0; }
}
function navBack() { navLevel(null); }
function navGo(hash) { closeDrawer(); go(hash); }
function navPickColl(id) { closeDrawer(); pickCollection(id, 'nav_menu'); }
function navPick(kind, v) { closeDrawer(); if (kind === 'type') navType(v); }

function navCollSection() {
  return `<div class="navsechead">Shop Windows Laptops by Use Case</div>
    ${COLLECTIONS.map(c => `<button class="navrow navcollrow" style="${collCss(c)}"
      onclick="navPickColl('${c.id}')">
      <span class="navrowart">${collTagSvg(c, 20)}</span>
      <span class="navrowtx"><b>${esc(c.name)}</b><i>${esc(c.blurb)}</i></span></button>`).join('')}
    <button class="navrow navrowall" onclick="navGo('#/collections')">
      <span class="navrowtx"><b>Compare all five collections</b></span></button>`;
}
/* The utility nav and the pill band no longer carry Collections, so the level
   above is the only navigation surface that does. */

function navHtml() {
  const showColl = tpOn(2);
  const d = NAV_LEVEL && NAV_LEVEL !== 'windows' ? deptById(NAV_LEVEL) : null;
  let title, body;

  if (NAV_LEVEL === 'windows') {
    /* The third level. Collections are the Windows laptop framework, so this is
       the first point in the navigation where a shopper can meet them, and only
       when TP2 is live. With the framework off, the same route still exists and
       simply lists the assortment, which is what the control arm has to see. */
    title = `<button class="navback" onclick="navLevel('computers')"><i></i>Computers</button>
      <b class="navtitle">Windows laptops</b>`;
    body = `<button class="navrow navexplore" onclick="navPick(&quot;type&quot;,'Windows laptops')">
        <span class="navrowtx"><b>Shop all Windows laptops</b></span></button>
      ${showColl ? navCollSection() : ''}`;
  } else if (d) {
    const rows = deptRows(d.id);
    const isComputers = d.id === 'computers';
    title = `<button class="navback" onclick="navBack()"><i></i>Shop</button>
      <b class="navtitle">${esc(d.name)}</b>`;
    body = `<button class="navrow navexplore" onclick="${isComputers
        ? `navPick(&quot;type&quot;,'')` : `navGo('${d.route || ('#/d/' + d.id)}')`}">
        <span class="navrowtx"><b>Explore ${esc(d.name)}</b></span></button>
      ${rows.map(x => x.drill
        ? `<button class="navrow navdrill" onclick="navLevel('${x.drill}')">
            <span class="navrowtx">${esc(x.label)}</span>
            <i class="navrowchev"></i></button>`
        : `<button class="navrow" onclick="${x.act}">
            <span class="navrowtx">${esc(x.label)}</span></button>`).join('')}
      ${isComputers ? `<div class="navsechead">Help me decide</div>
        <button class="navrow" onclick="navGo('#/advisor')"><span class="navrowtx">Help me choose</span></button>
        <button class="navrow" onclick="navGo('#/compare')"><span class="navrowtx">Compare laptops</span></button>
        <button class="navrow" onclick="navGo('#/guide')"><span class="navrowtx">Buying guides</span></button>` : ''}
      <div class="navfoot">${esc(d.blurb)}</div>`;
  } else {
    title = `<b class="navtitle">Shop</b>`;
    body = `${DEPARTMENTS.map(x => `<button class="navrow navdrill" onclick="navLevel('${x.id}')">
        <span class="navrowico">${x.icon}</span>
        <span class="navrowtx">${esc(x.name)}</span>
        <i class="navrowchev"></i></button>`).join('')}
      <div class="navrule"></div>
      <button class="navrow" onclick="navGo('#/laptops')"><span class="navrowtx">Shop all laptops</span></button>
      <button class="navrow" onclick="navGo('#/advisor')"><span class="navrowtx">Help me choose</span></button>
      <button class="navrow" onclick="navGo('#/deals')"><span class="navrowtx">Deals</span></button>
      <button class="navrow" onclick="navGo('#/guide')"><span class="navrowtx">Buying guides</span></button>`;
  }

  return `<div class="navscrim" onclick="closeDrawer()"></div>
  <div class="navpanel" role="dialog" aria-label="Shop menu">
    <div class="navhead">${title}
      <button class="navx" onclick="closeDrawer()" aria-label="Close menu">&times;</button></div>
    <div class="navbody">${body}</div>
  </div>`;
}

/* Roadshow mode swaps the store identity, so the wordmark and the tab title
   have to follow the profile, not stay hard-coded to Novi. */
function paintBrand() {
  /* The console reuses the storefront chrome but must never show retail
     furniture. Guarded here as well as in CSS, because this runs on every
     profile change. */
  const rb = document.getElementById('ribbon');
  if (rb && !readOnlyTab() && typeof promoRibbon === 'function') rb.innerHTML = promoRibbon();
  const st = document.getElementById('shipto');
  if (st) st.innerHTML = 'Ship to ' + esc(BRAND.postcode || '98052') + ' &middot; '
    + esc(BRAND.market || 'US') + ' &middot; ' + esc(BRAND.currency || 'USD');
  const lg = document.getElementById('brandlogo');
  if (!lg) return;
  const nm = (BRAND.name || 'novi');
  lg.innerHTML = nm === 'novi' ? 'nov<i>i</i>' : esc(nm);
  document.title = nm + (readOnlyTab() ? ' | Intelligence console' : ' | Laptops, computers and tablets');
}

function paintMission() {
  const el = document.getElementById('missionbar');
  if (!el) return;
  const m = MISSIONS[S.mission];
  const on = S.mission && m;
  el.className = 'missionbar' + (on ? ' show' : '');
  el.innerHTML = on
    ? `<div class="wrap"><b>Your task</b> ${m.brief}${SUCCESS_FIRED ? '<span class="donetag">Done</span>' : ''}</div>`
    : '';
}

/* ---------------- moderator bar ---------------- */
function paintMod() {
  const bar = document.getElementById('modbar');
  if (!bar) return;
  document.body.classList.toggle('hasmod', MOD);
  if (!MOD) { bar.innerHTML = ''; bar.classList.remove('show'); return; }
  bar.classList.add('show');
  bar.innerHTML = `
    <b style="color:#7ee787;letter-spacing:.5px">MODERATOR</b>
    <label>Participant <input value="${esc(S.participantId || '')}" placeholder="P001" style="width:74px"
      onchange="setParticipant(this.value)"></label>
    <label>Condition <select onchange="setCondition(this.value)">
      ${Object.keys(CONDITIONS).map(k => `<option value="${k}" ${S.condition === k ? 'selected' : ''}>${CONDITIONS[k].label}</option>`).join('')}
    </select></label>
    <label>Task <select onchange="setMission(this.value)">
      ${Object.keys(MISSIONS).map(k => `<option value="${k}" ${String(S.mission) === k ? 'selected' : ''}>${MISSIONS[k].label}</option>`).join('')}
    </select></label>
    <label>Density <select onchange="setDensity(this.value)">
      <option value="busy" ${density() === 'busy' ? 'selected' : ''}>Busy (retail)</option>
      <option value="clean" ${density() === 'clean' ? 'selected' : ''}>Clean</option>
    </select></label>
    <label>Collection art <select onchange="setArtMode(this.value)">
      ${['wall', 'icon', 'both'].map(k => `<option value="${k}" ${artMode() === k ? 'selected' : ''}>${ART_LABEL[k]}</option>`).join('')}
    </select></label>
    <span>${SUCCESS_FIRED ? '<b style="color:#7ee787">TASK COMPLETE</b>' : 'in progress'} &middot; ${EVENTS.length} events &middot; ${elapsed()}</span>
    <span class="sp">
      <button onclick="bookmark()">Flag moment</button>
      <button class="gh" onclick="softReset()">Reset journey</button>
      <button class="gh" onclick="openConsole()">Console</button>
      <button class="gh" onclick="MOD=false;paintMod()">Hide</button>
    </span>`;
  /* The bar wraps on narrow screens, so a fixed 38px offset left it covering
     the header and the hamburger with it. Measure instead of assuming. */
  syncModOffset();
}
function syncModOffset() {
  const bar = document.getElementById('modbar');
  if (bar) {
    const h = (MOD && bar.classList.contains('show')) ? Math.ceil(bar.getBoundingClientRect().height) : 0;
    document.documentElement.style.setProperty('--modh', h + 'px');
  }
  /* The Shop panel hangs off the bottom of the nav band, and the band moves
     whenever the moderator bar wraps, so the anchor is measured not assumed. */
  const nav = document.querySelector('.mainnav');
  if (nav) {
    document.documentElement.style.setProperty('--navtop',
      Math.round(nav.getBoundingClientRect().bottom + 6) + 'px');
  }
}
function elapsed() {
  const s = Math.floor((Date.now() - S.startedAt) / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

/* The research console lives in app-console.js. viewConsole, paintConsole,
   paintLog, stat and condSummary are defined there. */

/* In the moderator build the console is a route on this page. In the
   participant build the code is not here at all, so open the separate console
   entry point instead: a second tab on the same origin, sharing localStorage,
   which is what makes the live two-screen setup work without a server. */
function openConsole() {
  if (typeof viewConsole === 'function') { go('#/research'); return; }
  const qs = location.search || '';
  window.open('console.html' + qs + '#/research', 'novi-console');
}


/* ---------------- toast and modal ---------------- */
let _toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => t.classList.remove('show'), 2300);
}
function openModal(html, size) {
  const box = document.getElementById('mbox');
  box.className = 'modal' + (size === 'sm' ? ' sm' : '');
  box.innerHTML = html;
  document.getElementById('back').classList.add('open');
}
function closeModal() { document.getElementById('back').classList.remove('open'); }

/* ---------------- consent ---------------- */
function showConsent() {
  openModal(`<h2 class="h2">Before we begin</h2>
    <p class="sub" style="margin:12px 0">You are about to use a prototype shopping website built for research.
    Novi is not a real retailer. The products are real models, but the prices, stock, delivery dates and
    customer reviews shown here are simulated. Nothing you do places a real order, and no payment is ever taken.</p>
    <p class="sub" style="margin-bottom:14px">We record what you click and how long you spend on each page.
    We do not collect your name, your email or any personal information. Your session is identified only
    by a code the moderator assigns. You can stop at any time.</p>
    <button class="btn pri lg" onclick="acceptConsent()">I understand, start</button>`, 'sm');
}
function acceptConsent() { S.consented = true; save(); track('consent_given'); closeModal(); }

/* ---------------- boot ---------------- */
function boot() {
  document.body.innerHTML = shell();

  const qs = new URLSearchParams(location.search);
  const had = restore();

  if (qs.get('mod') === '1') MOD = true;
  if (qs.get('cond') && CONDITIONS[qs.get('cond')]) setCondition(qs.get('cond'), true);
  if (qs.get('mission') && MISSIONS[qs.get('mission')]) setMission(qs.get('mission'), true);
  if (qs.get('pid')) {
    /* A new participant ID in the link means a new participant. Inheriting the
       previous session's clock and event stream would corrupt the headline
       path-to-laptop metric and attribute one person's clicks to another.
       Only the participant's own tab may do this. */
    const incoming = qs.get('pid');
    if (!readOnlyTab() && had && S.participantId && S.participantId !== incoming) {
      const keepCond = S.condition, keepMission = S.mission;
      archiveSession('participant_changed');
      EVENTS = []; CLICKS = []; S = DEFAULT_SESSION();
      try { localStorage.removeItem(LS_C); } catch (e) {}
      PATH = { steps: 0, firstLaptopMs: null, firstLaptopSteps: null, hijacks: 0 };
      S.condition = keepCond; S.mission = keepMission;
      SUCCESS_FIRED = false; ASSIST_MSGS = [];
    }
    S.participantId = incoming; save();
  }
  if (qs.get('density') === 'clean' || qs.get('density') === 'busy') { S.density = qs.get('density'); save(); }
  if (/^(icon|wall|both)$/.test(qs.get('art') || '')) setArtMode(qs.get('art'), true);

  window.addEventListener('hashchange', render);
  window.addEventListener('scroll', scrollWatch, { passive: true });
  window.addEventListener('beforeunload', leaveRoute);
  /* Capture phase, so a click is recorded even when a handler stops propagation.
     The research console is excluded: moderator clicks are not participant data. */
  document.addEventListener('click', e => {
    if (!/^#\/research/.test(location.hash || '')) captureClick(e);
  }, true);
  document.addEventListener('click', e => { if (!e.target.closest('.searchbox')) closeAC(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeAC(); closeDrawer(); }
    if (e.altKey && e.shiftKey && /^m$/i.test(e.key)) { MOD = !MOD; paintMod(); }
    if (e.altKey && e.shiftKey && /^r$/i.test(e.key)) softReset();
  });
  window.addEventListener('resize', syncModOffset, { passive: true });
  document.getElementById('back').addEventListener('click', e => { if (e.target.id === 'back') closeModal(); });

  if (!location.hash) location.hash = typeof CONSOLE_ONLY !== 'undefined' && CONSOLE_ONLY ? '#/research' : '#/';
  render();
  startSync();
  if (!had) track('session_started', 'condition=' + S.condition);
  if (qs.get('consent') === '1' && !S.consented) showConsent();
  setInterval(() => { if (MOD) paintMod(); }, 5000);
}
document.addEventListener('DOMContentLoaded', boot);

</script>
