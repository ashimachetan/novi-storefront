    ? '3x Thunderbolt 4 (USB-C), HDMI, SDXC, MagSafe 3, 3.5 mm'
    : '2x Thunderbolt 4 (USB-C), MagSafe 3, 3.5 mm';
  if (m.tr >= 4) return '2x USB-C (Thunderbolt 4), 1x USB-A, HDMI 2.1, 3.5 mm combo';
  if (m.os === 'ChromeOS') return '2x USB-C, 1x USB-A, microSD, 3.5 mm combo';
  return '1x USB-C, 2x USB-A, HDMI 1.4, SD card reader, 3.5 mm combo';
}

function build() {
  const items = [];
  let id = 1;

  for (const m of MODELS) {
    const brand = BRANDS.find(b => b.name === m.b);
    const gaming = m.u.includes('Gaming');
    const ports = portsFor(m);
    const contentRichness = THIN_NAMES.indexOf(m.n) >= 0 ? 'thin' : 'rich';

    const tags = [];
    if (m.r >= 4.7) tags.push('Top rated');
    if (m.w) tags.push('Save $' + (m.w - m.p));
    if (m.p < 500) tags.push('Budget pick');
    if (m.cb === 'Qualcomm' || (m.cpu.indexOf('Ultra') >= 0 && m.cpu.indexOf('V') > 0) || m.cpu.indexOf('Ryzen AI') >= 0) tags.push('Copilot+ PC');
    if (m.rc > 4000) tags.push('Best seller');
    if (id % 11 === 0) tags.push('New');

    items.push({
      id,
      sku: 'NV-' + String(100000 + id * 137).slice(0, 6),
      model: (m.b.slice(0, 2).toUpperCase() + '-' + String(4100 + id * 7)),
      brand: m.b,
      name: m.n,
      family: m.f,
      type: m.ty,
      use: m.u,
      price: m.p,
      wasPrice: m.w || null,
      financing: Math.round(m.p / 12),
      rating: m.r,
      reviewCount: m.rc,
      stars: starDistribution(m.r, m.rc),
      reviews: makeReviews(m.r, m.ram, ports.indexOf('USB-A') >= 0),
      tags,
      sponsored: id % 9 === 0,
      contentRichness,
      os: m.os,
      cpu: m.cpu,
      cpuBrand: m.cb,
      gpu: m.gpu,
      ram: m.ram + ' GB',
      ramGb: m.ram,
      storage: m.st >= 1024 ? (m.st / 1024) + ' TB SSD' : m.st + ' GB SSD',
      storageGb: m.st,
      screenSize: m.sz,
      resolution: m.res,
      panel: m.pan,
      refresh: m.hz + ' Hz',
      touch: !!m.t,
      battery: m.bat + ' hours',
      weight: m.wt.toFixed(2) + ' lbs',
      weightLb: m.wt,
      dimensions: `${(m.sz * 0.85).toFixed(2)} x ${(m.sz * 0.6).toFixed(2)} x ${(0.55 + (gaming ? 0.45 : 0.1)).toFixed(2)} in`,
      ports,
      wifi: m.tr >= 4 ? 'Wi-Fi 7 (802.11be)' : 'Wi-Fi 6E (802.11ax)',
      webcam: m.tr >= 3 ? '1080p FHD with privacy shutter' : '720p HD',
      keyboard: m.tr >= 2 ? 'Backlit, full-size' : 'Full-size',
      warranty: m.os === 'Windows 11 Pro' ? '3-year limited business warranty' : '1-year limited warranty',
      color: m.col,
      releaseYear: m.tr >= 4 ? 2026 : 2025,
      stock: rnd() > 0.12 ? 'In stock' : 'Low stock',
      deliveryDays: between(1, 4),
      pickup: rnd() > 0.25,
      openBox: m.rc > 1500 ? Math.round(m.p * 0.86) - 1 : null,
      collection: collectionFor(m),
      hue: brand.hue + between(-8, 8)
    });
    id++;
  }
  return items;
}

const CATALOG = build();
if (typeof module !== 'undefined') module.exports = { CATALOG, BRANDS, USES, OS, TYPES, COLLECTIONS };

})();

function deptById(id) { return DEPARTMENTS.find(d => d.id === id); }
function storeById(id) { return STORE.find(p => p.id === id); }
function deptItems(id) { return STORE.filter(p => p.dept === id); }

/* Merchandising products get their own silhouettes, drawn to the real shape of
   the thing. A participant scanning a grid should never mistake a TV tile for
   a laptop tile, because in a real store they never would. */
function vizBox(p, cls) {
  return `<div class="viz ${cls || ''}">${productArt(p)}</div>`;
}

function storeCard(p) {
  const save = p.wasPrice ? `<span class="was">${money(p.wasPrice)}</span>` : '';
  const tags = (p.wasPrice ? ['Save ' + money(p.wasPrice - p.price)] : []).concat(p.tags);
  return `<article class="card prod" onclick="go('#/s/${p.id}')">
    ${vizBox(p)}

      <span class="brandline">${esc(p.brand)}</span>

function viewDept(id, slug) {
  const d = deptById(id);
  if (!d) return view404();
  const items = deptItems(id);
  const all = [...new Set(items.map(p => p.cat))];

  const cats = picked ? [picked] : all;
  const shown = picked ? items.filter(p => p.cat === picked) : items;
  track('department_viewed', picked ? id + '/' + slug : id);
  return `${crumbs(picked
      ? [['Home', '#/'], [d.name, '#/d/' + d.id], [picked, '#/d/' + d.id + '/' + slug]]

  <div class="sectionhead"><div><h1 class="h1">${esc(picked || d.name)}</h1>
    <p class="sub">${picked
      ? `Shop ${esc(picked)} in ${esc(d.name)}.`

    <div class="sectionhead"><h2 class="h2">${esc(c)}</h2></div>
    <div class="grid">${items.filter(p => p.cat === c).map(storeCard).join('')}</div>`).join('')}
  <div class="notecard">Brands and models in this department are real. Prices, ratings and

}

/* ---------------- merchandising-grade PDP ---------------- */
/* Deliberately thinner than the laptop PDP. It is a real page a shopper can
   land on and bounce from, not a research instrument. */
function viewStorePDP(id) {
  const p = storeById(id);

  const save = p.wasPrice ? `<span class="was">${money(p.wasPrice)}</span>
    <span class="tag">Save ${money(p.wasPrice - p.price)}</span>` : '';
  return `${crumbs([['Home', '#/'], [d.name, '#/d/' + d.id], [p.cat, '#/d/' + d.id], [p.name, '#']])}

    </div>

  <div class="sectionhead"><h2 class="h2">More in ${esc(p.cat)}</h2></div>

    .slice(0, 4).map(storeCard).join('')}</div>`;

/* Store-wide deals. Laptops compete with TVs and appliances for the same
   promotional attention, which is the realistic condition. */
function viewDeals() {
  const merchDeals = STORE.filter(p => p.wasPrice)
    .sort((a, b) => (b.wasPrice - b.price) - (a.wasPrice - a.price));
  const lapDeals = CATALOG.filter(p => p.wasPrice)
    .sort((a, b) => (b.wasPrice - b.price) - (a.wasPrice - a.price)).slice(0, 8);
  track('deals_viewed', merchDeals.length + lapDeals.length);
  const byDept = DEPARTMENTS.filter(d => d.id !== 'computers')
    .map(d => [d, merchDeals.filter(p => p.dept === d.id)]).filter(x => x[1].length);
  return `${crumbs([['Home', '#/'], ['Deals', '#/deals']])}
  <div class="sectionhead"><div><h1 class="h1">Deals</h1>
    <p class="sub">On promotion across the store.</p></div></div>
  <div class="sectionhead"><h2 class="h2">Computers &amp; Tablets</h2>
    <a class="seeall" onclick="go('#/laptops')">Shop all laptops</a></div>
  <div class="grid">${lapDeals.map(p => pcard(p)).join('')}</div>
  ${byDept.map(([d, items]) => `
    <div class="sectionhead"><h2 class="h2">${esc(d.name)}</h2>
      <a class="seeall" onclick="go('#/d/${d.id}')">Shop ${esc(d.name)}</a></div>
    <div class="grid">${items.map(storeCard).join('')}</div>`).join('')}`;
}

function addToCartStore(id) {
  const p = storeById(id);
  if (!p) return;
  const line = S.cart.find(l => l.id === id);
  if (line) line.qty++;
  else S.cart.push({ id: p.id, qty: 1, grade: 'merch', name: p.title, price: p.price });
  save(); track('add_to_cart', { id: p.id, grade: 'merch' });
  paintChrome(); toast('Added to cart');
}

/* Store-wide search. A shopper typing "pro" should see laptops competing with
   a PlayStation and an iPad, which is the whole point. */
/* Token matching, not whole-string, and it shares the storefront's tokenizer so
   "wireless headphones" and "laptop for school" behave the same on both sides
   of the store. Department and category are in the haystack so a shopper can
   type the aisle rather than the product. */
function searchStore(q) {
  const toks = searchTokens(q);
  if (!toks.length) return [];
  const scored = [];
  STORE.forEach(p => {
    /* The department name and blurb are part of the haystack so aisle language
       finds the aisle. The Watches category is literally titled "Watches", so
       "smart watch" matched nothing until the blurb, which says smartwatches,
       was included. A shopper should not have to guess a retailer's taxonomy.

       But the blurb is a weak signal: matching it pulls in the whole
       department. So it qualifies a product, it does not rank it. Title and
       category matches sort above blurb-only matches, which is the difference
       between "smart watch" returning watches and returning the phone aisle. */
    const d = DEPARTMENTS.find(x => x.id === p.dept);
    const near = (p.title + ' ' + p.cat + ' ' + p.brand).toLowerCase();
    const wide = (near + ' ' + (p.dept || '') + ' ' + (d ? d.name + ' ' + d.blurb : '')
      + ' ' + (p.tags || []).join(' ')).toLowerCase();
    if (!toks.every(x => wide.includes(x))) return;
    scored.push({ p, s: toks.filter(x => near.includes(x)).length });
  });
  return scored.sort((a, b) => b.s - a.s).map(x => x.p);
}


/* ===== photodata.js ===== */
/* Generated by fetchphotos.js. Stub until a Pexels key is supplied; with no
   pools the art engine falls back to the SVG renders. */
const PHOTOS = { laptops: {}, merch: {} };


/* ===== photos.js ===== */
/* Photography layer.

   A vector render can be lit well but it will never read as a photograph, so
   where real retail photography exists for a product's slot we use it and keep
   the SVG engine as the fallback. One photo is assigned per product,
   deterministically by hash, so a product always looks like itself. The four
   gallery angles are crops of that same photo rather than four different
   machines, which is what a real PDP does anyway. */

function photoPool(p) {
  if (typeof PHOTOS === 'undefined' || !p) return null;
  let pool;
  if (p.grade === 'merch') {
    pool = PHOTOS.merch[String(p.dept) + '/' + String(p.cat)];
  } else {
    const t = String(p.type || '');
    const k = /Gaming/i.test(t) ? 'lap-gaming'
      : /MacBook/i.test(t) ? 'lap-macbook'
      : /Chromebook/i.test(t) ? 'lap-chrome'
      : /2-in-1/i.test(t) ? 'lap-2in1'
      : /Business/i.test(t) ? 'lap-business'
      : /Copilot/i.test(t) ? 'lap-copilot'
      : 'lap-windows';
    pool = PHOTOS.laptops[k];
    if (!pool || !pool.length) pool = PHOTOS.laptops['lap-windows'];
  }
  return (pool && pool.length) ? pool : null;
}

function hasPhoto(p) { return !!photoPool(p); }

/* v0 is the full shot. The rest are pushed in to read as detail crops. */
const PSHOTS = [
  [1.00, 50, 50],
  [1.70, 32, 62],
  [1.35, 70, 40],
  [2.10, 50, 72]
];

function photoArt(p, variant) {
  const pool = photoPool(p);
  if (!pool) return null;
  const i = Math.abs(hashOf(p)) % pool.length;
  const z = PSHOTS[(variant || 0) % PSHOTS.length];
  return `<div class="pshot"><img src="photos/${pool[i]}" alt="" loading="lazy"
    decoding="async" style="transform:scale(${z[0]});object-position:${z[1]}% ${z[2]}%"></div>`;
}


/* ===== art.js ===== */
/* ==========================================================================
   Product art engine

   Every product image in Novi is drawn as inline SVG at render time. There are
   no photographs and no image requests, which is what lets the whole instrument
   run offline from a single file and keeps the promise that nothing about a
   participant's session leaves their machine.

   It has to be convincing, though. A shopper who is deciding between a laptop
   and a TV is reading shape, finish and proportion long before they read the
   label, so a gradient rectangle would change the very behaviour we are trying
   to measure. These are drawn to the real silhouettes: chassis colour comes
   from the product's own colour name, screens carry a wallpaper and a specular
   sheen, and everything sits on a soft contact shadow.
   ========================================================================== */

/* ---- finishes ------------------------------------------------------------
   Retail chassis colours, keyed off the catalogue's colour string. Each is a
   light face, a darker edge for thickness, and a deck tone. */
const FINISHES = {
  silver:   { a: '#e8edf2', b: '#c3ced9', c: '#f2f5f8', edge: '#9dabb9', deck: '#dde4ec' },
  spacegray:{ a: '#9aa3ac', b: '#6f7881', c: '#adb5bd', edge: '#565e66', deck: '#8f989f' },
  graphite: { a: '#7c848c', b: '#565d64', c: '#8f979e', edge: '#3f4448', deck: '#6e767d' },
  black:    { a: '#3a4048', b: '#22262c', c: '#4b525b', edge: '#15181c', deck: '#2f343a' },
  white:    { a: '#f7f9fb', b: '#dfe5ec', c: '#ffffff', edge: '#c3ccd6', deck: '#eef2f6' },
  blue:     { a: '#4b6f9e', b: '#31506f', c: '#5d84b5', edge: '#23364a', deck: '#3f6087' },
  navy:     { a: '#2f4260', b: '#1d2b41', c: '#3d5679', edge: '#141d2c', deck: '#27374f' },
  gold:     { a: '#e4d2b6', b: '#c6b08e', c: '#f0e2ca', edge: '#a89070', deck: '#dccbb0' },
  rose:     { a: '#e3c3bd', b: '#c69d96', c: '#efd4cf', edge: '#a87f79', deck: '#dbb9b2' },
  green:    { a: '#4e7a63', b: '#345844', c: '#5f9077', edge: '#243d30', deck: '#436a55' },
  red:      { a: '#a8453f', b: '#802f2a', c: '#bd5750', edge: '#5c1f1b', deck: '#923832' }
};
function finish(p) {
  const c = String((p && p.color) || '').toLowerCase();
  if (/jet black|carbon|midnight|obsidian|black|iron|onyx/.test(c)) return FINISHES.black;
  if (/graphite|slate|storm|shadow/.test(c)) return FINISHES.graphite;
  if (/space|steel|gun|anthracite|grey|gray/.test(c)) return FINISHES.spacegray;
  if (/white|ceramic|glacier|porcelain|chalk/.test(c)) return FINISHES.white;
  if (/navy|abyss|deep blue/.test(c)) return FINISHES.navy;
  if (/blue|sapphire|cobalt|sky|ice/.test(c)) return FINISHES.blue;
  if (/gold|champagne|sand|bronze|beige/.test(c)) return FINISHES.gold;
  if (/rose|pink|blush|coral/.test(c)) return FINISHES.rose;
  if (/green|sage|forest|mint/.test(c)) return FINISHES.green;
  if (/red|crimson|garnet/.test(c)) return FINISHES.red;
  if (/silver|platinum|aluminium|aluminum|natural|mineral|cool|cloud|moon|luna|arctic/.test(c)) return FINISHES.silver;
  /* No colour on the record: fall back to something stable per product so a
     tile does not change finish between renders. */
  const keys = ['silver', 'spacegray', 'black', 'white', 'blue'];
  return FINISHES[keys[Math.abs(hashOf(p)) % keys.length]];
}
function hashOf(p) {
  const s = String((p && (p.sku || p.id || p.name)) || 'x');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return h;
}

/* Screen wallpaper. Tinted by the product's hue so a wall of tiles still has
   the colour variety a real storefront has, without the device itself turning
   into a swatch. */
function wall(p, id) {
  const h = (p && typeof p.hue === 'number') ? p.hue : 212;
  return `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="hsl(${h},76%,44%)"/>
    <stop offset=".48" stop-color="hsl(${(h + 22) % 360},72%,25%)"/>
    <stop offset="1" stop-color="hsl(${(h + 42) % 360},66%,13%)"/></linearGradient>`;
}
function uid(pre, p, v) { return pre + '_' + Math.abs(hashOf(p)).toString(36) + '_' + (v || 0); }

/* Shared defs. This is the lighting model for the whole catalogue: one key
   light from the upper left, a cool fill, a two-layer contact shadow and a
   glass reflection. Every device pulls from the same set, which is what makes
   a grid of 65 different products read as one photo shoot rather than clip
   art. */
function baseDefs(p, u) {
  const f = finish(p);
  return `<defs>
    ${wall(p, u + 'w')}
    <radialGradient id="${u}wglow" cx=".26" cy=".14" r=".92">
      <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
      <stop offset=".58" stop-color="#fff" stop-opacity=".02"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="${u}lid" x1=".06" y1="0" x2=".94" y2="1">
      <stop offset="0" stop-color="${f.c}"/>
      <stop offset=".32" stop-color="${f.a}"/>
      <stop offset=".76" stop-color="${f.b}"/>
      <stop offset="1" stop-color="${f.edge}"/></linearGradient>
    <linearGradient id="${u}deck" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="${f.b}"/>
      <stop offset=".16" stop-color="${f.deck}"/>
      <stop offset=".82" stop-color="${f.a}"/>
      <stop offset="1" stop-color="${f.c}"/></linearGradient>
    <linearGradient id="${u}rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="${u}glass" x1="-.05" y1="-.1" x2=".85" y2="1.05">
      <stop offset="0" stop-color="#fff" stop-opacity=".24"/>
      <stop offset=".28" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".29" stop-color="#fff" stop-opacity=".015"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="${u}sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset=".40" stop-color="#fff" stop-opacity=".05"/>
      <stop offset=".41" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="${u}key" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#000" stop-opacity=".24"/></linearGradient>
    <radialGradient id="${u}sh" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#16243a" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#16243a" stop-opacity=".11"/>
      <stop offset="1" stop-color="#16243a" stop-opacity="0"/></radialGradient>
    <radialGradient id="${u}core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0c1726" stop-opacity=".42"/>
      <stop offset=".7" stop-color="#0c1726" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0c1726" stop-opacity="0"/></radialGradient>
    <linearGradient id="${u}decklight" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".34"/>
      <stop offset=".26" stop-color="#000" stop-opacity=".10"/>
      <stop offset=".62" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".46"/></linearGradient>
    <radialGradient id="${u}stage" cx=".5" cy=".44" r=".62">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>`;
}
/* Two layers: a wide ambient pool and a tight dark core where the product
   meets the surface. A single ellipse always reads as a sticker. */
function shadow(cx, cy, rx, ry, u) {
  return `<ellipse cx="${cx}" cy="${cy + 2}" rx="${rx}" ry="${ry}" fill="url(#${u}sh)"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${(rx * 0.6).toFixed(1)}" ry="${(ry * 0.55).toFixed(1)}" fill="url(#${u}core)"/>`;
}
/* A soft light pool behind the product so it sits in a lightbox. */
function stage(u) {
  return `<ellipse cx="160" cy="104" rx="152" ry="98" fill="url(#${u}stage)"/>`;
}
function svg(inner, vb) {
  return `<svg class="pa" viewBox="${vb || '0 0 320 220'}" preserveAspectRatio="xMidYMid meet"
    role="img" aria-hidden="true" focusable="false">${inner}</svg>`;
}

/* ---- laptops -------------------------------------------------------------
   Front elevation with a foreshortened deck, which is how laptops are actually
   shot for retail: you read the screen straight on and the keyboard in
   perspective. */
function artLaptop(p, v) {
  const f = finish(p), u = uid('lp', p, v);
  const gaming = /Gaming/i.test(p.type || '');
  const mac = /MacBook/i.test(p.type || '') || /Apple/i.test(p.brand || '');
  const h = (p && typeof p.hue === 'number') ? p.hue : 212;

  if (v === 1) return artLaptopProfile(p);
  if (v === 2) return artLaptopClosed(p);
  if (v === 3) return artLaptopPorts(p);

  /* Keyboard in perspective. Each row forward is wider and catches more light.
     Two passes per cap, a solid body then a gradient, so the caps read as
     moulded plastic rather than flat tiles. */
  const keys = [];
  const ROWS = 4;
  for (let r = 0; r < ROWS; r++) {
    const w = 96 + r * 7.4;
    const x0 = 160 - w / 2;
    const y = 159 + r * 5.2;
    const cw = w / 14;
    for (let c = 0; c < 14; c++) {
      const x = x0 + c * cw;
      const kw = (cw - 1.15).toFixed(2);
      keys.push(`<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${kw}" height="4.1" rx=".9" fill="#20262d" opacity="${(0.72 + r * 0.045).toFixed(2)}"/>`);
      keys.push(`<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${kw}" height="1.3" rx=".65" fill="#fff" opacity="${(0.16 + r * 0.03).toFixed(2)}"/>`);
    }
  }

  const gr = [];
  for (let side = 0; side < 2; side++) {
    for (let r = 0; r < 4; r++) {
      const w = 96 + r * 7.4, y = 159.4 + r * 5.2;
      const x = side ? 160 + w / 2 + 3 : 160 - w / 2 - 3;
      for (let c = 0; c < 3; c++) {
        const cx = x + (side ? c * 3.1 : -c * 3.1);
        gr.push(`<circle cx="${cx.toFixed(2)}" cy="${(y + 1.8).toFixed(2)}" r=".82" fill="#0b1119" opacity=".26"/>`);
      }
    }
  }
  const grilles = gr.join('');

  return svg(`${baseDefs(p, u)}
    ${stage(u)}
    ${shadow(160, 194, 126, 11, u)}

    <!-- display assembly: chassis edge, a thin metal frame, then a black bezel -->
    <rect x="57" y="21" width="206" height="132" rx="8" fill="${f.edge}"/>
    <rect x="58.4" y="22.4" width="203.2" height="129.2" rx="7.2" fill="url(#${u}lid)"/>
    <rect x="62" y="22.6" width="196" height="1.7" rx=".85" fill="url(#${u}rim)" opacity=".7"/>
    <rect x="61.5" y="25.5" width="197" height="122" rx="4" fill="#070b12"/>
    <rect x="62.1" y="26.1" width="195.8" height="120.8" rx="3.6" fill="none" stroke="#fff" stroke-opacity=".10"/>

    <!-- the panel itself: dark desktop, one bright window, real contrast -->
    <rect x="64.5" y="31" width="191" height="111" rx="1.8" fill="#0d1422"/>
    <rect x="64.5" y="31" width="191" height="111" rx="1.8" fill="url(#${u}w)"/>
    <rect x="64.5" y="31" width="191" height="111" rx="1.8" fill="url(#${u}wglow)"/>

    <!-- an application window, light on dark, which is what sells "switched on" -->
    <rect x="86" y="47" width="148" height="72" rx="4" fill="#0a1220" opacity=".45"/>
    <rect x="84" y="45" width="148" height="72" rx="4" fill="#f4f7fb"/>
    <rect x="84" y="45" width="148" height="11" rx="4" fill="#e2e9f2"/>
    <rect x="84" y="52" width="148" height="4" fill="#e2e9f2"/>
    ${[0, 1, 2].map(i => `<circle cx="${90 + i * 5.6}" cy="50.5" r="1.6" fill="${['#f0776a', '#f4bf5f', '#66c98a'][i] || '#ccd'}"/>`).join('')}
    <rect x="108" y="48" width="70" height="5" rx="2.5" fill="#ffffff"/>
    <rect x="110" y="49.4" width="34" height="2.2" rx="1.1" fill="#b6c4d4"/>
    <rect x="92" y="63" width="52" height="34" rx="3" fill="hsl(${h},62%,54%)" opacity=".85"/>
    <rect x="92" y="63" width="52" height="34" rx="3" fill="url(#${u}rim)" opacity=".28"/>
    <rect x="151" y="63" width="72" height="4.6" rx="2.3" fill="#8b9bb0"/>
    <rect x="151" y="72" width="58" height="4" rx="2" fill="#b9c6d6"/>
    <rect x="151" y="80" width="66" height="4" rx="2" fill="#c8d4e2"/>
    <rect x="151" y="88" width="40" height="4" rx="2" fill="#d5dfea"/>
    <rect x="92" y="103" width="44" height="8" rx="4" fill="hsl(${h},68%,48%)"/>
    <rect x="143" y="103" width="34" height="8" rx="4" fill="#dfe7f0"/>

    <!-- taskbar -->
    <rect x="64.5" y="128" width="191" height="14" fill="#060b14" opacity=".55"/>
    ${[0, 1, 2, 3, 4, 5, 6].map(i => `<rect x="${118 + i * 12}" y="131" width="8" height="8" rx="2" fill="#fff" opacity=".${i < 3 ? 60 : 32}"/>`).join('')}

    <!-- glass sweep and the camera in the top bezel -->
    <rect x="64.5" y="31" width="191" height="111" rx="1.8" fill="url(#${u}glass)"/>
    <circle cx="160" cy="28.2" r="1.3" fill="#161d28"/>
    <circle cx="160" cy="28.2" r=".5" fill="#54677e"/>

    <!-- hinge: a recessed bar plus the shadow the lid throws on the deck -->
    <rect x="120" y="151" width="80" height="3.4" rx="1.2" fill="${f.edge}"/>
    <rect x="120" y="151" width="80" height="1.2" rx=".6" fill="#000" opacity=".35"/>
    <path d="M57 153 L263 153 L266 157 L54 157 Z" fill="#0b1119" opacity=".16"/>

function artLaptopPorts(p) {
  const f = finish(p), u = uid('lpp', p, 3);

  if (/usb-c|thunderbolt/.test(ports)) set.push(['USB-C', 22, 7]);
  if (/usb-a/.test(ports)) set.push(['USB-A', 30, 9]);
  if (/hdmi/.test(ports)) set.push(['HDMI', 34, 10]);
  if (/sd card/.test(ports)) set.push(['SD', 26, 6]);
  if (/3\.5/.test(ports)) set.push(['Audio', 12, 12]);
  const row = set.length ? set : [['USB-C', 22, 7], ['USB-A', 30, 9]];
  let x = 160 - row.reduce((s, r) => s + r[1] + 16, -16) / 2;
  const drawn = row.map(r => {
    const y = 104 - r[2] / 2;

    x += r[1] + 16;
    return g;
  }).join('');

/* ===== art3d.js ===== */
/* Three-quarter product renders.

   A dead-on frontal drawing reads as illustration no matter how well it is
   lit, because real product photography is never perfectly symmetric. So the
   laptop is defined once in 3D and projected through a camera. That buys
   correct perspective on the keyboard, a consistent silhouette, and four
   genuine angles of the same machine for the gallery rather than four
   different drawings. */

const CAM = {
  front:   { ry: 0.195, rx: 0.235, scale: 0.62, ox: 160, oy: 150, dist: 2900 },
  profile: { ry: 1.02, rx: 0.20, scale: 0.60, ox: 160, oy: 150, dist: 2900 },
  closed:  { ry: 0.44, rx: 0.56, scale: 0.78, ox: 160, oy: 132, dist: 2900 },
  back:    { ry: 3.42, rx: 0.30, scale: 0.62, ox: 160, oy: 150, dist: 2900 }
};

function proj3(pt, c) {
  const x = pt[0], y = pt[1], z = pt[2];
  const cy = Math.cos(c.ry), sy = Math.sin(c.ry);
  const X = x * cy + z * sy;
  const Z1 = -x * sy + z * cy;
  const cx = Math.cos(c.rx), sx = Math.sin(c.rx);
  const Y = y * cx - Z1 * sx;
  const Z2 = y * sx + Z1 * cx;
  const s = c.dist / (c.dist - Z2);
  return [c.ox + X * s * c.scale, c.oy - Y * s * c.scale, Z2];
}

function poly(pts, attrs) {
  return `<polygon points="${pts.map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ')}" ${attrs}/>`;
}

/* Maps a flat w x h drawing onto a projected quad. With a camera this gentle
   the quad is close enough to a parallelogram that an affine fit from three
   corners is indistinguishable from a true projective map, and it lets the
   keyboard and the screen UI be drawn in plain 2D. */
function quadXform(o, u, v, w, h) {
  const a = (u[0] - o[0]) / w, b = (u[1] - o[1]) / w;
  const c = (v[0] - o[0]) / h, d = (v[1] - o[1]) / h;
  return `matrix(${a.toFixed(5)},${b.toFixed(5)},${c.toFixed(5)},${d.toFixed(5)},${o[0].toFixed(3)},${o[1].toFixed(3)})`;
}

/* A Windows-style bloom: petals of light radiating from a bright core. Drawn
   in screen-local units and blurred, which is what stops it reading as a set
   of hard vector shapes. */
function bloom(u, h) {
  const petals = [];
  for (let i = 0; i < 16; i++) {
    const ang = i * 22.5 + (i % 3) * 7;
    /* narrow band: cyan through blue to violet, with two warm accents */
    const hue = (i === 4 || i === 11) ? (h + 104) % 360 : (h - 66 + (i % 6) * 26 + 360) % 360;
    const dist = 8 + (i % 4) * 4.2;
    const rx = 19 + (i % 5) * 6, ry = 5.5 + (i % 3) * 3.2;
    const cx = 50 + Math.cos(ang * Math.PI / 180) * dist;
    const cy = 31 + Math.sin(ang * Math.PI / 180) * dist * 0.72;
    const op = (0.26 + (i % 4) * 0.08).toFixed(2);
    petals.push(`<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx}" ry="${ry}"
      fill="hsl(${hue},90%,${52 + (i % 3) * 8}%)" opacity="${op}"
      transform="rotate(${ang.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})"/>`);

/* ---- session state ------------------------------------------------------ */

  condition: 'B',
  mission: 0,
  startedAt: Date.now(),

  sort: 'rec',
  page: 1,
  query: '',
  bookmarks: [],
  /* Which RISE touchpoint first sent this shopper into a collection, and which
     one did it most recently. Attribution has to be on the session, not just in
     the event log, so the console can segment a journey by its entry point. */
  firstCollTp: null,
  lastCollTp: null,

     photography or a distinct graphic mark is an open question rather than a
     style setting, so it is a study variable and rides on every event. */

     participant's storefront from the other screen. */

});

let CURRENT_PROFILE = 'novi';
let S = DEFAULT_SESSION();
let EVENTS = [];
let MOD = false;          // moderator bar visible
let ASSIST_OPEN = false;

const LS_S = 'novi.session.v2';
const LS_E = 'novi.events.v2';
const LS_A = 'novi.archive.v1';
/* v3: conditions gained the RISE touchpoint list, replacing a single boolean.
   Bumping the key retires flags saved by an older build rather than letting a
   stale `collections: true` quietly overwrite a tp array. */
const LS_F = 'novi.flags.v3';

/* Conditions are edited live in the Designer, so they have to persist and
   sync like any other state. Otherwise a condition changed on the moderator's
   screen would never reach the participant's. */
function saveFlags() {
  try { localStorage.setItem(LS_F, JSON.stringify(CONDITIONS)); } catch (e) {}
}
function loadFlags() {
  try {
    const f = localStorage.getItem(LS_F);
    if (!f) return;
    const saved = JSON.parse(f);
    Object.keys(saved).forEach(k => { CONDITIONS[k] = saved[k]; });
  } catch (e) {}
}

/* ---- session archive ----------------------------------------------------
   A research instrument that overwrites the last participant is not a research
   instrument. Every completed session is archived before the slate is cleared,
   so a roadshow can run five partners back to back and still have all five to
   compare afterwards. Nothing leaves the machine.
------------------------------------------------------------------------- */
const MAX_ARCHIVE = 40;
let ARCHIVE = [];

function loadArchive() {
  try { ARCHIVE = JSON.parse(localStorage.getItem(LS_A)) || []; }
  catch (e) { ARCHIVE = []; }
  return ARCHIVE;
}
function saveArchive() {
  /* localStorage is finite. Trim oldest first, and if a write still fails,
     drop the heaviest payloads rather than losing the whole archive. */
  try {
    localStorage.setItem(LS_A, JSON.stringify(ARCHIVE.slice(-MAX_ARCHIVE)));
  } catch (e) {
    try {
      ARCHIVE = ARCHIVE.slice(-10).map(a =>
        Object.assign({}, a, { clicks: (a.clicks || []).slice(-400) }));
      localStorage.setItem(LS_A, JSON.stringify(ARCHIVE));
    } catch (e2) { /* archive stays in memory for this tab */ }
  }
}
function archiveSession(reason) {
  if (!EVENTS.length) return null;
  loadArchive();
  const rec = {
    archiveId: 'AR-' + Date.now().toString(36).toUpperCase(),
    sessionId: S.sessionId,
    participantId: S.participantId || '(unnamed)',
    condition: S.condition,
    conditionLabel: (CONDITIONS[S.condition] || {}).label || S.condition,
    mission: S.mission,
    missionLabel: (MISSIONS[S.mission] || {}).label || 'Free exploration',
    density: density(),
    brand: BRAND.name,
    startedAt: S.startedAt,
    endedAt: Date.now(),
    reason: reason || 'manual',
    checkoutComplete: !!S.checkoutComplete,
    maxCompared: S.maxCompared || 0,
    path: JSON.parse(JSON.stringify(PATH)),
    events: EVENTS.slice(-1500),
    clicks: CLICKS.slice(-1200)
  };
  ARCHIVE.push(rec);
  saveArchive();
  return rec;
}
function deleteArchived(id) {
  loadArchive();
  ARCHIVE = ARCHIVE.filter(a => a.archiveId !== id);
  saveArchive();
}
function clearArchive() {
  ARCHIVE = [];
  try { localStorage.removeItem(LS_A); } catch (e) {}
}

function cond() { return CONDITIONS[S.condition] || CONDITIONS.B; }
/* Visual density is a research variable in its own right, orthogonal to the
   lettered conditions, so a moderator can strip the retail noise mid-session
   and see whether guidance still lands. */
function density() { return S.density || cond().density || 'busy'; }
function setDensity(d) {
  S.density = d; save();
  track('density_changed', { density: d });
  render();
  toast(d === 'busy' ? 'Retail density on' : 'Retail density off');
}
function P(id) { return CATALOG.find(p => p.id === id); }
function money(n) { return BRAND.symbol + n.toLocaleString('en-US'); }

/* ---- persistence --------------------------------------------------------
   The moderator console is an observer. It reads the participant's session and
   must never write it back, or the two tabs would overwrite each other and the
   moderator's own navigation would land in the participant's event stream.
   Designer flag edits are the one exception, and they use their own key.
------------------------------------------------------------------------- */
function readOnlyTab() { return typeof CONSOLE_ONLY !== 'undefined' && CONSOLE_ONLY; }
function save() {
  if (readOnlyTab()) return;
  try {
    localStorage.setItem(LS_S, JSON.stringify(S));
    localStorage.setItem(LS_E, JSON.stringify(EVENTS.slice(-4000)));
  } catch (e) { /* storage full or blocked; session continues in memory */ }
}
function restore() {
  try {
    const s = localStorage.getItem(LS_S), e = localStorage.getItem(LS_E), c = localStorage.getItem(LS_C);
    if (c) CLICKS = JSON.parse(c) || [];
    if (s) {
      const saved = JSON.parse(s);
      S = Object.assign(DEFAULT_SESSION(), saved);
      /* backfill any filter keys added since the session was saved, so a
         participant mid-study never hits a broken build */
      S.filters = Object.assign(DEFAULT_SESSION().filters, saved.filters || {});
    }
    if (e) EVENTS = JSON.parse(e);
    loadArchive();
    loadFlags();
    /* The profile has to be applied before the first paint, or a reloaded tab
       flashes the default brand before catching up on the next sync. */
    if (S.profile && S.profile !== 'novi') { CURRENT_PROFILE = S.profile; paintRoadshow(S.profile); }
    return !!s;
  } catch (err) { return false; }
}

/* ---- cross-tab sync -----------------------------------------------------
   Two tabs on the same origin share localStorage, and the storage event fires
   in the OTHER tab, never the one that wrote. That gives a live moderator
   console on a second screen with no server: the participant shops, the
   console repaints as their events land, and a condition changed in the
   console reaches the participant's store immediately.

   syncFromStorage must never call save(), or two tabs would write to each
   other in a loop.
------------------------------------------------------------------------- */
let SYNC_ON = true;
let LAST_SYNC = 0;
function syncFromStorage(key) {
  if (!SYNC_ON) return;
  try {
    if (key === LS_E || key === null) {
      const e = localStorage.getItem(LS_E);
      if (e) EVENTS = JSON.parse(e) || [];
    }
    if (key === LS_C || key === null) {
      const c = localStorage.getItem(LS_C);
      if (c) CLICKS = JSON.parse(c) || [];
    }
    if (key === LS_A || key === null) loadArchive();
    if (key === LS_F || key === null) loadFlags();
    if (key === LS_S || key === null) {
      const s = localStorage.getItem(LS_S);
      if (s) {
        const saved = JSON.parse(s);
        S = Object.assign(DEFAULT_SESSION(), saved);
        S.filters = Object.assign(DEFAULT_SESSION().filters, saved.filters || {});
      }
    }
  } catch (err) { return; }
  LAST_SYNC = Date.now();
  applySyncedProfile();
  onSynced();
}
/* Each entry point decides what to repaint. Debounced, because a participant
   clicking quickly would otherwise repaint the console on every event and steal
   focus from whatever the moderator is typing. */
let SYNC_TIMER = null;
function onSynced() {
  clearTimeout(SYNC_TIMER);
  SYNC_TIMER = setTimeout(() => {
    if (readOnlyTab()) {
      const a = document.activeElement;
      if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;
      if (typeof paintConsole === 'function') paintConsole();
      return;
    }
    render();
  }, 300);
}
/* The reskin has to repaint immediately rather than on the debounced render,
   because the whole point on stage is that the store changes while the audience
   is looking at it. Applied in both tabs so the moderator's preview matches
   what the participant screen is showing. */
function applySyncedProfile() {
  if (S.profile && S.profile !== CURRENT_PROFILE) {
    CURRENT_PROFILE = S.profile;
    paintRoadshow(S.profile);
  }
}
function startSync() {
  window.addEventListener('storage', ev => {
    if (!ev.key || ev.key.indexOf('novi.') !== 0) return;
    syncFromStorage(ev.key);
  });
}

/* ---- instrumentation ---------------------------------------------------- */
function track(name, detail) {
  if (readOnlyTab()) return;
  const now = Date.now();
  const ev = {
    ts: new Date(now).toISOString(),
    msSinceSession: now - S.startedAt,
    msSinceTask: now - S.taskStartedAt,
    sessionId: S.sessionId,
    participantId: S.participantId || 'unassigned',
    condition: S.condition,
    conditionLabel: cond().label,
    art: (typeof artMode === 'function') ? artMode() : 'wall',
    artLabel: (typeof artMode === 'function' && typeof ART_LABEL === 'object')
      ? (ART_LABEL[artMode()] || '') : '',
    density: density(),
    mission: S.mission,
    missionLabel: MISSIONS[S.mission].label,
    route: location.hash || '#/',
    event: name,
    detail: detail === undefined ? '' : (typeof detail === 'object' ? JSON.stringify(detail) : String(detail))
  };
  EVENTS.push(ev);
  save();
  if (typeof paintLog === 'function') paintLog();
  checkSuccess();
}

/* success is evaluated continuously, so time-to-success is real */
let SUCCESS_FIRED = false;
function checkSuccess() {
  if (SUCCESS_FIRED || !MISSIONS[S.mission]) return;
  let ok = false;
  try { ok = MISSIONS[S.mission].success(S); } catch (e) { ok = false; }
  if (ok) {
    SUCCESS_FIRED = true;
    const ms = Date.now() - S.taskStartedAt;
    EVENTS.push({
      ts: new Date().toISOString(), msSinceSession: Date.now() - S.startedAt, msSinceTask: ms,
      sessionId: S.sessionId, participantId: S.participantId || 'unassigned',
      condition: S.condition, conditionLabel: cond().label,
      mission: S.mission, missionLabel: MISSIONS[S.mission].label,
      route: location.hash || '#/', event: 'task_success', detail: 'ms=' + ms
    });
    save(); if (typeof paintLog === 'function') paintLog(); paintMod();
  }
}

/* scroll depth + dwell, sampled per route */
let _routeEnter = Date.now(), _maxScroll = 0, _lastRoute = '';
function scrollWatch() {
  const h = document.documentElement;
  const d = h.scrollHeight - h.clientHeight;
  const pct = d > 0 ? Math.round((h.scrollTop / d) * 100) : 0;
  if (pct > _maxScroll) _maxScroll = pct;
}
function leaveRoute() {
  if (!_lastRoute) return;
  track('page_exit', { route: _lastRoute, dwellMs: Date.now() - _routeEnter, maxScrollPct: _maxScroll });
}

/* ---- heatmap capture ----------------------------------------------------- */
/* Every click is stored as a viewport-relative percentage plus the element it hit,
   so the overlay reproduces faithfully at any window size and survives export.
   Percentages rather than pixels is the whole trick: a 1440px moderator screen and
   a 1080px participant screen produce comparable maps. */
let CLICKS = [];
const LS_C = 'novi.clicks.v1';
const MAX_CLICKS = 4000;

function clickLabel(t) {
  if (!t || !t.tagName) return 'page';
  const el = t.closest('[data-hm]') || t;
  if (el.dataset && el.dataset.hm) return el.dataset.hm;
  const b = el.closest('button, a, .card, .prod, .asstcard, .thumb, input, select');
  if (!b) return el.tagName.toLowerCase();
  const txt = (b.getAttribute('aria-label') || b.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40);
  return (b.tagName.toLowerCase() + (txt ? ':' + txt : ''));
}

function captureClick(e) {
  if (readOnlyTab()) return;
  const vw = window.innerWidth || 1, vh = window.innerHeight || 1;
  const docH = Math.max(document.documentElement.scrollHeight, 1);
  CLICKS.push({
    ts: Date.now(),
    route: location.hash || '#/',
    condition: S.condition,
    density: density(),
    participantId: S.participantId || 'unassigned',
    sessionId: S.sessionId,
    xPct: +((e.clientX / vw) * 100).toFixed(2),
    yPct: +((e.clientY / vh) * 100).toFixed(2),
    pageYPct: +(((e.pageY) / docH) * 100).toFixed(2),
    label: clickLabel(e.target)
  });
  if (CLICKS.length > MAX_CLICKS) CLICKS = CLICKS.slice(-MAX_CLICKS);
  try { localStorage.setItem(LS_C, JSON.stringify(CLICKS.slice(-MAX_CLICKS))); } catch (err) {}
}

/* ---- path to laptops: the headline metric -------------------------------- */
/* In a full-line store a laptop has to be found. This records how many navigation
   steps and how many milliseconds it took to reach the first laptop PDP, which is
   the number that says whether the merchandising is working. */
let PATH = { steps: 0, firstLaptopMs: null, firstLaptopSteps: null, hijacks: 0 };

function notePathStep(hash) {
  PATH.steps++;
  if (PATH.firstLaptopMs === null && /^#\/product\//.test(hash)) {
    const id = parseInt(hash.split('/')[2], 10);
    const p = P(id);
    if (p) {
      PATH.firstLaptopMs = Date.now() - S.taskStartedAt;
      PATH.firstLaptopSteps = PATH.steps;
      track('path_to_laptops', { ms: PATH.firstLaptopMs, steps: PATH.firstLaptopSteps });
    }
  }
}

/* ---- export ------------------------------------------------------------- */
function exportJSON() {
  const payload = {
    exportedAt: new Date().toISOString(),
    brand: BRAND.name, market: BRAND.market,
    session: {
      sessionId: S.sessionId, participantId: S.participantId || 'unassigned',
      condition: S.condition, conditionLabel: cond().label,
      conditionFlags: cond(),
      mission: S.mission, missionLabel: MISSIONS[S.mission].label,
      startedAt: new Date(S.startedAt).toISOString(),
      durationMs: Date.now() - S.startedAt,
      taskSuccess: SUCCESS_FIRED,
      cart: S.cart.map(l => ({ id: l.id, sku: P(l.id).sku, name: P(l.id).name, qty: l.qty, price: P(l.id).price })),
      maxCompared: S.maxCompared,
      checkoutComplete: S.checkoutComplete,
      bookmarks: S.bookmarks
    },
    eventCount: EVENTS.length,
    events: EVENTS
  };
  download(`novi_${S.participantId || 'unassigned'}_${S.sessionId}.json`,
    JSON.stringify(payload, null, 2), 'application/json');

}
function exportCSV() {
  const cols = ['ts','msSinceSession','msSinceTask','sessionId','participantId','condition','conditionLabel','density','mission','missionLabel','route','event','detail'];
  const esc = v => '"' + String(v === undefined ? '' : v).replace(/"/g, '""') + '"';
  const rows = [cols.join(',')].concat(EVENTS.map(e => cols.map(c => esc(e[c])).join(',')));
  download(`novi_${S.participantId || 'unassigned'}_${S.sessionId}.csv`, rows.join('\r\n'), 'text/csv');
  track('data_exported', 'csv');
}
function download(fname, text, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = fname; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

/* ---- session control ---------------------------------------------------- */
function softReset(silent) {
  S.cart = []; S.compare = []; S.maxCompared = 0; S.checkoutComplete = false;
  S.filters = DEFAULT_SESSION().filters; S.sort = 'rec'; S.page = 1; S.query = '';
  S.taskStartedAt = Date.now();
  SUCCESS_FIRED = false;
  ASSIST_MSGS = [];
  PATH = { steps: 0, firstLaptopMs: null, firstLaptopSteps: null, hijacks: 0 };
  if (!silent) { track('journey_reset', 'soft'); toast('Journey reset. Same participant.'); }
  go('#/'); paintChrome(); paintMod();
}
function hardReset() {
  openModal(`<button class="x" onclick="closeModal()">&times;</button>
    <h2 class="h2">Start a new participant?</h2>
    <p class="sub" style="margin:9px 0 18px">This clears the cart, the journey and <b>all ${EVENTS.length} captured events</b> from the live session. The session is archived first, so it stays available in Sessions for comparison.</p>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn out" onclick="exportJSON()">Export JSON first</button>
      <button class="btn out" onclick="exportCSV()">Export CSV first</button>
      <button class="btn pri" onclick="confirmHardReset()">Clear and start new participant</button>
    </div>`, 'sm');
}
function confirmHardReset() {
  const keepCond = S.condition, keepMission = S.mission;
  /* Archive before wiping. The moderator should never be one click away from
     losing a participant they just ran. */
  archiveSession('new_participant');
  EVENTS = []; S = DEFAULT_SESSION();
  CLICKS = []; try { localStorage.removeItem(LS_C); } catch (e) {}
  PATH = { steps: 0, firstLaptopMs: null, firstLaptopSteps: null, hijacks: 0 };
  S.condition = keepCond; S.mission = keepMission;
  SUCCESS_FIRED = false; ASSIST_MSGS = [];
  save(); closeModal(); go('#/'); paintChrome(); paintMod(); if (typeof paintLog === 'function') paintLog();
  track('session_started', 'after_hard_reset');
  toast('New participant session started.');
}
function setCondition(c, silent) {
  S.condition = c;
  if (!silent) track('condition_changed', c);
  pushSessionField('condition', c);
  paintChrome(); paintMod(); render();
}
/* The collection art treatment. Same plumbing as the condition, because it is
   the same kind of thing: a study variable the moderator can switch mid-session
   and which every subsequent event carries. */
function setArtMode(m, silent) {
  if (!/^(icon|wall|both)$/.test(m)) return;
  S.art = m;
  if (!silent) track('art_mode_changed', m);
  pushSessionField('art', m);
  save();
  paintChrome(); paintMod(); render();
}
/* The console is read-only for participant data, with one deliberate exception:
   the moderator changing the running condition or task has to reach the
   participant's tab. Merge into the stored session rather than overwriting it,
   so the participant's clock and journey survive. */
function pushSessionField(field, value) {
  if (!readOnlyTab()) return;
  try {
    const raw = localStorage.getItem(LS_S);
    if (!raw) return;
    const stored = JSON.parse(raw);
    stored[field] = value;
    if (field === 'mission') stored.taskStartedAt = Date.now();
    localStorage.setItem(LS_S, JSON.stringify(stored));
  } catch (e) {}
}
function setMission(m, silent) {
  S.mission = +m; S.taskStartedAt = Date.now(); SUCCESS_FIRED = false;
  if (!silent) track('mission_changed', MISSIONS[S.mission].label);
  pushSessionField('mission', +m);
  paintChrome(); paintMod();
}
function setParticipant(v) { S.participantId = v.trim(); save(); track('participant_set', S.participantId || 'cleared'); paintMod(); }
function bookmark() {
  const b = { ts: new Date().toISOString(), route: location.hash, msSinceTask: Date.now() - S.taskStartedAt };
  S.bookmarks.push(b); track('moderator_bookmark', b); toast('Moment bookmarked.');
}

/* ---- routing ------------------------------------------------------------ */
const ROUTES = [
  [/^#\/$/,                       () => viewStoreHome()],
  [/^#\/legacy-home$/,            () => viewHome()],
  [/^#\/d\/([\w-]+)$/,            m  => viewDept(m[1])],
  [/^#\/d\/([\w-]+)\/([\w-]+)$/,  m  => viewDept(m[1], m[2])],

  [/^#\/computers$/,              () => viewCategory()],
  [/^#\/laptops$/,                () => viewBrowse()],
  [/^#\/deals$/,                  () => viewDeals()],
  [/^#\/search$/,                 () => viewSearch()],
  [/^#\/search\?q=(.*)$/,         m  => { const q = decodeURIComponent(m[1].replace(/\+/g, ' '));
                                          if (S.query !== q) { S.query = q; save(); }
                                          return viewSearch(); }],
  [/^#\/product\/(\d+)$/,         m  => viewPDP(+m[1])],

   Slide 14, the CX Touchpoint Prioritization Matrix, defines eleven

/* ---- Collection wallpapers, the photography treatment ---------------------
   When a retailer fronts a collection, the usual choice is the product
   photography the brand already ships: the device, shown displaying its own
   collection wallpaper. The argument for it is that it is real merchandising
   and that shoppers respond to device imagery rather than to abstract marks.

   The counter-argument from the shop-alongs is that photography cannot survive
   a retail environment: at thumbnail size, beside competing device imagery,
   five abstract blooms do not tell a shopper which collection is which, and on
   mobile the names truncate before they can rescue it.

   Both positions are testable, so both are built. The palettes below are
   sampled from reference artwork rather than invented, so the photography arm
   renders that position faithfully instead of as a straw man. artMode()
   switches the treatment and every collection event records which one was
   live, so the question resolves on observed behaviour rather than on
   preference. */

let WALL_N = 0;
function wallUid() { return 'wl' + (++WALL_N).toString(36); }

/* Authored in the same flat 0..100 x 0..62 screen space the 3D renderer uses,
   so one definition serves both a 16px chip and a laptop screen in
   perspective. */
function wallBloom(w, u) {
  const g = w.glow, out = [];
  const bx = 100 * (w.cx == null ? 0.5 : w.cx), by = 62 * (w.cy == null ? 0.5 : w.cy);
  for (let i = 0; i < 14; i++) {
    const ang = i * 25.7 + (i % 3) * 9;
    const dist = 7 + (i % 4) * 4.6;
    const rx = (16 + (i % 5) * 6.5).toFixed(1), ry = (4.6 + (i % 3) * 3.4).toFixed(1);
    const cx = bx + Math.cos(ang * Math.PI / 180) * dist * 1.45;
    const cy = by + Math.sin(ang * Math.PI / 180) * dist * 0.78;
    out.push(`<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx}" ry="${ry}"
      fill="${g[i % g.length]}" opacity="${(0.26 + (i % 4) * 0.10).toFixed(2)}"
      transform="rotate(${ang.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})"/>`);
  }
  return `<g filter="url(#${u}b)">${out.join('')}
    <ellipse cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" rx="15" ry="9.5" fill="${g[g.length - 1]}" opacity=".50"/>
    <ellipse cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" rx="6.5" ry="4.2" fill="${w.core}" opacity=".62"/>
    <ellipse cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" rx="2.6" ry="1.8" fill="${w.core}" opacity=".92"/></g>`;
}

/* Flowing bands. The gaming and creator wallpapers are ribbons of light on a
   near-black field rather than a radial bloom, which is what separates them
   from the productivity blue at full size. */
function wallRibbon(w, u) {
  const g = w.glow, out = [];
  for (let i = 0; i < 5; i++) {
    const y = 8 + i * 11.5, amp = 9 + (i % 3) * 5, sw = 7 + (i % 3) * 4.5;
    out.push(`<path d="M-10 ${y} C 22 ${y - amp}, 44 ${y + amp}, 70 ${y - amp * 0.6} S 100 ${y + amp * 0.5}, 112 ${y}"

      opacity="${(0.34 + (i % 3) * 0.16).toFixed(2)}"/>`);

/* ---------------- filtering + sorting + pagination ---------------- */
const PER_PAGE = 12;

/* ---- Search matching -----------------------------------------------------
   A retailer's search box gets natural phrases, not keywords. "laptop for
   school" was returning nothing because every token had to appear and no
   product contains the word "for". "16gb laptop" failed because RAM is stored
   as "16 GB" with a space, and "lightweight laptop" because no field says
   lightweight. Each of those is a query a participant will plausibly type, and
   a dead result page ends the journey being measured. */
const STOPWORDS = ['for', 'the', 'a', 'an', 'and', 'with', 'of', 'to', 'my', 'me',
  'best', 'good', 'top', 'new', 'in', 'on', 'that', 'is', 'i', 'need', 'want'];
function searchTokens(q) {
  const t = String(q || '').toLowerCase().trim().split(/\s+/).filter(Boolean);
  const kept = t.filter(x => STOPWORDS.indexOf(x) === -1);
  /* If the shopper typed nothing but stopwords, fall back to the raw tokens
     rather than silently matching the entire catalogue. */
  return kept.length ? kept : t;
}
function searchHay(p) {
  if (p._hay) return p._hay;
  const light = p.weightLb <= 3.2 ? 'lightweight light thin portable ultraportable' : '';
  const big = p.screenSize >= 16 ? 'large big desktop-replacement' : '';
  const touch = p.touch ? 'touch touchscreen' : '';
  /* Shoppers search by budget in words, not numbers. "cheap laptop" is one of
     the most typed queries on any retailer and it was returning nothing. */
  const band = p.price < 700 ? 'cheap budget affordable inexpensive value'
    : p.price > 1600 ? 'premium high-end flagship expensive' : 'mid-range';
  p._hay = [p.name, p.brand, p.family, p.type, p.collection || '', p.use.join(' '),
    p.cpu, p.cpuBrand, p.gpu, p.os, p.color, p.ram, p.ramGb + 'gb', p.storage,
    p.storageGb + 'gb', p.screenSize + ' inch', p.screenSize + '"', p.resolution,
    light, big, touch, band, (p.tags || []).join(' '),
    'laptop laptops notebook computer pc'
  ].join(' ').toLowerCase();
  return p._hay;
}
function matchesQuery(p, q) {
  const toks = searchTokens(q);
  if (!toks.length) return true;
  const hay = searchHay(p);
  return toks.every(t => hay.includes(t));
}
function applyFilters(list) {
  /* the query only narrows results on the search route. Carrying it into browse,
     a brand shop or a collection would silently distort every later session. */
  const f = S.filters, q = /^#\/search/.test(location.hash) ? S.query.trim().toLowerCase() : '';
  return list.filter(p => {
    if (q && !matchesQuery(p, q)) return false;
    if (f.use.length && !f.use.some(u => p.use.includes(u))) return false;
    if (f.collection.length && !f.collection.includes(p.collection)) return false;
    if (f.brand.length && !f.brand.includes(p.brand)) return false;
    if (f.os.length && !f.os.includes(p.os)) return false;
    if (f.cpu.length && !f.cpu.includes(p.cpuBrand)) return false;
    if (f.type.length && !f.type.includes(p.type)) return false;
    if (f.ram.length && !f.ram.includes(ramBand(p))) return false;
    if (f.storage.length && !f.storage.includes(storageBand(p))) return false;
    if (f.screen.length && !f.screen.includes(screenBand(p))) return false;
    if (f.price[0] != null && p.price < f.price[0]) return false;
    if (f.price[1] != null && p.price > f.price[1]) return false;
    if (f.rating && p.rating < f.rating) return false;
    if (f.touch && !p.touch) return false;
    if (f.deals && !p.wasPrice) return false;
    return true;
  });
}
function applySort(list) {
  const a = list.slice();
  const rank = cond().searchRank;
  if (S.sort === 'low') a.sort((x, y) => x.price - y.price);
  else if (S.sort === 'high') a.sort((x, y) => y.price - x.price);
  else if (S.sort === 'rating') a.sort((x, y) => y.rating - x.rating || y.reviewCount - x.reviewCount);
  else if (S.sort === 'selling') a.sort((x, y) => y.reviewCount - x.reviewCount);
  else if (S.sort === 'discount') a.sort((x, y) => ((y.wasPrice || y.price) - y.price) - ((x.wasPrice || x.price) - x.price));
  else if (S.sort === 'new') a.sort((x, y) => y.releaseYear - x.releaseYear || y.id - x.id);
  else {
    if (rank === 'popularity') a.sort((x, y) => y.reviewCount - x.reviewCount);
    else a.sort((x, y) => (y.rating * 40 + (y.tags.length * 8) + (y.sponsored ? 30 : 0)) -
                          (x.rating * 40 + (x.tags.length * 8) + (x.sponsored ? 30 : 0)));
    if (cond().sponsored) { const sp = a.filter(p => p.sponsored), rest = a.filter(p => !p.sponsored); return sp.slice(0, 2).concat(rest, sp.slice(2)); }
  }
  return a;
}
/* Banded facet values, following US large-format retailer convention:
   inch bands for screen size, discrete tiers for memory and storage. */
const PRICE_BANDS = [
  { label: 'Under $300',        lo: null, hi: 299 },
  { label: '$300 - $499.99',    lo: 300,  hi: 499 },
  { label: '$500 - $749.99',    lo: 500,  hi: 749 },
  { label: '$750 - $999.99',    lo: 750,  hi: 999 },
  { label: '$1,000 - $1,499.99',lo: 1000, hi: 1499 },
  { label: '$1,500 - $1,999.99',lo: 1500, hi: 1999 },
  { label: '$2,000 and above',  lo: 2000, hi: null }
];
function ramBand(p) { return p.ramGb + ' GB'; }
function storageBand(p) { return p.storageGb >= 1024 ? (p.storageGb / 1024) + ' TB' : p.storageGb + ' GB'; }
function screenBand(p) {
  const n = Math.floor(p.screenSize);
  if (n <= 11) return '11 - 11.9 inches';
  if (n >= 17) return '17 inches & up';
  return n + ' - ' + n + '.9 inches';
}
function bandValues(base, fn, order) {
  const seen = [...new Set(base.map(fn))];
  return order ? order.filter(v => seen.includes(v)) : seen.sort();
}

function facetCount(key, val, base) {
  return base.filter(p => key === 'use' ? p.use.includes(val)
    : key === 'collection' ? p.collection === val
    : key === 'brand' ? p.brand === val
    : key === 'os' ? p.os === val
    : key === 'type' ? p.type === val
    : key === 'ram' ? ramBand(p) === val
    : key === 'storage' ? storageBand(p) === val
    : key === 'screen' ? screenBand(p) === val
    : key === 'cpu' ? p.cpuBrand === val : false).length;
}

function priceBandOn(b) {
  const f = S.filters.price;

}
function setPriceBand(i) {

  /* Counted directly rather than through applyFilters(), which only applies the

  const lap = CATALOG.filter(p => matchesQuery(p, q)).length;

function collRow(c) {

function acProductRow(p) {

/* The merchandising equivalent. It carries the department instead of a
   Collection badge, because Collections are a Windows framework and inventing
   one for a television would be the exact confusion this study is measuring. */
function acMerchRow(p) {
  return `<div class="acprod" onclick="go('#/s/${p.id}')">

/* ---- Laptop intent -------------------------------------------------------
   Ashima, 18 Sep: "this should only come when I search for laptop keywords,
   novi sells all electronics not only PC now".

   Novi is a full-line retailer, so an empty search box belongs to the whole
   store. Leading it with five Windows collections would advertise the
   touchpoint rather than test it, and it would flatter TP1: a shopper who is
   shown collections before typing anything has not demonstrated that search
   surfaced them usefully. Worse, it is not what a real retailer does, and an
   unrealistic placement inflates the result.

   So Collections enter search on demonstrated laptop intent: a laptop word, a
   collection name or descriptor, a laptop type, or a query that actually
   matches laptop stock. Everything else gets the ordinary store experience. */
const LAPTOP_WORDS = ['laptop', 'laptops', 'notebook', 'pc', 'pcs', 'computer', 'computers',
  'macbook', 'chromebook', 'ultrabook', 'windows', 'copilot', '2-in-1', 'gaming rig',
  'desktop', 'processor', 'cpu', 'ram', 'ssd', 'graphics', 'gpu', 'battery life'];
function laptopIntent(v) {
  const q = String(v || '').trim().toLowerCase();
  if (!q) return false;
  if (LAPTOP_WORDS.some(w => q.includes(w))) return true;
  if (COLLECTIONS.some(c => (c.name + ' ' + c.blurb).toLowerCase().includes(q))) return true;
  if (TYPES.some(t => t.toLowerCase().includes(q) || q.includes(t.toLowerCase()))) return true;
  /* A brand or model that is actually laptop stock counts as intent, so "dell
     xps" or "thinkpad" behaves like "laptop" without being listed by hand.

     But a house brand is not intent on its own. Samsung sells Novi more TVs
     and phones than laptops, so "samsung" is a television query far more often
     than a PC one, and a hand-kept exclusion list would rot. Compare the two
     assortments instead: Collections appear only when the laptop stock is the
     better reading of what was typed. Two characters is too little evidence
     either way. */
  if (q.length < 3) return false;
  const lap = CATALOG.filter(p => matchesQuery(p, q)).length;
  if (!lap) return false;
  return lap >= searchStore(q).length;
}

  const box = document.getElementById('ac');

     store, so the suggestions span it rather than pointing only at laptops. */
  box.innerHTML = `<div class="achead">Popular searches</div>` +
    ['gaming laptop', '4k tv', 'wireless headphones', 'laptop for school', 'air fryer']
      .map(t => `<div onclick="doSearch('${t}')">&#9906; <b>${t}</b></div>`).join('');
  box.classList.add('open');
  track('autocomplete_shown', { query: '', mode: 'terms_only', count: 5, tp1: tpOn(1) });
}
function acInput() {
  const v = document.getElementById('q').value.trim().toLowerCase();
  const box = document.getElementById('ac');
  if (!v.length) { acFocus(); return; }
  /* TP1 has to be on AND the shopper has to have shown laptop intent. */
  const on = tpOn(1) && laptopIntent(v);
  /* Match the descriptor as well as the name. A shopper typing "school" or
     "editing" is describing a use case, which is the whole premise.

     When the text matches no Collection directly, which is what happens for
     the commonest query of all, "laptop", fall back to the Collections the
     matched products belong to. Slide 16 puts Collections inside the open
     panel, and an empty Collections block for the single most typed word
     would have been the touchpoint failing exactly where it is most needed. */
  let colls = on ? COLLECTIONS.filter(c => (c.name + ' ' + c.blurb).toLowerCase().includes(v)).slice(0, 3) : [];
  /* Catalogue order is not merchandising order. Taking the first six matches
     for "laptop" returned four sub-$430 machines all from one Collection,
     which both undersells the range and biases which Collection gets seen
     first at the highest-value touchpoint. Rank by review volume, the nearest
     honest proxy for popularity, which is what a retailer actually shows.

     Then cap at one per family. Straight popularity returned three MacBook
     rows out of four, because MacBooks genuinely carry the most reviews. A
     real autocomplete does not show you the same machine three times, and here
     it would also have quietly emptied the Collection column, since MacBooks
     are outside the framework. The cap is ordinary merchandising, applied
     before the arm is known, so it does not favour either treatment. */
  const ranked = CATALOG.filter(p => matchesQuery(p, v))
    .slice().sort((a, b) => b.reviewCount - a.reviewCount);
  const fam = [], hits = [];
  ranked.forEach(p => {
    if (hits.length >= 6) return;
    const k = p.family || p.name;
    if (fam.indexOf(k) >= 0) return;
    fam.push(k); hits.push(p);
  });
  ranked.forEach(p => { if (hits.length < 6 && hits.indexOf(p) === -1) hits.push(p); });
  if (on && !colls.length) {
    const seen = [];
    CATALOG.filter(p => matchesQuery(p, v))
      .slice().sort((a, b) => b.reviewCount - a.reviewCount)
      .forEach(p => { const c = collByName(p.collection); if (c && seen.indexOf(c) === -1) seen.push(c); });
    colls = seen.slice(0, 3);
    /* A laptop word with no matching stock, "notebook" or "pc", still deserves
       the framework. That is the query the touchpoint exists for. */
    if (!colls.length) colls = COLLECTIONS.slice(0, 3);
  }
  const terms = ['gaming laptop', 'laptop for school', 'lightweight laptop', '16gb laptop',
    '4k tv', 'wireless headphones', 'air fryer', 'smart watch']
    .filter(t => t.includes(v)).slice(0, 2);
  /* Novi is a full-line retailer, so the box has to answer for the whole store.
     It was matching CATALOG only, which meant "tv" and "headphones" returned no
     products at all while "xps" returned six. Laptops lead when intent is
     laptop, because that is the assortment under study; otherwise merch does. */
  const merch = searchStore(v).slice(0, 6);
  const lapN = on ? Math.min(hits.length, 4) : Math.min(hits.length, 3);
  const prodRows = on
    ? hits.slice(0, lapN).map(acProductRow).join('') + merch.slice(0, 6 - lapN).map(acMerchRow).join('')
    : merch.slice(0, 6).map(acMerchRow).join('') + hits.slice(0, Math.max(0, 6 - merch.length)).map(acProductRow).join('');
  const nProd = prodRows ? (prodRows.match(/class="acprod"/g) || []).length : 0;
  if (!nProd && !terms.length && !colls.length) { closeAC(); return; }
  box.innerHTML =
    (colls.length ? `<div class="achead">Collections</div>` + colls.map(collRow).join('') : '') +
    (terms.length ? terms.map(t => `<div onclick="doSearch('${t}')">&#9906; <b>${t}</b></div>`).join('') : '') +
    (nProd ? `<div class="achead">Products</div>` + prodRows : '');
  box.classList.add('open');
  track('autocomplete_shown', { query: v, count: nProd + terms.length + colls.length,
    tp1: tpOn(1), laptopIntent: on, merchShown: Math.max(0, nProd - hits.length) });
}
function closeAC() { const b = document.getElementById('ac'); if (b) b.classList.remove('open'); }
function esc(s) { return String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c])); }
function crumbs(parts) {
  return `<div class="crumb">${parts.map((p, i) => i === parts.length - 1
    ? `<span>${p[0]}</span>` : `<a onclick="go('${p[1]}')">${p[0]}</a> / `).join('')}</div>`;
}
function view404() {
  return `<div class="empty" style="padding:80px 20px"><h2 class="h2">Page not found</h2>
    <p class="sub" style="margin:10px 0 18px">That link doesn't lead anywhere in this prototype.</p>
    <button class="btn pri" onclick="go('#/')">Back to home</button></div>`;
}

/* ==========================================================================
   Part 3: PDP, compare, cart, checkout, order, advisor, collections, guide, brand
   ========================================================================== */

let PDP_TAB = 'specs';

/* ==========================================================================
   PDP optimizations 1-9.
   Everything below is derived from catalog fields rather than hand-written per
   SKU, so all 60 listings stay internally consistent and the rich/thin contrast
   stays honest. Thin listings deliberately lose most of this, which is the
   whole point of the comparison.
   ========================================================================== */

/* 5. Fit signaling, keyed to the collection so it can never contradict how the
   product is merchandised elsewhere on the site. */
const FIT = {
  'Core Essentials': {
    best: ['Browsing, email and streaming', 'Documents and everyday admin', 'A second machine for the house'],
    not:  ['Video editing or 3D work', 'Modern games at high settings', 'Running many heavy apps at once'] },
  'Everyday Productivity': {
    best: ['School and coursework', 'Hybrid work and video calls', 'A dozen tabs and a call at the same time'],
    not:  ['Sustained 4K video rendering', 'High refresh rate gaming', 'Colour critical professional work'] },
  'Premium Performance': {
    best: ['A full day of work away from a desk', 'Frequent travel and commuting', 'Demanding multitasking'],
    not:  ['Tight budgets', 'People who only browse and stream', 'Desktop replacement gaming'] },
  'Creator Pro': {
    best: ['Photo and video editing', 'Design and illustration', 'Colour accurate work'],
    not:  ['People who mainly browse', 'The lightest possible carry', 'The lowest upfront price'] },
  'Power Gaming': {
    best: ['High frame rate gaming', 'Streaming and capture', 'GPU accelerated creative work'],
    not:  ['All day battery away from power', 'Quiet library or office use', 'A light, slim carry'] },
  /* Collections is Windows-only, but a macOS or ChromeOS listing still has to tell
     the truth about fit. These bands drive PDP fit signalling only. They are never
     labelled as Collections and never appear in collection navigation. */
  'macOS': {
    best: ['People already in the Apple ecosystem', 'Long battery life away from power', 'Quiet, cool everyday use'],
    not:  ['Windows-only software', 'PC gaming', 'Upgrading memory or storage later'] },
  'ChromeOS': {
    best: ['Web, email and cloud documents', 'Simple setup and low maintenance', 'A low cost first or spare machine'],
    not:  ['Installed desktop software', 'Photo, video or 3D work', 'Working offline for long periods'] }
};

/* Fit and use-case band. Returns the Windows collection when the machine is in one,
   otherwise a platform band so non-Windows listings still render honest PDP content
   without being merchandised inside a framework they were never eligible for. */
function merchBand(p) {
  return p.collection || (/^mac/i.test(p.os) ? 'macOS' : /^Chrome/i.test(p.os) ? 'ChromeOS' : 'Core Essentials');
}

/* 7. Use-case declaration: one plain-language line, placed next to the hero. */
const USECASE_LINE = {
  'Core Essentials': 'Best for light users who want the everyday basics done reliably, without paying for power they will not use.',
  'Everyday Productivity': 'Best for students and hybrid workers who need to multitask without thinking about it.',
  'Premium Performance': 'Best for professionals who need premium portability and all-day productivity.',
  'Creator Pro': 'Best for creators and designers who need colour accuracy and real graphics power.',
  'Power Gaming': 'Best for gamers who want a high frame rate, with the headroom to create as well as play.',
  'macOS': 'Best for people already in the Apple ecosystem who want long battery life and a quiet machine.',
  'ChromeOS': 'Best for web, email and cloud documents, with very little to maintain.'
};

/* 9. Freshness hygiene. */
const CATALOG_YEAR = 2026;
function freshness(p) {
  const age = CATALOG_YEAR - p.releaseYear;
  if (age <= 0) return { label: 'Current model', tone: 'ok' };
  if (age === 1) return { label: 'Current model', tone: 'ok' };
  if (age === 2) return { label: 'Previous generation', tone: 'warn' };
  return { label: 'Older model, still sold', tone: 'warn' };
}

/* 2. Answer-first hero messaging: says what the thing is and when to surface it,
   before any marketing framing. */
function answerFirst(p) {
  const band = merchBand(p);
  const kind = p.collection ? p.collection.toLowerCase() + ' laptop'
             : /^mac/i.test(p.os) ? 'macOS laptop'
             : /^Chrome/i.test(p.os) ? 'Chromebook' : 'laptop';
  return `${p.name} is a ${p.screenSize}-inch ${kind} with ${p.cpu},
    ${p.ram} of memory and ${p.storage}, rated up to ${p.battery} of battery.
    ${USECASE_LINE[band] || ''}`;
}

/* 4. Spec-to-benefit translation: every spec answers a shopper question rather
   than reporting a number. */
function benefitFor(label, p) {
  switch (label) {
    case 'Memory':
      return p.ramGb >= 32 ? 'Headroom for large projects, big photo libraries and heavy multitasking.'
           : p.ramGb >= 16 ? 'Keeps a dozen tabs, a video call and your work open at the same time.'
           : 'Comfortable for browsing, email, documents and streaming.';
    case 'Storage':
      return p.storageGb >= 1024 ? 'Room for large video and photo libraries without an external drive.'
           : p.storageGb >= 512 ? 'Enough for years of documents, photos and a few large games.'
           : 'Fine for documents and photos. Plan on cloud storage for anything large.';
    case 'Battery life':
      return parseFloat(p.battery) >= 15 ? 'Comfortably a full working day away from a charger.'
           : parseFloat(p.battery) >= 10 ? 'A normal working day with light charging.'
           : 'Expect to carry the charger for a full day out.';
    case 'Graphics':
      return /RTX|GeForce|Radeon RX/.test(p.gpu) ? 'Dedicated graphics for gaming, rendering and GPU accelerated editing.'
           : /M\d+\s+(Pro|Max)/.test(p.cpu) ? 'Strong integrated graphics for editing and design work.'
           : 'Integrated graphics. Good for everyday use and video, not for modern gaming.';
    case 'Display size':
      return p.screenSize >= 16 ? 'A large canvas for multitasking, less convenient to carry.'
           : p.screenSize >= 14 ? 'The usual balance between screen space and portability.'
           : 'Small and easy to carry, tighter for side-by-side windows.';
    case 'Panel type':
      return /OLED/i.test(p.panel) ? 'Deeper contrast and more accurate colour, better for photo and video work.'
           : 'A standard panel, well suited to everyday work and browsing.';
    case 'Refresh rate':
      return parseInt(p.refresh) >= 120 ? 'Noticeably smoother motion for gaming and fast scrolling.'
           : 'Standard smoothness, fine for everyday use.';
    case 'Weight':
      return parseFloat(p.weight) <= 3 ? 'Light enough to carry every day without noticing.'
           : parseFloat(p.weight) <= 4.5 ? 'Easy enough to carry daily in a backpack.'
           : 'Heavy. Best if it mostly stays on a desk.';
    default: return '';
  }
}

/* 6. Query-led answers: phrased the way shoppers actually ask, so the same text
   works for a person reading and a model answering. */
function pdpFaqs(p) {
  const dgpu = /RTX|GeForce|Radeon RX/.test(p.gpu);
  const creatorish = dgpu || /M\d+\s+(Pro|Max)/.test(p.cpu) || /OLED/i.test(p.panel);
  return [
    ['Is this good for video calls?',
     `Yes. It has a ${p.webcam} and dual microphones, and ${p.ramGb >= 16
       ? 'enough memory to keep a call running alongside your other work.'
       : 'handles a call comfortably on its own.'}`],
    ['Can it replace a desktop?',
     p.ramGb >= 16 && p.storageGb >= 512
       ? `For most people, yes. With ${p.ram} and ${p.storage} it will handle a full workload. Add a monitor and keyboard and it is a desk setup.`
       : `As a main machine for everyday work, yes. For heavy or sustained workloads, a desktop still has the advantage.`],
    ['Is it good for students?',
     p.collection === 'Power Gaming'
       ? `It will handle coursework easily, but it is heavy and the battery is short for a day on campus.`
       : parseFloat(p.weight) <= 4 && parseFloat(p.battery) >= 10
         ? `Yes. At ${p.weight} and up to ${p.battery}, it will get through a day of classes.`
         : `It will do the work, though the ${parseFloat(p.weight) > 4 ? 'weight' : 'battery'} is worth considering for campus use.`],
    ['Will it handle photo and video editing?',
     creatorish
       ? `Yes. ${dgpu ? p.gpu + ' handles rendering and GPU accelerated effects.' : 'The graphics and display are suited to colour work.'} ${/OLED/i.test(p.panel) ? 'The OLED panel helps with colour accuracy.' : ''}`
       : `Light photo editing is fine. For serious video work, look at the Creator pro collection instead.`],
    ['How long does the battery really last?',
     `Rated up to ${p.battery}. In normal use with brightness around half, expect somewhat less.`],
    ['Is this the current model?',
     `${freshness(p).label}. Released ${p.releaseYear}, model number ${p.sku}.`]
  ];
}

/* 3. Machine-readable product data. Product, Offer, AggregateRating and FAQPage.
   Thin listings emit a deliberately sparse graph, which is the demonstration:
   the same shopper question is answerable on one page and not on the other. */
function productSchema(p, rich) {
  const g = {
    '@context': 'https://schema.org',
    '@type': 'Product',
    name: p.name,
    sku: p.sku,
    brand: { '@type': 'Brand', name: p.brand },
    offers: {
      '@type': 'Offer',
      price: p.price,
      priceCurrency: 'USD',
      availability: p.stock === 'In stock'
        ? 'https://schema.org/InStock' : 'https://schema.org/LimitedAvailability'
    }
  };
  if (rich) {
    g.category = p.collection || p.type;
    g.description = answerFirst(p).replace(/\s+/g, ' ').trim();
    g.aggregateRating = {
      '@type': 'AggregateRating', ratingValue: p.rating, reviewCount: p.reviewCount
    };
    g.additionalProperty = [
      ['Processor', p.cpu], ['Graphics', p.gpu], ['Memory', p.ram], ['Storage', p.storage],
      ['Display', p.screenSize + '" ' + p.panel + ' ' + p.resolution], ['Battery life', p.battery],
      ['Weight', p.weight], ['Operating system', p.os]
    ].map(r => ({ '@type': 'PropertyValue', name: r[0], value: r[1] }));
    g.audience = { '@type': 'PeopleAudience', audienceType: FIT[merchBand(p)].best.join('; ') };
    g.releaseDate = String(p.releaseYear);
  }
  const faq = rich ? {
    '@context': 'https://schema.org', '@type': 'FAQPage',
    mainEntity: pdpFaqs(p).map(q => ({
      '@type': 'Question', name: q[0],
      acceptedAnswer: { '@type': 'Answer', text: String(q[1]).replace(/\s+/g, ' ').trim() }
    }))
  } : null;
  return faq ? [g, faq] : [g];
}

/* The structured data is the RISE argument made visible. A moderator can open
   this mid-session and show exactly what an assistant can and cannot read. */
function schemaPanel(p, rich) {
  const json = JSON.stringify(productSchema(p, rich), null, 2);
  const fields = rich ? 'full graph' : 'name, sku, brand, price and availability only';
  return `<details class="schemabox" ontoggle="if(this.open)track('structured_data_opened','${p.sku}')">
    <summary>What an AI assistant can read from this page <span class="schemacount">${fields}</span></summary>
    <p class="sub" style="margin:8px 0 0">This is the structured data published with this listing. Assistants and
      search engines read this, not the page layout. ${rich
        ? 'Everything a shopper needs to be matched to this product is here.'
        : 'Specifications, ratings, fit and answers are all absent, so this product cannot be recommended with confidence.'}</p>
    <pre>${esc(json)}</pre></details>`;
}

/* Swapping the gallery shot is a real signal: someone checking the ports or the
   side profile is further down the consideration path than someone who never
   looks past the first image, so the shot name goes into the event. */
/* Which gallery shots this product offers. Shot 4 is the TP10 Collection screen
   fill, present only when that touchpoint is live and only for machines the
   framework actually covers. */
/* ---- TP10, the brand-supplied gallery assets -------------------------------
   Slide 24 asks for four things in the carousel, in this order: the device
   carrying the collection wallpaper, a collection infographic, a collection
   video, and the badge beside the title. The first three are gallery slots and
   are built here; the badge lives in the buybox below.

   Shots are addressed by key rather than by index now, because three of them
   are not camera angles at all. */
function pdpShots(p) {
  const n = (typeof artVariants === 'function' ? artVariants(p) : 4);
  const base = [0, 1, 2, 3].slice(0, n).map(String);
  if (!(tpOn(10) && collByName(p.collection))) return base;
  return ['wall', 'info', 'video'].concat(base);
}

const SHOT_NAME = {
  wall: 'collection_wallpaper', info: 'collection_infographic', video: 'collection_video',
  0: 'front', 1: 'profile', 2: 'closed', 3: 'ports'
};

function shotArt(p, k) {
  if (k === 'wall') return productArt(p, 5);
  if (k === 'info') return collInfographic(p);
  if (k === 'video') return collVideoStill(p);
  return productArt(p, Number(k));
}
function shotMain(p, k) {
  if (k === 'info' || k === 'video') return `<div class="viz">${shotArt(p, k)}</div>`;
  return vizLap(p, '', k === 'wall' ? 5 : Number(k));
}

/* The collection infographic. A brand ships this as a flat image; it is drawn
   here so it restyles with the retailer skin and so the three facts on it stay
   tied to the live assortment rather than to whatever was true when a PNG was
   exported. */
function collInfographic(p) {
  const c = collByName(p.collection);
  if (!c) return '';

  const h = c.hue;

  const clip = s => {

  };

    ${hl.map((x, i) => `

      <path d="M24.2 ${76 + i * 34}l2.8 2.8 5-5.4" fill="none" stroke="hsl(${h} 64% 38%)"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="45" y="${73 + i * 34}" fill="#14171c" font-family="Segoe UI,system-ui,sans-serif"
        font-size="11" font-weight="700">${esc(x[0])}</text>
      <text x="45" y="${85 + i * 34}" fill="#5a6270" font-family="Segoe UI,system-ui,sans-serif"
        font-size="8.8">${esc(clip(x[1]))}</text>`).join('')}
    <rect x="20" y="168" width="280" height="1" fill="#e3e7ec"/>
    <text x="20" y="188" fill="hsl(${h} 64% 34%)" font-family="Segoe UI,system-ui,sans-serif"

/* The collection video still. The syndicated band below the fold carries the
   same content; this is the carousel entry point to it, which is where slide 24

function collVideoStill(p) {

function setGalleryShot(id, k, el) {
  const p = P(id) || (typeof storeById === 'function' ? storeById(id) : null);

  if (main && p) main.innerHTML = shotMain(p, k);

  if (el) el.classList.add('on');
