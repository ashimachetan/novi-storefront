<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>novi | Laptops, computers and tablets</title>
<style>
:root{
  --b:#0b5bd3;--b2:#1b80ed;--d:#073b8e;--dd:#062e70;
  --ink:#172033;--muted:#64748b;--line:#dbe5f0;--bg:#f4f7fb;--white:#fff;
  --ok:#087f5b;--warn:#a16207;--hot:#e11d48;
  --radius:11px;--max:1280px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none;cursor:pointer}
img{max-width:100%}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- chrome ---------- */
.topbar{background:var(--dd);color:#dcecff;font-size:12px}
.topbar .wrap{display:flex;justify-content:space-between;padding:8px 24px}
.header{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.header .wrap{display:flex;align-items:center;gap:22px;padding:14px 24px}
.logo{font-size:25px;font-weight:800;color:var(--b);letter-spacing:-.5px;white-space:nowrap}
.logo i{color:#13a6df;font-style:normal}
.searchbox{flex:1;position:relative}
.searchbox input{width:100%;padding:11px 44px 11px 14px;border:1px solid #b9c9dc;border-radius:8px}
.searchbox input:focus{outline:2px solid var(--b);outline-offset:-1px}
.searchbox .go{position:absolute;right:4px;top:4px;height:33px;width:37px;background:var(--b);color:#fff;border:0;border-radius:6px}
.ac{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 18px 44px #16305514;overflow:hidden;z-index:50;display:none}
.ac.open{display:block}
.ac div{padding:10px 14px;border-bottom:1px solid #eef3f9;font-size:13px}
.ac div:hover{background:#f1f7ff}
.ac b{color:var(--d)}
.hnav{display:flex;gap:16px;align-items:center;font-size:13px;color:#34445d;white-space:nowrap}
.cartbtn{border:0;background:#fff;color:var(--b);font-weight:700;display:flex;gap:6px;align-items:center}
.pill{background:var(--hot);color:#fff;border-radius:99px;padding:2px 7px;font-size:11px;font-weight:700}
.mainnav{background:#fff;border-bottom:1px solid var(--line)}
.mainnav .wrap{display:flex;gap:20px;padding:9px 24px;font-size:13px;color:#3c4d67;overflow:auto}
.mainnav a:hover{color:var(--b)}
.mainnav a.on{color:var(--b);font-weight:700}
.crumb{color:var(--muted);font-size:12px;padding:16px 0 0}
.crumb a:hover{color:var(--b);text-decoration:underline}

/* ---------- generic ---------- */
.btn{border-radius:7px;padding:10px 15px;font-weight:700;border:1px solid transparent}
.btn.pri{background:var(--b);color:#fff;border-color:var(--b)}
.btn.pri:hover{background:var(--d)}
.btn.out{background:#fff;color:var(--b);border-color:var(--b)}
.btn.out:hover{background:#eef5ff}
.btn.ghost{background:#fff;color:#33455f;border-color:#c3d2e3}
.btn.wide{width:100%}
.btn.lg{padding:13px 18px;font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
h1,h2,h3{margin:0}
.h1{font-size:32px;letter-spacing:-1px;margin:0 0 6px}
.h2{font-size:22px;letter-spacing:-.4px;margin:0}
.sub{color:var(--muted);font-size:13px}
.sectionhead{display:flex;justify-content:space-between;align-items:flex-end;margin:26px 0 14px;gap:16px}
.grid{display:grid;gap:15px}
.tag{background:#e7f1ff;color:var(--d);border-radius:4px;padding:4px 7px;font-size:10px;font-weight:800;letter-spacing:.2px}
.tag.sp{background:#f1f5f9;color:#5b6b82}
.tag.hot{background:#ffe9ef;color:#b1123c}

/* ---------- product visual ---------- */
.viz{background:linear-gradient(160deg,#fbfdff,#eef4fa);border-radius:8px;display:grid;place-items:center;position:relative;overflow:hidden}
.lap{position:relative;transform-origin:center}
.lap .scr{width:150px;height:94px;border:5px solid #dbe6f2;border-bottom:0;border-radius:8px 8px 0 0;background:linear-gradient(140deg,var(--c1),var(--c2));position:relative}
.lap .scr:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#ffffff45,#ffffff00 55%)}
.lap .base{width:186px;height:9px;background:linear-gradient(#e4ecf5,#c9d7e6);border-radius:0 0 9px 9px;margin-left:-18px}
.viz .badge{position:absolute;top:9px;left:9px}

/* ---------- product card ---------- */
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;position:relative;transition:.16s}
.pcard:hover{box-shadow:0 14px 38px #142d5518;transform:translateY(-2px)}
.pcard .viz{height:158px;margin-bottom:12px}
.pcard .viz .lap{transform:scale(.72)}
.pbrand{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.pname{font-size:15px;font-weight:700;margin:5px 0 4px;line-height:1.25}
.stars{color:#f0a500;font-size:12px;letter-spacing:-1px}
.rline{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:9px}
.specrow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
.spec{background:#f1f5f9;border-radius:4px;padding:4px 6px;font-size:11px;color:#52627b;white-space:nowrap}
.price{font-size:21px;font-weight:800;margin-top:auto;display:flex;align-items:baseline;gap:7px}
.was{font-size:11px;color:var(--muted);text-decoration:line-through;font-weight:400}
.fin{font-size:11px;color:#42546e;margin-top:2px}
.delivery{font-size:11px;color:var(--ok);font-weight:650;margin:6px 0 11px}
.pactions{display:flex;gap:6px}
.pactions .btn{flex:1;padding:9px 4px;font-size:12px}
.cmpline{font-size:11px;margin-top:10px;color:#52627b;display:flex;gap:6px;align-items:center}

/* ---------- layout: browse ---------- */
.shop{display:grid;grid-template-columns:242px 1fr;gap:24px;align-items:start;padding-bottom:60px}
.facets{padding:18px;position:sticky;top:126px}
.facets h3{font-size:14px;margin:0 0 4px}
.fgroup{border-top:1px solid var(--line);padding:13px 0}
.fgroup:first-of-type{border:0}
.fgroup b{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#42516a}
.fgroup label{display:flex;gap:8px;align-items:center;margin:9px 0;color:#42516a;font-size:13px;cursor:pointer}
.fgroup input{accent-color:var(--b)}
.fgroup .cnt{margin-left:auto;color:#93a3b8;font-size:11px}
.prices{display:flex;gap:6px;margin-top:9px}
.prices input{width:50%;padding:8px;border:1px solid var(--line);border-radius:5px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#e8f2ff;border:1px solid #bfd9ff;color:var(--d);border-radius:99px;padding:5px 10px;font-size:12px;display:flex;gap:6px;align-items:center}
.chip button{border:0;background:none;color:var(--d);font-weight:800;padding:0}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.pager{display:flex;gap:6px;justify-content:center;align-items:center;margin:28px 0 0}
.pager button{min-width:38px;height:38px;border-radius:7px;border:1px solid var(--line);background:#fff;font-weight:700;color:#3b4d68}
.pager button.on{background:var(--b);color:#fff;border-color:var(--b)}
.pager button:disabled{opacity:.4;cursor:default}
.empty{text-align:center;color:var(--muted);padding:44px 12px;grid-column:1/-1}

/* ---------- home ---------- */
.hero{border-radius:16px;background:linear-gradient(120deg,var(--b),var(--b2));color:#fff;padding:44px 46px;display:flex;justify-content:space-between;gap:20px;overflow:hidden;margin:16px 0 20px}
.hero h1{font-size:38px;line-height:1.05;letter-spacing:-1.4px;margin:0 0 12px;max-width:560px}
.hero p{color:#e4efff;margin:0 0 20px;max-width:520px}
.hero .lap .scr{width:190px;height:118px}
.hero .lap .base{width:230px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{padding:18px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);transition:.15s}
.tile:hover{border-color:var(--b);transform:translateY(-2px)}
.tile b{display:block;margin-bottom:3px}
.tile span{font-size:12px;color:var(--muted)}
.promos{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin:18px 0}
.promo{border-radius:var(--radius);padding:22px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:132px}
.promo h3{font-size:19px;margin:0 0 6px;letter-spacing:-.4px}
.promo p{margin:0;font-size:13px;opacity:.9}
.promo.a{background:linear-gradient(130deg,#0b5bd3,#22a3e0)}
.promo.b{background:linear-gradient(130deg,#123a75,#2b6fbb)}
.promo.c{background:linear-gradient(130deg,#0d7a5f,#25b389)}
.railwrap{position:relative}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:230px;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-behavior:smooth}
.helpbar{background:#e8f2ff;border:1px solid #bfd9ff;border-radius:12px;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;margin:18px 0}
.helpbar strong{display:block;font-size:16px}
.helpbar span{font-size:13px;color:#45617e}

/* ---------- PDP ---------- */
.pdp{display:grid;grid-template-columns:1.15fr 1fr;gap:34px;padding:20px 0 40px;align-items:start}
.gallery .viz{height:340px;margin-bottom:10px}
.gallery .viz .lap{transform:scale(1.25)}
.thumbs{display:flex;gap:9px}
.thumb{width:66px;height:52px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(160deg,#fbfdff,#eaf1f8);cursor:pointer}
.thumb.on{border-color:var(--b);box-shadow:0 0 0 2px #bfd9ff}
.buybox{position:sticky;top:126px}
.pdp .price{font-size:30px}
.variants{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.variant{border:1px solid #c3d2e3;border-radius:7px;padding:9px 12px;background:#fff;font-size:12px;text-align:left}
.variant.on{border-color:var(--b);background:#eef5ff;box-shadow:0 0 0 1px var(--b)}
.variant b{display:block;font-size:13px}
.fulfil{border:1px solid var(--line);border-radius:9px;padding:13px;margin:14px 0;display:grid;gap:10px}
.fulfil label{display:flex;gap:9px;align-items:flex-start;font-size:13px;cursor:pointer}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}
.facts>div{background:#f6f8fb;padding:10px;border-radius:7px;font-size:13px}
.facts b{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.spectable{width:100%;border-collapse:collapse;font-size:13px}
.spectable td{padding:10px 8px;border-bottom:1px solid var(--line)}
.spectable td:first-child{color:var(--muted);width:38%}
.spectable td:last-child{font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:30px 0 18px;overflow:auto}
.tabs button{border:0;background:none;padding:11px 15px;font-weight:700;color:#5c6c85;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--b);border-bottom-color:var(--b)}
.ratingsplit{display:grid;grid-template-columns:180px 1fr;gap:26px;align-items:start}
.bigrating{text-align:center}
.bigrating .n{font-size:44px;font-weight:800;line-height:1}
.bar{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:12px;color:var(--muted)}
.bar .track{flex:1;height:8px;background:#eef2f7;border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:#f0a500}
.review{border-top:1px solid var(--line);padding:15px 0}
.review .meta{font-size:12px;color:var(--muted);margin:3px 0 7px}
.qa{border-top:1px solid var(--line);padding:14px 0}
.qa b{display:block;margin-bottom:4px}
.thinnote{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:11px 13px;font-size:12px;margin:14px 0}

/* ---------- compare ---------- */
.cmptable{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.cmptable th,.cmptable td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmptable th{background:#f7fafd;position:sticky;top:118px}
.cmptable td.k{color:var(--muted);width:190px}
.cmptable tr.diff td:not(.k){background:#fffaf0}
.cmpbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#152b4b;color:#fff;padding:12px 18px;border-radius:11px;display:none;gap:14px;align-items:center;z-index:35;box-shadow:0 16px 40px #0a1a3455}
.cmpbar.show{display:flex}
.cmpbar button{border:0;border-radius:6px;padding:8px 13px;font-weight:700}

/* ---------- cart / checkout ---------- */
.twocol{display:grid;grid-template-columns:1fr 340px;gap:26px;align-items:start;padding-bottom:50px}
.lineitem{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.lineitem .viz{width:118px;height:86px;flex:none}
.lineitem .viz .lap{transform:scale(.52)}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:6px;width:max-content}
.qty button{border:0;background:#fff;width:30px;height:30px;font-weight:800;color:var(--b)}
.qty span{width:32px;text-align:center;font-weight:700}
.summary{padding:18px;position:sticky;top:126px}
.srow{display:flex;justify-content:space-between;padding:7px 0;font-size:13px}
.srow.total{font-size:19px;font-weight:800;border-top:1px solid var(--line);margin-top:9px;padding-top:14px}
.steps{display:flex;gap:8px;margin:8px 0 22px;flex-wrap:wrap}
.step{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.step .n{width:24px;height:24px;border-radius:99px;background:#e6edf6;color:#5c6c85;display:grid;place-items:center;font-size:12px;font-weight:800}
.step.on{color:var(--ink);font-weight:700}
.step.on .n{background:var(--b);color:#fff}
.step.done .n{background:var(--ok);color:#fff}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:#42516a;margin-bottom:5px}
.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:7px}
.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.attach{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:12px;margin:10px 0}

/* ---------- assistant ---------- */
.asstbtn{position:fixed;right:20px;bottom:20px;z-index:36;border:0;border-radius:99px;background:var(--b);color:#fff;padding:13px 19px;font-weight:750;box-shadow:0 14px 34px #0b5bd345;display:flex;gap:8px;align-items:center}
.asst{position:fixed;right:20px;bottom:20px;width:min(390px,calc(100vw - 40px));height:min(560px,calc(100vh - 40px));background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 26px 70px #0a1a3440;z-index:37;display:none;flex-direction:column;overflow:hidden}
.asst.open{display:flex}
.asst .head{background:var(--b);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.asst .head b{font-size:15px}
.asst .body{flex:1;overflow:auto;padding:15px;background:#f7fafd}
.msg{margin-bottom:12px;max-width:88%}
.msg .bub{padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.5}
.msg.a .bub{background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.u{margin-left:auto}
.msg.u .bub{background:var(--b);color:#fff;border-bottom-right-radius:3px}
.sugg{display:flex;gap:7px;flex-wrap:wrap;padding:11px 13px;border-top:1px solid var(--line);background:#fff}
.sugg button{border:1px solid #c3d2e3;background:#fff;border-radius:99px;padding:7px 12px;font-size:12px;color:#33455f;text-align:left}
.sugg button:hover{border-color:var(--b);color:var(--b)}
.asstcard{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:9px}
.asstcard .viz{width:66px;height:50px;flex:none}
.asstcard .viz .lap{transform:scale(.3)}
.asstcard b{font-size:13px;display:block}
.asstcard small{color:var(--muted)}

/* ---------- research console ---------- */
.modbar{position:fixed;top:0;left:0;right:0;background:#0f2745;color:#dbeafe;z-index:60;display:none;gap:14px;align-items:center;padding:7px 16px;font-size:12px;flex-wrap:wrap}
.modbar.show{display:flex}
.modbar select,.modbar input{background:#17324f;color:#e8f1ff;border:1px solid #2d4a70;border-radius:5px;padding:5px 8px;font-size:12px}
.modbar button{background:#2563eb;border:0;color:#fff;border-radius:5px;padding:5px 11px;font-weight:700;font-size:12px}
.modbar button.gh{background:#22405f}
.modbar .sp{margin-left:auto;display:flex;gap:9px;align-items:center}
body.modon{padding-top:38px}
body.modon .header{top:38px}
.console{padding:22px 0 60px;display:grid;grid-template-columns:1fr 380px;gap:22px;align-items:start}
.panel{padding:18px}
.panel h3{font-size:15px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.evtlog{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px;font:11px/1.5 ui-monospace,Consolas,monospace}
.evtlog div{padding:6px 9px;border-bottom:1px solid #eef3f9;display:flex;gap:9px}
.evtlog .t{color:#93a3b8;flex:none;width:56px}
.evtlog .n{color:var(--d);font-weight:700;flex:none;width:150px}
.evtlog .v{color:#52627b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:14px}
.stat{background:#f6f9fc;border:1px solid var(--line);border-radius:9px;padding:12px}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}

/* ---------- overlays ---------- */
.back{position:fixed;inset:0;background:#0a1a347a;z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
.back.open{display:flex}
.modal{background:#fff;border-radius:15px;width:min(720px,100%);max-height:88vh;overflow:auto;padding:26px;position:relative}
.modal.sm{width:min(460px,100%)}
.x{position:absolute;right:15px;top:12px;border:0;background:none;font-size:25px;color:var(--muted);line-height:1}
.drawer{position:fixed;right:0;top:0;height:100%;width:min(410px,100%);background:#fff;z-index:65;box-shadow:-14px 0 40px #0a1a3428;padding:24px;transform:translateX(100%);transition:.24s;overflow:auto}
.drawer.open{transform:translateX(0)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:#15345c;color:#fff;padding:12px 18px;border-radius:9px;z-index:80;display:none;box-shadow:0 12px 30px #0a1a3440}
.toast.show{display:block}
.qsteps{display:grid;gap:18px}
.qopts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.qopts button{border:1px solid #c3d2e3;background:#fff;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;color:#33455f}
.qopts button.on{border-color:var(--b);background:#e8f2ff;color:var(--d)}

.footer{background:#0f2036;color:#a9bdd5;margin-top:40px;padding:34px 0 26px;font-size:13px}
.footer .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.footer b{color:#fff;display:block;margin-bottom:9px;font-size:13px}
.footer a{display:block;padding:3px 0;color:#a9bdd5}
.footer a:hover{color:#fff}
.footer .legal{border-top:1px solid #24384f;margin-top:24px;padding-top:16px;color:#7e93ab;font-size:12px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* ---------- responsive ---------- */
@media(max-width:980px){
  .pdp{grid-template-columns:1fr;gap:20px}
  .buybox{position:static}
  .twocol{grid-template-columns:1fr}
  .console{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .promos{grid-template-columns:1fr}
}
@media(max-width:800px){
  .topbar{display:none}
  .header .wrap{flex-wrap:wrap;gap:11px;padding:11px 16px}
  .searchbox{order:3;flex-basis:100%}
  .hnav span{display:none}
  .wrap{padding:0 16px}
  .shop{grid-template-columns:1fr}
  .facets{display:none;position:static}

  .hero h1{font-size:27px}

/* ---------- added: prototype + mission bars, assistant hedge ---------- */
.missionbar{display:none;background:#fff7ed;border-bottom:1px solid #fed7aa;color:#7c2d12;font-size:13px}
.missionbar.show{display:block}
.missionbar .wrap{padding:9px 24px;display:flex;gap:10px;align-items:center}
.missionbar b{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#9a3412}
.donetag{margin-left:auto;background:var(--ok);color:#fff;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:800}
body.hasmod .header{top:38px}
body.hasmod{padding-top:38px}
.hedge{display:block;margin-top:8px;font-size:11px;font-weight:700;color:#9a3412}
.msg .bub b{font-weight:750}
.asst .sugg input:focus{outline:2px solid var(--b);outline-offset:-1px}

/* ---------- homepage: carousel ---------- */
.carousel{position:relative;border-radius:16px;overflow:hidden;margin:16px 0 18px;height:330px}
.cslide{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:40px 46px;color:#fff;opacity:0;transition:opacity .5s;pointer-events:none}
.cslide.on{opacity:1;pointer-events:auto}
.ctext{max-width:590px}
.ctag{display:inline-block;background:#ffffff2e;border:1px solid #ffffff5c;border-radius:99px;padding:5px 12px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin-bottom:14px}
.cslide h1{font-size:38px;line-height:1.05;letter-spacing:-1.4px;margin:0 0 10px}
.cslide p{margin:0 0 20px;color:#eaf2ff;font-size:15px;max-width:480px}
.cart2 .lap{transform:scale(1.08)}
.cart2 .lap .scr{width:200px;height:124px}
.cart2 .lap .base{width:242px}
.cnav{position:absolute;bottom:14px;width:34px;height:34px;border-radius:99px;border:1px solid #ffffff4d;background:#ffffff26;color:#fff;font-size:20px;line-height:1}
.cnav:hover{background:#ffffff4d}
.cnav.prev{right:60px}
.cnav.next{right:18px}
.cdots{position:absolute;bottom:16px;left:46px;display:flex;gap:7px}
.cdots button{width:9px;height:9px;border-radius:99px;border:0;background:#ffffff70;padding:0}
.cdots button.on{background:#fff;width:26px}

/* ---------- homepage: category strip ---------- */
.catstrip{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:20px}
.catstrip a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 8px;text-align:center;transition:.15s}
.catstrip a:hover{border-color:var(--b);transform:translateY(-2px)}
.catstrip .ico{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 8px;border-radius:99px;background:#eaf2ff}
.catstrip svg{width:22px;height:22px;fill:none;stroke:var(--b);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.catstrip b{font-size:12px;color:#33455f;display:block}

/* ---------- homepage: deal of the day ---------- */
.dotd{display:grid;grid-template-columns:400px 1fr;gap:28px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;align-items:center;margin:22px 0}
.dotdviz{position:relative;background:linear-gradient(160deg,#fbfdff,#eef4fa);border-radius:11px;height:250px;display:grid;place-items:center}
.dotdviz .lap{transform:scale(1.05)}
.dotdflag{position:absolute;top:12px;left:12px;background:var(--hot);color:#fff;border-radius:6px;padding:6px 11px;font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.soldbar{height:8px;background:#eef2f7;border-radius:99px;overflow:hidden;max-width:340px}
.soldbar span{display:block;height:100%;background:linear-gradient(90deg,#e8113c,#ff6a3d)}

/* ---------- homepage: banners, brands, services ---------- */
.dualbanner{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}
.dbanner{border-radius:var(--radius);padding:26px;background:linear-gradient(120deg,#10294a,#1e4f8a);color:#fff;display:block;transition:.15s}
.dbanner.alt{background:linear-gradient(120deg,#0f3d33,#1d7f66)}
.dbanner:hover{transform:translateY(-2px)}
.dbtag{display:inline-block;background:#ffffff2b;border-radius:99px;padding:4px 10px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:11px}
.dbanner b{display:block;font-size:19px;letter-spacing:-.4px;margin-bottom:5px}
.dbanner span{font-size:13px;color:#d6e5f7}
.brandstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.brandstrip a{background:#fff;border:1px solid var(--line);border-radius:11px;padding:18px 12px;text-align:center;transition:.15s;border-top:3px solid hsl(var(--bh),62%,50%)}
.brandstrip a:hover{transform:translateY(-2px);box-shadow:0 12px 30px #142d5514}
.brandstrip b{display:block;font-size:14px}
.brandstrip span{font-size:11px;color:var(--muted)}
.svcs{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:26px 0}
.svc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px}
.svc b{display:block;font-size:13px;margin-bottom:3px}
.svc span{font-size:11px;color:var(--muted);line-height:1.45}
.signup{background:#0f2036;color:#fff;border-radius:var(--radius);padding:26px 30px;display:flex;justify-content:space-between;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:40px}
.signup b{display:block;font-size:19px;letter-spacing:-.4px;margin-bottom:4px}
.signup span{font-size:13px;color:#a9bdd5}
.signupform{display:flex;gap:8px}
.signupform input{padding:12px 14px;border:1px solid #2b4667;border-radius:8px;background:#152c4b;color:#fff;width:250px}
.signupform input::placeholder{color:#7e93ab}
.chip button:hover{color:var(--hot)}

@media(max-width:980px){
  .catstrip{grid-template-columns:repeat(4,1fr)}
  .dotd{grid-template-columns:1fr}
  .dualbanner{grid-template-columns:1fr}
  .brandstrip{grid-template-columns:repeat(3,1fr)}
  .svcs{grid-template-columns:repeat(3,1fr)}
  .carousel{height:auto;min-height:300px}
  .cart2{display:none}
}
@media(max-width:800px){
  .catstrip{grid-template-columns:repeat(4,1fr);gap:7px}
  .cslide{padding:26px 22px}
  .cslide h1{font-size:26px}
  .svcs{grid-template-columns:1fr 1fr}
  .signupform input{width:100%}
}

/* ---------------------------------------------------------------------------
   Deterministic pseudo-random so every build is byte-identical.
--------------------------------------------------------------------------- */
let _s = 987654321;
function rnd() { _s = (_s * 1664525 + 1013904223) % 4294967296; return _s / 4294967296; }
function pick(a) { return a[Math.floor(rnd() * a.length)]; }
function between(lo, hi) { return lo + Math.floor(rnd() * (hi - lo + 1)); }

/* Review themes. Written to mirror the themes that genuinely dominate laptop
   reviews: design, boot speed and display run positive; memory headroom,
   port selection and battery claims run negative. */
const REVIEW_POOL = {
  pos: [
    'Battery easily gets me through a full day of classes.',
    'Screen is genuinely bright, I can work next to a window without squinting.',
    'It starts up in seconds and I can have mail, music and a few tabs open with no lag.',
    'Light enough that I stopped noticing it in my bag.',
    'Handles a dozen browser tabs and a video call without breaking a sweat.',
    'Keyboard is comfortable for long typing sessions.',
    'Fan almost never spins up during normal work.',
    'Build quality feels a class above what I paid.',
    'Runs my editing software far better than I expected.',
    'Looks smarter than anything else I looked at in this price range.'
  ],
  mid: [
    'Solid machine, though I wish it had one more USB-C port.',
    'Does everything I need, but the speakers are only adequate.',
    'Good performance, average webcam.',
    'Happy overall, the charging brick is bulkier than it needs to be.',
    'Fine for the price, screen could be brighter outdoors.'
  ],
  neg: [
    'Ran warm under sustained load, had to prop it up.',
    'Storage filled up faster than I planned for.',
    'Trackpad took some getting used to.',
    'Battery is closer to six hours in real use than the claim.'
  ],
  /* Only surfaced on 8 GB machines. The objection in real reviews is almost never
     the capacity on its own, it is that the memory is soldered and cannot be raised. */
  ram8: [
    'Works fine today, but the memory is soldered so there is no upgrade path later.',
    'Windows uses a big chunk of the 8 GB before I have opened anything, so I watch my tabs.',
    'If you keep a lot of tabs open alongside a call, look at a 16 GB version instead.',
    'Non-upgradeable memory is the one thing that stopped this being five stars.'
  ],
  noUsbA: [
    'No full-size USB-A at all, so budget for a dongle on day one.'
  ]
};

const REVIEWERS = ['J. Rivera','M. Okafor','S. Lindqvist','D. Patel','A. Brennan',
                   'T. Nakamura','K. Adeyemi','R. Fontaine','C. Whitlock','P. Moreau'];

function makeReviews(rating, ram, portsHaveUsbA) {
  const out = [];
  const n = between(6, 10);
  for (let i = 0; i < n; i++) {
    let stars, body;
    const r = rnd();
    if (ram <= 8 && r > 0.82 && r < 0.90) { stars = between(3, 4); body = pick(REVIEW_POOL.ram8); }
    else if (!portsHaveUsbA && r >= 0.90 && r < 0.93) { stars = 4; body = pick(REVIEW_POOL.noUsbA); }
    else if (rating >= 4.5 ? r < 0.75 : r < 0.55) { stars = 5; body = pick(REVIEW_POOL.pos); }
    else if (r < 0.9) { stars = 4; body = pick(REVIEW_POOL.mid); }
    else { stars = between(2, 3); body = pick(REVIEW_POOL.neg); }
    out.push({
      stars,
      title: stars >= 5 ? 'Exactly what I wanted'
           : stars === 4 ? 'Very good with small caveats'
           : 'Mixed feelings',
      body,
      author: REVIEWERS[i % 10],
      verified: rnd() > 0.15,
      daysAgo: between(3, 240)
    });
  }
  return out;
}

function starDistribution(rating, count) {
  const skew = (rating - 3) / 2;
  const w = [0.03 + 0.05 * (1 - skew), 0.04 + 0.05 * (1 - skew), 0.08, 0.20 + 0.1 * skew, 0.55 + 0.25 * skew];
  const tot = w.reduce((a, b) => a + b, 0);
  const pct = w.map(x => x / tot);
  return [5, 4, 3, 2, 1].map((s, i) => ({ stars: s, count: Math.round(count * pct[4 - i]) }));
}

/* The experiment variable. These 20 SKUs ship with thin structured content:
   short spec sheet, no Q&A, no enriched description. They are deliberately
   concentrated in the mainstream and value tiers, which is where retailer
   product data is genuinely thinnest, and no Surface SKU is thin so the
   contrast is never read as a comment on one vendor. */
const THIN_NAMES = [
  'HP 15.6" Laptop (15-fd0000)',
  'Acer Aspire 3 15.6" (A315-24P)',
  'ASUS Vivobook 15 (F1504)',
  'Dell Inspiron 15 3520',

  'LG gram 16',

];

function portsFor(m) {
  if (m.u.includes('Gaming')) return '2x USB-C (Thunderbolt 4), 3x USB-A, HDMI 2.1, RJ-45, 3.5 mm combo';
  if (m.b === 'Apple') return m.f === 'MacBook Pro'
    ? '3x Thunderbolt 4 (USB-C), HDMI, SDXC, MagSafe 3, 3.5 mm'
    : '2x Thunderbolt 4 (USB-C), MagSafe 3, 3.5 mm';
  if (m.tr >= 4) return '2x USB-C (Thunderbolt 4), 1x USB-A, HDMI 2.1, 3.5 mm combo';
  if (m.os === 'ChromeOS') return '2x USB-C, 1x USB-A, microSD, 3.5 mm combo';
  return '1x USB-C, 2x USB-A, HDMI 1.4, SD card reader, 3.5 mm combo';
}

function build() {
  const items = [];
  let id = 1;

  for (const m of MODELS) {
    const brand = BRANDS.find(b => b.name === m.b);
    const gaming = m.u.includes('Gaming');
    const ports = portsFor(m);
    const contentRichness = THIN_NAMES.indexOf(m.n) >= 0 ? 'thin' : 'rich';

    const tags = [];
    if (m.r >= 4.7) tags.push('Top rated');
    if (m.w) tags.push('Save $' + (m.w - m.p));
    if (m.p < 500) tags.push('Budget pick');
    if (m.cb === 'Qualcomm' || (m.cpu.indexOf('Ultra') >= 0 && m.cpu.indexOf('V') > 0) || m.cpu.indexOf('Ryzen AI') >= 0) tags.push('Copilot+ PC');
    if (m.rc > 4000) tags.push('Best seller');
    if (id % 11 === 0) tags.push('New');

    items.push({
      id,
      sku: 'NV-' + String(100000 + id * 137).slice(0, 6),
      model: (m.b.slice(0, 2).toUpperCase() + '-' + String(4100 + id * 7)),
      brand: m.b,
      name: m.n,
      family: m.f,
      type: m.ty,
      use: m.u,
      price: m.p,
      wasPrice: m.w || null,
      financing: Math.round(m.p / 12),
      rating: m.r,
      reviewCount: m.rc,
      stars: starDistribution(m.r, m.rc),
      reviews: makeReviews(m.r, m.ram, ports.indexOf('USB-A') >= 0),
      tags,
      sponsored: id % 9 === 0,
      contentRichness,
      os: m.os,
      cpu: m.cpu,
      cpuBrand: m.cb,
      gpu: m.gpu,
      ram: m.ram + ' GB',
      ramGb: m.ram,
      storage: m.st >= 1024 ? (m.st / 1024) + ' TB SSD' : m.st + ' GB SSD',
      storageGb: m.st,
      screenSize: m.sz,
      resolution: m.res,
      panel: m.pan,
      refresh: m.hz + ' Hz',
      touch: !!m.t,
      battery: m.bat + ' hours',
      weight: m.wt.toFixed(2) + ' lbs',
      weightLb: m.wt,
      dimensions: `${(m.sz * 0.85).toFixed(2)} x ${(m.sz * 0.6).toFixed(2)} x ${(0.55 + (gaming ? 0.45 : 0.1)).toFixed(2)} in`,
      ports,
      wifi: m.tr >= 4 ? 'Wi-Fi 7 (802.11be)' : 'Wi-Fi 6E (802.11ax)',
      webcam: m.tr >= 3 ? '1080p FHD with privacy shutter' : '720p HD',
      keyboard: m.tr >= 2 ? 'Backlit, full-size' : 'Full-size',
      warranty: m.os === 'Windows 11 Pro' ? '3-year limited business warranty' : '1-year limited warranty',
      color: m.col,
      releaseYear: m.tr >= 4 ? 2026 : 2025,
      stock: rnd() > 0.12 ? 'In stock' : 'Low stock',
      deliveryDays: between(1, 4),
      pickup: rnd() > 0.25,
      openBox: m.rc > 1500 ? Math.round(m.p * 0.86) - 1 : null,
      hue: brand.hue + between(-8, 8)
    });
    id++;
  }
  return items;
}

const CATALOG = build();
if (typeof module !== 'undefined') module.exports = { CATALOG, BRANDS, USES, OS, TYPES };

const DEFAULT_SESSION = () => ({
  sessionId: 'S' + Date.now().toString(36).toUpperCase(),
  participantId: '',
  condition: 'B',
  mission: 0,
  startedAt: Date.now(),
  taskStartedAt: Date.now(),

  compare: [],
  maxCompared: 0,

  filters: { use: [], brand: [], os: [], cpu: [], type: [], ram: [], storage: [], screen: [],
             price: [null, null], rating: 0, touch: false, deals: false },
  sort: 'rec',
  page: 1,
  query: '',
  bookmarks: []
});

let S = DEFAULT_SESSION();
let EVENTS = [];
let MOD = false;          // moderator bar visible
let ASSIST_OPEN = false;

const LS_S = 'novi.session.v2';
const LS_E = 'novi.events.v2';

function cond() { return CONDITIONS[S.condition] || CONDITIONS.B; }
function P(id) { return CATALOG.find(p => p.id === id); }
function money(n) { return BRAND.symbol + n.toLocaleString('en-US'); }

/* ---- persistence -------------------------------------------------------- */
function save() {
  try {
    localStorage.setItem(LS_S, JSON.stringify(S));
    localStorage.setItem(LS_E, JSON.stringify(EVENTS.slice(-4000)));
  } catch (e) { /* storage full or blocked; session continues in memory */ }
}
function restore() {
  try {
    const s = localStorage.getItem(LS_S), e = localStorage.getItem(LS_E);
    if (s) {
      const saved = JSON.parse(s);
      S = Object.assign(DEFAULT_SESSION(), saved);
      /* backfill any filter keys added since the session was saved, so a
         participant mid-study never hits a broken build */
      S.filters = Object.assign(DEFAULT_SESSION().filters, saved.filters || {});
    }
    if (e) EVENTS = JSON.parse(e);
    return !!s;
  } catch (err) { return false; }
}

/* ---- instrumentation ---------------------------------------------------- */
function track(name, detail) {
  const now = Date.now();
  const ev = {
    ts: new Date(now).toISOString(),
    msSinceSession: now - S.startedAt,
    msSinceTask: now - S.taskStartedAt,
    sessionId: S.sessionId,
    participantId: S.participantId || 'unassigned',
    condition: S.condition,
    conditionLabel: cond().label,
    mission: S.mission,
    missionLabel: MISSIONS[S.mission].label,
    route: location.hash || '#/',
    event: name,
    detail: detail === undefined ? '' : (typeof detail === 'object' ? JSON.stringify(detail) : String(detail))
  };
  EVENTS.push(ev);
  save();
  paintLog();
  checkSuccess();
}

/* success is evaluated continuously, so time-to-success is real */
let SUCCESS_FIRED = false;
function checkSuccess() {
  if (SUCCESS_FIRED || !MISSIONS[S.mission]) return;
  let ok = false;
  try { ok = MISSIONS[S.mission].success(S); } catch (e) { ok = false; }
  if (ok) {
    SUCCESS_FIRED = true;
    const ms = Date.now() - S.taskStartedAt;
    EVENTS.push({
      ts: new Date().toISOString(), msSinceSession: Date.now() - S.startedAt, msSinceTask: ms,
      sessionId: S.sessionId, participantId: S.participantId || 'unassigned',
      condition: S.condition, conditionLabel: cond().label,
      mission: S.mission, missionLabel: MISSIONS[S.mission].label,
      route: location.hash || '#/', event: 'task_success', detail: 'ms=' + ms
    });
    save(); paintLog(); paintMod();
  }
}

/* scroll depth + dwell, sampled per route */
let _routeEnter = Date.now(), _maxScroll = 0, _lastRoute = '';
function scrollWatch() {
  const h = document.documentElement;
  const d = h.scrollHeight - h.clientHeight;
  const pct = d > 0 ? Math.round((h.scrollTop / d) * 100) : 0;
  if (pct > _maxScroll) _maxScroll = pct;
}
function leaveRoute() {
  if (!_lastRoute) return;
  track('page_exit', { route: _lastRoute, dwellMs: Date.now() - _routeEnter, maxScrollPct: _maxScroll });
}

function exportJSON() {
  const payload = {

      sessionId: S.sessionId, participantId: S.participantId || 'unassigned',

    },

function exportCSV() {
  const cols = ['ts','msSinceSession','msSinceTask','sessionId','participantId','condition','conditionLabel','mission','missionLabel','route','event','detail'];
  const esc = v => '"' + String(v === undefined ? '' : v).replace(/"/g, '""') + '"';
  const rows = [cols.join(',')].concat(EVENTS.map(e => cols.map(c => esc(e[c])).join(',')));
  download(`novi_${S.participantId || 'unassigned'}_${S.sessionId}.csv`, rows.join('\r\n'), 'text/csv');
  track('data_exported', 'csv');
}
function download(fname, text, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = fname; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

/* ---- routing ------------------------------------------------------------ */
const ROUTES = [
  [/^#\/$/,                       () => viewHome()],
  [/^#\/computers$/,              () => viewCategory()],
  [/^#\/laptops$/,                () => viewBrowse()],
  [/^#\/search$/,                 () => viewSearch()],
  [/^#\/search\?q=(.*)$/,         m  => { const q = decodeURIComponent(m[1].replace(/\+/g, ' '));
                                          if (S.query !== q) { S.query = q; save(); }
                                          return viewSearch(); }],
  [/^#\/product\/(\d+)$/,         m  => viewPDP(+m[1])],
  [/^#\/compare$/,                () => viewCompare()],
  [/^#\/advisor$/,                () => viewAdvisor()],
  [/^#\/collections\/([\w-]+)$/,  m  => viewCollection(m[1])],
  [/^#\/collections$/,            () => viewCollectionsIndex()],
  [/^#\/guide$/,                  () => viewGuide()],
  [/^#\/brand\/([\w%20-]+)$/,     m  => viewBrand(decodeURIComponent(m[1]))],
  [/^#\/cart$/,                   () => viewCart()],
  [/^#\/checkout$/,               () => viewCheckout()],
  [/^#\/order\/(\w+)$/,           m  => viewOrder(m[1])],
  [/^#\/research$/,               () => viewConsole()]
];

function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

function render() {
  const h = location.hash || '#/';
  if (h !== _lastRoute) {
    leaveRoute();
    _routeEnter = Date.now(); _maxScroll = 0; _lastRoute = h;
  }
  let handled = false;
  for (const [re, fn] of ROUTES) {
    const m = h.match(re);
    if (m) { document.getElementById('app').innerHTML = fn(m); handled = true; break; }
  }
  if (!handled) document.getElementById('app').innerHTML = view404();
  window.scrollTo(0, 0);
  paintChrome();
  afterRender(h);
}

/* per-route side effects that need the DOM to exist */
let _cdT = null;
function afterRender(h) {
  if (/^#\/laptops|^#\/search|^#\/brand|^#\/collections\//.test(h)) bindFacets();
  if (h === '#/' || h === '') { startHero(); tickCountdown(); clearInterval(_cdT); _cdT = setInterval(tickCountdown, 1000); }
  else clearInterval(_cdT);
  if (/^#\/product\/(\d+)$/.test(h)) {
    const id = +h.match(/(\d+)$/)[1];
    track('product_viewed', { id, sku: P(id).sku, name: P(id).name, richness: effectiveRichness(P(id)) });
  }
  if (h === '#/research') paintConsole();
  paintCompareBar();
}

/* ---------------- filtering + sorting + pagination ---------------- */
const PER_PAGE = 12;

function applyFilters(list) {
  /* the query only narrows results on the search route. Carrying it into browse,
     a brand shop or a collection would silently distort every later session. */
  const f = S.filters, q = /^#\/search/.test(location.hash) ? S.query.trim().toLowerCase() : '';
  return list.filter(p => {
    if (q) {
      const hay = (p.name + ' ' + p.brand + ' ' + p.use.join(' ') + ' ' + p.cpu + ' ' + p.os).toLowerCase();
      if (!q.split(/\s+/).every(t => hay.includes(t))) return false;
    }
    if (f.use.length && !f.use.some(u => p.use.includes(u))) return false;
    if (f.brand.length && !f.brand.includes(p.brand)) return false;
    if (f.os.length && !f.os.includes(p.os)) return false;
    if (f.cpu.length && !f.cpu.includes(p.cpuBrand)) return false;
    if (f.type.length && !f.type.includes(p.type)) return false;
    if (f.ram.length && !f.ram.includes(ramBand(p))) return false;
    if (f.storage.length && !f.storage.includes(storageBand(p))) return false;
    if (f.screen.length && !f.screen.includes(screenBand(p))) return false;
    if (f.price[0] != null && p.price < f.price[0]) return false;
    if (f.price[1] != null && p.price > f.price[1]) return false;
    if (f.rating && p.rating < f.rating) return false;
    if (f.touch && !p.touch) return false;
    if (f.deals && !p.wasPrice) return false;
    return true;
  });
}
function applySort(list) {
  const a = list.slice();
  const rank = cond().searchRank;
  if (S.sort === 'low') a.sort((x, y) => x.price - y.price);
  else if (S.sort === 'high') a.sort((x, y) => y.price - x.price);
  else if (S.sort === 'rating') a.sort((x, y) => y.rating - x.rating || y.reviewCount - x.reviewCount);
  else if (S.sort === 'selling') a.sort((x, y) => y.reviewCount - x.reviewCount);
  else if (S.sort === 'discount') a.sort((x, y) => ((y.wasPrice || y.price) - y.price) - ((x.wasPrice || x.price) - x.price));
  else if (S.sort === 'new') a.sort((x, y) => y.releaseYear - x.releaseYear || y.id - x.id);
  else {
    if (rank === 'popularity') a.sort((x, y) => y.reviewCount - x.reviewCount);
    else a.sort((x, y) => (y.rating * 40 + (y.tags.length * 8) + (y.sponsored ? 30 : 0)) -
                          (x.rating * 40 + (x.tags.length * 8) + (x.sponsored ? 30 : 0)));
    if (cond().sponsored) { const sp = a.filter(p => p.sponsored), rest = a.filter(p => !p.sponsored); return sp.slice(0, 2).concat(rest, sp.slice(2)); }
  }
  return a;
}

function ramBand(p) { return p.ramGb + ' GB'; }
function storageBand(p) { return p.storageGb >= 1024 ? (p.storageGb / 1024) + ' TB' : p.storageGb + ' GB'; }
function screenBand(p) {

function bandValues(base, fn, order) {

function facetCount(key, val, base) {
  return base.filter(p => key === 'use' ? p.use.includes(val)
    : key === 'brand' ? p.brand === val

    : key === 'type' ? p.type === val
    : key === 'ram' ? ramBand(p) === val
    : key === 'storage' ? storageBand(p) === val
    : key === 'screen' ? screenBand(p) === val
    : key === 'cpu' ? p.cpuBrand === val : false).length;

function activeFilterList() {
  const f = S.filters, out = [];
  ['use', 'brand', 'os', 'cpu', 'type', 'ram', 'storage', 'screen'].forEach(k => f[k].forEach(v => out.push(k + ':' + v)));
  if (f.price[0] != null || f.price[1] != null) out.push('price:' + (f.price[0] ?? '') + '-' + (f.price[1] ?? ''));
  if (f.rating) out.push('rating:' + f.rating);
  if (f.touch) out.push('touch:Touchscreen');
  if (f.deals) out.push('deals:On sale');
  return out;
}
function chipsBar() {
  const a = activeFilterList();
  if (!a.length) return '';
  return `<div class="chips">${a.map(x => `<span class="chip">${chipLabel(x)}
    <button onclick="removeFilter('${x}')" aria-label="Remove">×</button></span>`).join('')}
    <button class="chip" style="background:#fff" onclick="clearFilters()">Clear all</button></div>`;
}
function chipLabel(token) {
  const k = token.slice(0, token.indexOf(':')), v = token.slice(token.indexOf(':') + 1);
  if (k === 'price') {
    const [lo, hi] = v.split('-');
    if (lo && hi) return money(+lo) + ' to ' + money(+hi);
    if (hi) return 'Under ' + money(+hi);
    return money(+lo) + ' and up';
  }
  if (k === 'rating') return v + ' stars and up';
  return v;
}
function removeFilter(token) {
  const [k, v] = token.split(':');
  if (k === 'price') S.filters.price = [null, null];
  else if (k === 'rating') S.filters.rating = 0;
  else if (k === 'touch') S.filters.touch = false;
  else if (k === 'deals') S.filters.deals = false;
  else S.filters[k] = S.filters[k].filter(x => x !== v);
  S.page = 1; track('filter_removed', token); render();
}
function setSort(v) { S.sort = v; S.page = 1; track('sort_changed', v); render(); }
function setPage(n) { S.page = n; track('page_changed', n); render(); window.scrollTo(0, 240); }

function resultsGrid(list, emptyMsg) {
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total / PER_PAGE));
  if (S.page > pages) S.page = 1;
  const slice = list.slice((S.page - 1) * PER_PAGE, S.page * PER_PAGE);
  if (!total) return `<div class="empty"><b>${emptyMsg || 'No laptops match those filters.'}</b>
    <div style="margin-top:12px"><button class="btn out" onclick="clearFilters()">Clear filters</button></div></div>`;
  return `<div class="products">${slice.map(pcard).join('')}</div>
    ${pages > 1 ? pager(pages) : ''}`;
}
function pager(pages) {
  const cur = S.page;
  let btns = '';
  for (let i = 1; i <= pages; i++) btns += `<button class="${i === cur ? 'on' : ''}" onclick="setPage(${i})">${i}</button>`;
  return `<nav class="pager" aria-label="Pagination">
    <button onclick="setPage(${Math.max(1, cur - 1)})" ${cur === 1 ? 'disabled' : ''}>‹</button>
    ${btns}
    <button onclick="setPage(${Math.min(pages, cur + 1)})" ${cur === pages ? 'disabled' : ''}>›</button>
  </nav>`;
}

function heroCarousel() {

function heroSet(i, auto) {
  HERO_I = (i + HERO_SLIDES.length) % HERO_SLIDES.length;
  if (!auto) track('hero_slide_changed', HERO_I);
  const slides = document.querySelectorAll('.cslide');
  const dots = document.querySelectorAll('.cdots button');
  slides.forEach((el, n) => el.classList.toggle('on', n === HERO_I));
  dots.forEach((el, n) => el.classList.toggle('on', n === HERO_I));
}
function heroGo(d) { heroSet(HERO_I + d); }
function startHero() {
  clearInterval(HERO_T);
  HERO_T = setInterval(() => {
    if (!document.getElementById('carousel')) { clearInterval(HERO_T); return; }
    heroSet(HERO_I + 1, true);
  }, 7000);
}

function recentlyViewed() {
  const ids = [];
  for (let i = EVENTS.length - 1; i >= 0 && ids.length < 8; i--) {
    if (EVENTS[i].event !== 'product_viewed') continue;
    let id = null;
    try { id = JSON.parse(EVENTS[i].detail).id; } catch (e) { }
    if (id != null && !ids.includes(id)) ids.push(id);
  }
  return ids.map(P).filter(Boolean);
}

function tileGo(h) {
  S.filters = DEFAULT_SESSION().filters;
  S.page = 1; S.sort = 'rec';
  if (h.startsWith('use:')) S.filters.use = [h.slice(4)];
  else if (h.startsWith('type:')) S.filters.type = [h.slice(5)];
  else if (h.startsWith('os:')) S.filters.os = [h.slice(3)];
  else if (h.startsWith('price:')) S.filters.price = [null, +h.slice(6)];
  else if (h === 'touch') S.filters.touch = true;
  else if (h === 'deals') S.filters.deals = true;
  else if (h === 'rating') S.sort = 'rating';
  track('category_tile_clicked', h);
  go('#/laptops');
}

function doSearch(q) {
  S.query = q; S.page = 1;
  document.getElementById('q').value = q;
  closeAC();
  track('search_submitted', { query: q, results: applyFilters(CATALOG).length });
  go('#/search');
}
function submitSearch() { const v = document.getElementById('q').value.trim(); if (v) doSearch(v); }
function acInput() {
  const v = document.getElementById('q').value.trim().toLowerCase();
  const box = document.getElementById('ac');
  if (v.length < 2) { closeAC(); return; }
  const hits = CATALOG.filter(p => (p.name + ' ' + p.brand).toLowerCase().includes(v)).slice(0, 6);
  const terms = ['gaming laptop', 'laptop for school', 'lightweight laptop', '16gb laptop']
    .filter(t => t.includes(v)).slice(0, 2);
  if (!hits.length && !terms.length) { closeAC(); return; }
  box.innerHTML = terms.map(t => `<div onclick="doSearch('${t}')">🔍 <b>${t}</b></div>`).join('') +
    hits.map(p => `<div onclick="go('#/product/${p.id}')">${p.name} <span class="sub">· ${money(p.price)}</span></div>`).join('');
  box.classList.add('open');
  track('autocomplete_shown', { query: v, count: hits.length + terms.length });
}

      <table class="spectable">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>

        <span>${s.count.toLocaleString()}</span></div>`).join('')}</div></div>
      <div style="margin-top:18px">${p.reviews.map(r => `<div class="review">
        <b>${r.title}</b> ${starRow(r.stars)}

        <div>${r.body}</div></div>`).join('')}</div>`;
  }
  if (PDP_TAB === 'qa') {
    if (!rich) return `<div class="thinnote">No questions have been answered for this product yet.</div>`;

      ['Does this come with an office suite included?', 'It ships with the operating system only. Productivity software is sold separately.'],

function addToCart(id) {
  const line = S.cart.find(l => l.id === id);
  if (line) line.qty++; else S.cart.push({ id, qty: 1 });
  track('add_to_cart', { id, sku: P(id).sku, name: P(id).name, price: P(id).price, cartSize: S.cart.length });
  paintChrome(); toast(P(id).name + ' added to cart');

function setQty(id, d) {
  const l = S.cart.find(x => x.id === id); if (!l) return;
  l.qty += d;
  if (l.qty <= 0) { S.cart = S.cart.filter(x => x.id !== id); track('remove_from_cart', id); }
  else track('cart_qty_changed', { id, qty: l.qty });
  paintChrome(); render();
}

/* ===== app-assistant.js ===== */
/* ==========================================================================
   Part 5: scripted shopping assistant
   Deterministic, grounded strictly in CATALOG, no network, identical every run.
   Answer quality degrades on thin-data SKUs on purpose. That contrast is the
   point of the demo.
   ========================================================================== */

let ASSIST_MSGS = [];
let ASSIST_CTX = null;   // product currently under discussion

const ASSIST_CHIPS = [
  'Help me pick a laptop for school',
  'What is good for photo editing?',
  'Which of these has the best battery?',
  'Show me something under $700',
  'What is the difference between 8 GB and 16 GB?'
];

function paintAssistant() {
  const root = document.getElementById('assistroot');
  if (!root) return;
  if (!cond().assistant) { root.innerHTML = ''; return; }
  root.innerHTML = `
    ${ASSIST_OPEN ? '' : `<button class="asstbtn" onclick="toggleAssist(true)">Ask novi</button>`}
    <section class="asst ${ASSIST_OPEN ? 'open' : ''}" aria-label="Shopping assistant">
      <div class="head">
        <div><b>Shopping assistant</b><div style="font-size:11px;opacity:.85">Answers from novi's product data</div></div>
        <button onclick="toggleAssist(false)" aria-label="Close"
          style="background:none;border:0;color:#fff;font-size:22px;line-height:1">&times;</button>
      </div>
      <div class="body" id="amsgs">${ASSIST_MSGS.map(renderMsg).join('') || greeting()}</div>
      <div class="sugg">${ASSIST_CHIPS.map(c => `<button data-q="${esc(c)}" onclick="assistSend(this.dataset.q)">${c}</button>`).join('')}</div>
      <div class="sugg" style="border-top:0;gap:8px">
        <input id="ain" placeholder="Ask about any laptop" style="flex:1;padding:10px;border:1px solid #c3d2e3;border-radius:8px"
          onkeydown="if(event.key==='Enter')assistSubmit()">
        <button class="btn pri" onclick="assistSubmit()">Send</button>
      </div>
    </section>`;
  const m = document.getElementById('amsgs');
  if (m) m.scrollTop = m.scrollHeight;
}
function greeting() {
  return `<div class="msg a"><div class="bub">Hi. I can help you narrow this down.
    Tell me what you'll use the laptop for, or ask me about anything on the site.</div></div>`;
}
function renderMsg(m) {
  return `<div class="msg ${m.role}"><div class="bub">${m.text}
    ${m.cards && m.cards.length ? m.cards.map(id => acard(P(id))).join('') : ''}
    ${m.actions ? `<div style="margin-top:10px;display:flex;gap:7px;flex-wrap:wrap">${m.actions}</div>` : ''}</div></div>`;
}
function acard(p) {
  if (!p) return '';
  return `<div class="asstcard" onclick="track('assistant_card_clicked','${p.sku}');go('#/product/${p.id}')">
    ${vizLap(p)}
    <div style="flex:1"><b>${p.name}</b><small>${money(p.price)} · ${p.ram} · ${p.storage} · ${p.rating} ★</small></div>
    <button class="btn pri" style="padding:7px 11px;font-size:12px;align-self:center"
      onclick="event.stopPropagation();addToCart(${p.id})">Add</button>
  </div>`;
}

function toggleAssist(on) {
  ASSIST_OPEN = on;
  track(on ? 'assistant_opened' : 'assistant_closed', location.hash);
  paintAssistant();
  if (on) setTimeout(() => { const i = document.getElementById('ain'); if (i) i.focus(); }, 60);
}
function assistSubmit() {
  const i = document.getElementById('ain');
  if (!i || !i.value.trim()) return;
  const v = i.value.trim(); i.value = '';
  assistSend(v);
}
function assistSend(text) {
  ASSIST_MSGS.push({ role: 'u', text: esc(text) });
  track('assistant_question', text);
  paintAssistant();
  const reply = assistAnswer(text);
  setTimeout(() => {
    ASSIST_MSGS.push(reply);
    track('assistant_answer', { grounded: reply.grounded, hedged: !!reply.hedged });
    paintAssistant();
  }, 420);
}
function askAboutProduct(id) {
  ASSIST_CTX = id;
  ASSIST_OPEN = true;
  paintAssistant();
  assistSend('Tell me about the ' + P(id).name);
}

/* ---- intent matching ----------------------------------------------------- */
/* Real model names are long ("Surface Laptop, 7th Edition 13.8""), so a shopper
   never types them in full. Match on brand and product family instead, on whole
   words, and ignore family words that are too generic to identify anything. */
const GENERIC_TOKENS = new Set(['laptop','laptops','chromebook','book','plus','gaming',
  'pro','air','go','slim','flex','ultra','x','s','edition','the','and']);

function familyTokens(p) {
  return [...new Set((p.brand + ' ' + p.family).toLowerCase().split(/[^a-z0-9]+/))]
    .filter(t => t.length > 1);
}
/* The words that actually identify a product line: the family, minus its brand
   and minus words too generic to name anything ("laptop", "pro", "plus"). */
function keyTokens(p) {
  const brand = new Set(p.brand.toLowerCase().split(/[^a-z0-9]+/));
  return p.family.toLowerCase().split(/[^a-z0-9]+/)
    .filter(t => t.length > 1 && !GENERIC_TOKENS.has(t) && !brand.has(t));
}
function hasWord(q, t) {
  return new RegExp('\\b' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(q);
}
function matchProduct(q) {
  let best = null, bestScore = 0;
  for (const p of CATALOG) {
    const key = keyTokens(p);
    if (!key.length) continue;                       // nothing distinctive to match on
    if (!key.every(t => hasWord(q, t))) continue;    // every distinctive word must be present
    let score = familyTokens(p).filter(t => hasWord(q, t)).length * 10;
    if (q.includes(String(p.screenSize))) score += 25;
    if (q.includes(p.name.toLowerCase())) score += 100;
    score += p.rating;                               // stable tie-break
    if (score > bestScore) { bestScore = score; best = p; }
  }
  return best;
}

function assistAnswer(qRaw) {
  const q = qRaw.toLowerCase();

  // 1. a named product, or the product currently in context
  let target = matchProduct(q);
  if (!target && ASSIST_CTX && /\b(it|this|that|the laptop)\b/.test(q)) target = P(ASSIST_CTX);
  if (target) { ASSIST_CTX = target.id; return answerAboutProduct(target, q); }

  // 2. concept explainers
  const concept = CONCEPTS.find(c => c.re.test(q));
  if (concept) return { role: 'a', text: concept.a, grounded: 'general' };

  // 3. otherwise treat it as a shortlist request
  return answerShortlist(q);
}

const CONCEPTS = [
  { re: /8\s*gb.*16\s*gb|16\s*gb.*8\s*gb|how much (ram|memory)|difference.*(ram|memory)/,
    a: `Memory is how much the laptop holds in its head at once. <b>8 GB</b> copes with browsing, documents and video calls, but it slows down with a lot of tabs and apps open. <b>16 GB</b> is the comfortable modern baseline and is what I would pick if the machine needs to last four or five years. <b>32 GB</b> only pays off for video editing or large photo libraries.` },
  { re: /ssd|hard drive|storage|how much space|gb.*storage/,
    a: `Storage is what you keep on it. 256 GB fills faster than people expect once photos and downloads pile up. <b>512 GB</b> is the safe default for most people. All the laptops here use solid-state storage, so all of them boot quickly.` },
  { re: /oled|panel|ips|screen type|display type/,
    a: `<b>IPS</b> panels are accurate and cost less. <b>OLED</b> gives you true blacks and much better contrast, which matters for film and photo work, but costs more and uses more battery. High refresh rates above 60 Hz mainly help gaming.` },
  { re: /refresh rate|hz/,
    a: `Refresh rate is how many times a second the screen redraws. 60 Hz is fine for everyday work. 120 Hz and above makes motion look smoother and is worth it for gaming.` },
  { re: /warranty|returns|return policy/,
    a: `Everything here carries at least a one-year limited warranty, and some models carry two. Returns are 15 days, free, in store or by post. A two-year protection plan covering accidental damage can be added on any product page.` },
  { re: /windows|chromeos|macos|operating system|which os/,
    a: `<b>Windows</b> runs the widest range of software and covers everything from budget machines to gaming. <b>ChromeOS</b> is simple, cheap and secure but relies on web apps. <b>macOS</b> is efficient and well integrated if the rest of your devices already are. You can filter by operating system on the laptops page.` }
];

/* ---- product answers, where richness bites ------------------------------- */
function answerAboutProduct(p, q) {
  const rich = effectiveRichness(p) === 'rich';
  const wantsBattery = /battery|last|charge/.test(q);
  const wantsWeight = /weight|heavy|light|carry|travel/.test(q);
  const wantsPorts = /port|hdmi|usb|thunderbolt|connect/.test(q);
  const wantsGaming = /game|gaming|fps|graphics|gpu/.test(q);

  if (!rich) {
    // thin data: the assistant can only answer from five published attributes
    let gap = 'the full specification';
    if (wantsBattery) gap = 'battery life';
    else if (wantsWeight) gap = 'weight and dimensions';
    else if (wantsPorts) gap = 'the port selection';
    else if (wantsGaming) gap = 'the graphics hardware';
    return {
      role: 'a', grounded: 'thin', hedged: true,
      text: `I can only tell you part of this. The listing for the <b>${p.name}</b> publishes
        five attributes: ${p.os}, ${p.cpu}, ${p.ram}, ${p.storage} and a ${p.screenSize}" display, at ${money(p.price)}.
        <b>${gap.charAt(0).toUpperCase() + gap.slice(1)} is not supplied for this model</b>, so I would be guessing,
        and I would rather not guess on something you're spending ${money(p.price)} on.
        <span class="hedge">Answer limited by missing product data.</span>`,
      cards: [p.id],
      actions: `<button class="btn out" onclick="assistSend('Show me something similar with full details')">Show me one with full details</button>`
    };
  }

  let text = `The <b>${p.name}</b> is ${money(p.price)}. It runs ${p.os} on ${p.cpu} with ${p.ram} of memory and ${p.storage}.`;
  if (wantsBattery) text += ` Battery is rated up to <b>${p.battery}</b>, which in real use with the screen at half brightness usually means a full working day${parseInt(p.battery) >= 12 ? ' with room to spare' : ''}.`;
  if (wantsWeight) text += ` It weighs <b>${p.weight}</b> and measures ${p.dimensions}, so it ${parseFloat(p.weight) < 3.2 ? 'travels easily' : 'is better suited to sitting on a desk'}.`;
  if (wantsPorts) text += ` Ports: ${p.ports}.`;
  if (wantsGaming) text += ` Graphics are handled by ${p.gpu}, which ${/RTX|Radeon RX/.test(p.gpu) ? 'is dedicated hardware and will run modern titles well' : 'is integrated, so it is fine for everyday work but not for demanding games'}.`;
  if (!wantsBattery && !wantsWeight && !wantsPorts && !wantsGaming)
    text += ` The ${p.screenSize}" ${p.panel} runs at ${p.resolution}, battery is rated up to ${p.battery}, and it weighs ${p.weight}. It suits ${p.use.join(', ').toLowerCase()}.`;
  text += ` It holds ${p.rating} stars across ${p.reviewCount.toLocaleString()} reviews.`;

  return { role: 'a', grounded: 'rich', text, cards: [p.id] };
}

/* ---- shortlist answers --------------------------------------------------- */
function answerShortlist(q) {
  let list = CATALOG.slice();
  const notes = [];

  const budget = q.match(/\$?\s?(\d{3,4})/);
  if (budget && /under|below|less than|max|budget|cheap/.test(q)) {
    const cap = +budget[1]; list = list.filter(p => p.price <= cap); notes.push('under ' + money(cap));
  }
  const useMap = [[/school|student|college|study|homework/, 'School'], [/work|office|business|meetings|home working/, 'Work'],
                  [/photo|video|creative|design|edit|render/, 'Creative'], [/game|gaming|fps/, 'Gaming'],
                  [/everyday|browsing|email|streaming|basic|simple/, 'Everyday']];
  const use = useMap.find(u => u[0].test(q));
  if (use) { list = list.filter(p => p.use.includes(use[1])); notes.push('for ' + use[1].toLowerCase()); }
  if (/chromebook|chromeos/.test(q)) { list = list.filter(p => p.os === 'ChromeOS'); notes.push('ChromeOS'); }
  if (/mac|macos/.test(q)) { list = list.filter(p => p.os === 'macOS'); notes.push('macOS'); }
  if (/windows/.test(q)) { list = list.filter(p => /Windows/.test(p.os)); notes.push('Windows'); }
  if (/light|thin|portable|carry|travel/.test(q)) { list.sort((a, b) => parseFloat(a.weight) - parseFloat(b.weight)); notes.push('lightest first'); }
  else if (/battery|all.?day|long lasting/.test(q)) { list.sort((a, b) => parseInt(b.battery) - parseInt(a.battery)); notes.push('longest battery first'); }
  else if (/cheap|budget|afford|low price/.test(q)) { list.sort((a, b) => a.price - b.price); notes.push('lowest price first'); }
  else list.sort((a, b) => (b.rating - b.price / 3000) - (a.rating - a.price / 3000) || b.reviewCount - a.reviewCount);

  if (!list.length) {
    return { role: 'a', grounded: 'catalog', hedged: true,
      text: `Nothing in the range matches all of that. If you can relax one of the constraints, price is usually the one with most give. Or I can show you the closest three.`,
      actions: `<button class="btn out" onclick="assistSend('Show me the closest options')">Show closest options</button>` };
  }

  const picks = list.slice(0, 3);
  const why = picks.map(p => `<b>${p.name}</b> at ${money(p.price)}, ${p.ram} and ${p.storage}, ${p.battery} battery, ${p.rating} stars`);
  return {
    role: 'a', grounded: 'catalog',
    text: `${list.length} laptops fit${notes.length ? ' ' + notes.join(', ') : ''}. The three I would look at first:
      <br><br>${why.map((w, i) => (i + 1) + '. ' + w).join('<br>')}
      <br><br>${picks[0].price < picks[2].price
        ? `The ${picks[0].name} is the value pick. Stepping up to the ${picks[2].name} buys you ${picks[2].ramGb > picks[0].ramGb ? 'more memory' : 'a better screen'} for ${money(picks[2].price - picks[0].price)} more.`
        : `They are close on price, so this comes down to size and screen.`}`,
    cards: picks.map(p => p.id),
    actions: `<button class="btn out" onclick="S.compare=[${picks.map(p => p.id).join(',')}];track('assistant_compare_built');go('#/compare')">Compare these three</button>`
  };
}

    </div>
    <div class="legal"><span>Prototype. No payments are processed and no orders are placed.</span>
      <span>Built for research use only.</span></div>
  </div></footer>

  <div id="cmpbar" class="cmpbar">
    <span id="cmptext">0 selected to compare</span>
    <button class="btn ghost" onclick="clearCompare()">Clear</button>
    <button class="btn pri" onclick="go('#/compare')">Compare now</button>
  </div>

  <div id="assistroot"></div>
  <div id="toast" class="toast"></div>
  <div id="back" class="back"><div class="modal" id="mbox"></div></div>`;
}

function paintChrome() {
  const n = S.cart.reduce((s, l) => s + l.qty, 0);
  const b = document.getElementById('cartn');
  if (b) b.textContent = n;
  paintMod();
  paintMission();
  paintAssistant();
}

function paintMission() {
  const el = document.getElementById('missionbar');
  if (!el) return;
  const m = MISSIONS[S.mission];
  const on = S.mission && m;
  el.className = 'missionbar' + (on ? ' show' : '');
  el.innerHTML = on
    ? `<div class="wrap"><b>Your task</b> ${m.brief}${SUCCESS_FIRED ? '<span class="donetag">Done</span>' : ''}</div>`
    : '';
}

/* ---------------- moderator bar ---------------- */
function paintMod() {
  const bar = document.getElementById('modbar');
  if (!bar) return;
  document.body.classList.toggle('hasmod', MOD);
  if (!MOD) { bar.innerHTML = ''; bar.classList.remove('show'); return; }
  bar.classList.add('show');
  bar.innerHTML = `
    <b style="color:#7ee787;letter-spacing:.5px">MODERATOR</b>
    <label>Participant <input value="${esc(S.participantId || '')}" placeholder="P001" style="width:74px"
      onchange="setParticipant(this.value)"></label>
    <label>Condition <select onchange="setCondition(this.value)">
      ${Object.keys(CONDITIONS).map(k => `<option value="${k}" ${S.condition === k ? 'selected' : ''}>${CONDITIONS[k].label}</option>`).join('')}
    </select></label>
    <label>Task <select onchange="setMission(this.value)">
      ${Object.keys(MISSIONS).map(k => `<option value="${k}" ${String(S.mission) === k ? 'selected' : ''}>${MISSIONS[k].label}</option>`).join('')}
    </select></label>
    <span>${SUCCESS_FIRED ? '<b style="color:#7ee787">TASK COMPLETE</b>' : 'in progress'} &middot; ${EVENTS.length} events &middot; ${elapsed()}</span>
    <span class="sp">
      <button onclick="bookmark()">Flag moment</button>
      <button class="gh" onclick="softReset()">Reset journey</button>
      <button class="gh" onclick="go('#/research')">Console</button>
      <button class="gh" onclick="MOD=false;paintMod()">Hide</button>
    </span>`;
}
function elapsed() {
  const s = Math.floor((Date.now() - S.startedAt) / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

/* ---------------- research console ---------------- */
function viewConsole() {
  return `<div class="sectionhead" style="margin-top:22px">
      <div><h1 class="h1">Research console</h1>
      <p class="sub">Moderator only. Participants should not see this screen.</p></div>
      <button class="btn ghost" onclick="go('#/')">Back to store</button></div>
    <div class="console" id="consolebody"></div>`;
}
function paintConsole() {
  const el = document.getElementById('consolebody');
  if (!el) return;
  const c = cond(), m = MISSIONS[S.mission];
  const viewed = new Set(EVENTS.filter(e => e.event === 'product_viewed').map(e => e.detail)).size;
  el.innerHTML = `
  <div>
    <div class="statgrid">
      ${stat('Participant', S.participantId || '&mdash;')}
      ${stat('Condition', S.condition)}
      ${stat('Elapsed', elapsed())}
      ${stat('Events', EVENTS.length)}
      ${stat('Products viewed', viewed)}
      ${stat('Task', SUCCESS_FIRED ? 'done' : 'open')}
    </div>

    <div class="card panel">
      <h3>Session controls</h3>
      <div class="field"><label>Participant ID</label>
        <input value="${esc(S.participantId || '')}" placeholder="P001" onchange="setParticipant(this.value)"></div>
      <div class="field"><label>Condition</label>
        <select onchange="setCondition(this.value)">
          ${Object.keys(CONDITIONS).map(k => `<option value="${k}" ${S.condition === k ? 'selected' : ''}>${CONDITIONS[k].label}</option>`).join('')}
        </select>
        <p class="sub" style="font-size:11px;margin-top:6px">${condSummary(c)}</p></div>
      <div class="field"><label>Task</label>
        <select onchange="setMission(this.value)">
          ${Object.keys(MISSIONS).map(k => `<option value="${k}" ${String(S.mission) === k ? 'selected' : ''}>${MISSIONS[k].label}</option>`).join('')}
        </select>
        <p class="sub" style="font-size:11px;margin-top:6px">${m ? m.brief : ''}</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn out" onclick="softReset()">Soft reset, keep data</button>
        <button class="btn ghost" onclick="hardReset()">New participant, wipe data</button>
      </div>
    </div>

    <div class="card panel" style="margin-top:16px">
      <h3>Export and handoff</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn pri" onclick="exportCSV()">Download CSV</button>
        <button class="btn out" onclick="exportJSON()">Download JSON</button>
        <button class="btn ghost" onclick="copyLink()">Copy session link</button>
        <button class="btn ghost" onclick="showConsent()">Show consent screen</button>
      </div>
      <p class="sub" style="font-size:11px;margin-top:9px">The session link reopens the store with this condition,
        task and participant already set, so an unmoderated participant lands in the right cell.</p>
      ${S.bookmarks.length ? `<h3 style="margin-top:18px">Flagged moments</h3>
        <div class="kv">${S.bookmarks.map(b => `<div>${(b.msSinceTask / 1000).toFixed(0)}s</div><div>${b.route}</div>`).join('')}</div>` : ''}
    </div>
  </div>

  <div class="card panel">
    <h3>Live event stream</h3>
    <div id="log" class="evtlog"></div>
  </div>`;
  paintLog();
}
function stat(k, v) { return `<div class="stat"><b>${v}</b><span>${k}</span></div>`; }
function condSummary(c) {
  return ['assistant ' + (c.assistant ? 'on' : 'off'), 'PDP ' + c.pdpContent,
    'collections ' + (c.collections ? 'on' : 'off'), 'sponsored ' + (c.sponsored ? 'on' : 'off'),
    'advisor ' + c.advisor, 'search ' + c.searchRank, 'reviews ' + c.reviews].join(' · ');
}
function paintLog() {
  const el = document.getElementById('log');
  if (!el) return;
  el.innerHTML = EVENTS.slice(-300).reverse().map(e => `<div>
    <span class="t">${(e.msSinceTask / 1000).toFixed(1)}s</span>
    <span class="n">${e.event}</span>
    <span class="v">${esc(e.detail || '').slice(0, 120)}</span></div>`).join('')
    || '<div style="padding:12px;color:#93a3b8">No events yet.</div>';
}
function copyLink() {
  const base = location.href.split('#')[0].split('?')[0];
  const url = `${base}?cond=${S.condition}&mission=${S.mission}&consent=1${S.participantId ? '&pid=' + encodeURIComponent(S.participantId) : ''}#/`;
  if (navigator.clipboard) navigator.clipboard.writeText(url);
  track('session_link_copied', url);
  toast('Session link copied');
}

/* ---------------- toast and modal ---------------- */
let _toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => t.classList.remove('show'), 2300);
}
function openModal(html, size) {
  const box = document.getElementById('mbox');
  box.className = 'modal' + (size === 'sm' ? ' sm' : '');
  box.innerHTML = html;
  document.getElementById('back').classList.add('open');
}
function closeModal() { document.getElementById('back').classList.remove('open'); }

/* ---------------- consent ---------------- */
function showConsent() {
  openModal(`<h2 class="h2">Before we begin</h2>
    <p class="sub" style="margin:12px 0">You are about to use a prototype shopping website built for research.
    Novi is not a real retailer. The products are real models, but the prices, stock, delivery dates and
    customer reviews shown here are simulated. Nothing you do places a real order, and no payment is ever taken.</p>
    <p class="sub" style="margin-bottom:14px">We record what you click and how long you spend on each page.
    We do not collect your name, your email or any personal information. Your session is identified only
    by a code the moderator assigns. You can stop at any time.</p>
    <button class="btn pri lg" onclick="acceptConsent()">I understand, start</button>`, 'sm');
}
function acceptConsent() { S.consented = true; save(); track('consent_given'); closeModal(); }

/* ---------------- boot ---------------- */
function boot() {
  document.body.innerHTML = shell();

  const qs = new URLSearchParams(location.search);
  const had = restore();

  if (qs.get('mod') === '1') MOD = true;
  if (qs.get('cond') && CONDITIONS[qs.get('cond')]) setCondition(qs.get('cond'), true);
  if (qs.get('mission') && MISSIONS[qs.get('mission')]) setMission(qs.get('mission'), true);
  if (qs.get('pid')) { S.participantId = qs.get('pid'); save(); }

  window.addEventListener('hashchange', render);
  window.addEventListener('scroll', scrollWatch, { passive: true });
  window.addEventListener('beforeunload', leaveRoute);
  document.addEventListener('click', e => { if (!e.target.closest('.searchbox')) closeAC(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeAC(); }
    if (e.altKey && e.shiftKey && /^m$/i.test(e.key)) { MOD = !MOD; paintMod(); }
    if (e.altKey && e.shiftKey && /^r$/i.test(e.key)) softReset();
  });
  document.getElementById('back').addEventListener('click', e => { if (e.target.id === 'back') closeModal(); });

  if (!location.hash) location.hash = '#/';
  render();
  if (!had) track('session_started', 'condition=' + S.condition);
  if (qs.get('consent') === '1' && !S.consented) showConsent();
  setInterval(() => { if (MOD) paintMod(); }, 5000);
}
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
